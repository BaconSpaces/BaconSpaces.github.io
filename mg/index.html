MG.register('pillpress', {
    title: 'Pill Press',
    hint: 'SPACE / click when the press is fully down on the die',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 360, H = 300;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const need = 4 + diff;
        const maxWrong = Math.max(2, 5 - diff);
        const window = Math.max(0.1, 0.24 - diff * 0.025);
        let phase = 0, spd = 0.03 + diff * 0.006, made = 0, wrong = 0, done = false, flash = 0;

        api.setDots(need);

        function press() {
            if (done) return;
            const pos = (1 - Math.cos(phase)) / 2; // 0 top .. 1 bottom
            if (pos >= 1 - window) {
                made++; api.sfx('latch'); flash = 6; spd += 0.002;
                api.setDots(need, Array.from({ length: need }, (_, i) => i < made ? 'done' : ''));
                if (made >= need) { done = true; api.stopTimer(); api.setTag('PRESSED'); setTimeout(() => api.succeed(), 300); }
            } else {
                wrong++; api.shake();
                if (wrong >= maxWrong) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 300); }
            }
        }
        function key(e) { if (e.code === 'Space') { e.preventDefault(); press(); } }
        document.addEventListener('keydown', key);
        cvs.addEventListener('click', press);

        api.setTag('PRESSING');
        api.startTimer(Math.max(16, 28 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); document.removeEventListener('keydown', key); setTimeout(() => api.fail(), 200); } });

        function draw() {
            if (!done) phase += spd;
            const pos = (1 - Math.cos(phase)) / 2;
            ctx.clearRect(0, 0, W, H);

            const cx = W / 2, topY = 40, travel = 120, dieY = topY + travel + 26;
            // frame posts
            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.moveTo(cx - 70, 30); ctx.lineTo(cx - 70, dieY + 20); ctx.moveTo(cx + 70, 30); ctx.lineTo(cx + 70, dieY + 20); ctx.stroke();
            // die / target zone
            const inWin = pos >= 1 - window;
            ctx.fillStyle = 'rgba(57,217,138,0.15)'; ctx.fillRect(cx - 46, dieY - 6, 92, 14);
            ctx.strokeStyle = inWin ? suc : 'rgba(57,217,138,0.5)'; ctx.lineWidth = 2; ctx.strokeRect(cx - 46, dieY - 6, 92, 14);
            // press head
            const hy = topY + travel * pos;
            ctx.fillStyle = flash > 0 ? suc : acc; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = inWin ? 16 : 6;
            ctx.fillRect(cx - 40, hy - 30, 80, 30); ctx.shadowBlur = 0;
            if (flash > 0) flash--;

            // pills made
            for (let i = 0; i < need; i++) {
                ctx.fillStyle = i < made ? suc : 'rgba(255,255,255,0.12)';
                ctx.beginPath(); ctx.ellipse(cx - (need - 1) * 9 + i * 18, dieY + 40, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
            }
            // strike dots
            for (let i = 0; i < maxWrong; i++) { ctx.fillStyle = i < wrong ? dng : 'rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.arc(20 + i * 14, 24, 4, 0, Math.PI * 2); ctx.fill(); }

            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
});


/* ---- pulse.js ---- */
MG.register('pulse', {
    title: 'Pulse',
    hint: 'Hit D F J K as notes cross the line',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const LANES = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'];
        const LABEL = ['D', 'F', 'J', 'K'];
        const W = 360, H = 320, laneW = W / 4, strikeY = H - 50;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const total = 12 + diff * 3;
        const speed = 1.5 + diff * 0.7;
        const spawnGap = Math.max(30, 78 - diff * 8);
        const needPct = 0.6 + diff * 0.05;

        let notes = [], spawned = 0, hits = 0, judged = 0, frame = 0, flash = {};
        const done = () => judged >= total;

        function key(e) {
            const lane = LANES.indexOf(e.code);
            if (lane < 0) return; e.preventDefault();
            flash[lane] = 6;
            let best = null, bestD = 9999;
            notes.forEach((n) => {
                if (n.lane === lane && !n.hit && !n.missed) {
                    const d = Math.abs(n.y - strikeY);
                    if (d < bestD) { bestD = d; best = n; }
                }
            });
            if (best && bestD < 26) { best.hit = true; hits++; judged++; }
            else { /* wrong/early tap: light penalty */ judged += 0; }
            checkEnd();
        }
        document.addEventListener('keydown', key);

        function checkEnd() {
            if (done()) {
                document.removeEventListener('keydown', key);
                api.stopTimer();
                const pass = (hits / total) >= needPct;
                api.setTag(Math.round(hits / total * 100) + '% ACCURACY');
                setTimeout(() => pass ? api.succeed() : api.fail(), 350);
            }
        }

        api.setTag('SYNCING');
        api.startTimer(Math.max(14, 26 - diff), () => {
            document.removeEventListener('keydown', key);
            const pass = (hits / total) >= needPct;
            setTimeout(() => pass ? api.succeed() : api.fail(), 200);
        });

        function draw() {
            frame++;
            if (spawned < total && frame % spawnGap === 0) {
                notes.push({ lane: api.randInt(0, 3), y: -20, hit: false, missed: false });
                spawned++;
            }
            ctx.clearRect(0, 0, W, H);
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            const dng = (getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#ff3b5c').trim();

            for (let i = 0; i < 4; i++) {
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.strokeRect(i * laneW, 0, laneW, H);
                ctx.fillStyle = flash[i] > 0 ? acc : 'rgba(255,255,255,0.08)';
                ctx.fillRect(i * laneW + 4, strikeY - 6, laneW - 8, 12);
                ctx.fillStyle = flash[i] > 0 ? '#0a0e14' : 'rgba(255,255,255,0.5)';
                ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(LABEL[i], i * laneW + laneW / 2, strikeY);
                if (flash[i] > 0) flash[i]--;
            }
            ctx.strokeStyle = acc; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, strikeY); ctx.lineTo(W, strikeY); ctx.stroke();

            notes.forEach((n) => {
                if (n.hit) return;
                n.y += speed;
                if (n.y > strikeY + 26 && !n.missed) { n.missed = true; judged++; }
                ctx.fillStyle = n.missed ? dng : acc;
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = n.missed ? 0 : 8;
                const x = n.lane * laneW + 6, w = laneW - 12;
                roundRect(x, n.y - 9, w, 18, 5); ctx.fill();
                ctx.shadowBlur = 0;
            });
            notes = notes.filter((n) => n.y < H + 30 && !n.hit);

            if (done()) { checkEnd(); return; }
            loop = requestAnimationFrame(draw);
        }
        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
});


/* ---- quicktime.js ---- */
MG.register('quicktime', {
    title: 'Quicktime',
    hint: 'Press the keys in order, fast',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const len = 4 + diff * 2;
        const perKey = Math.max(0.7, 2.3 - diff * 0.3);
        const KEYS = ['Q','W','E','R','A','S','D','F','Z','X','C','V'];
        const seq = Array.from({ length: len }, () => KEYS[api.randInt(0, KEYS.length - 1)]);

        let idx = 0, ended = false, keyTimer = null;

        const box = document.createElement('div');
        box.style.cssText = 'display:flex;flex-direction:column;gap:20px;align-items:center;width:480px;';
        box.innerHTML = `
            <div class="label">INPUT SEQUENCE</div>
            <div id="keys" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;"></div>
            <div id="kbar" style="width:300px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;">
                <div id="kfill" style="height:100%;width:100%;background:var(--accent);"></div>
            </div>`;
        api.board.appendChild(box);
        const keysEl = box.querySelector('#keys');
        const kfill = box.querySelector('#kfill');

        function render() {
            keysEl.innerHTML = '';
            seq.forEach((k, i) => {
                const d = document.createElement('div');
                const state = i < idx ? 'done' : (i === idx ? 'active' : '');
                d.style.cssText = `width:42px;height:42px;border-radius:8px;display:grid;place-items:center;
                    font-family:var(--display);font-weight:700;font-size:18px;border:2px solid var(--line);
                    ${state === 'done' ? 'border-color:var(--success);color:var(--success);' : ''}
                    ${state === 'active' ? 'border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px -2px var(--accent);transform:scale(1.12);' : ''}
                    ${state === '' ? 'color:var(--muted);' : ''}`;
                d.textContent = k;
                keysEl.appendChild(d);
            });
        }

        let keyStart = 0, raf = null;
        function startKeyTimer() {
            keyStart = performance.now();
            const tick = () => {
                const el = performance.now() - keyStart;
                const p = Math.max(0, 1 - el / (perKey * 1000));
                kfill.style.width = (p * 100) + '%';
                kfill.style.background = p < 0.3 ? 'var(--danger)' : 'var(--accent)';
                if (p <= 0) { fail(); return; }
                raf = requestAnimationFrame(tick);
            };
            raf = requestAnimationFrame(tick);
        }
        function stopKeyTimer() { if (raf) cancelAnimationFrame(raf); raf = null; }

        function key(e) {
            if (ended) return;
            const k = e.key.toUpperCase();
            if (!KEYS.includes(k)) return;
            e.preventDefault();
            if (k === seq[idx]) {
                idx++; stopKeyTimer(); render();
                if (idx >= len) { win(); return; }
                startKeyTimer();
            } else { fail(); }
        }
        document.addEventListener('keydown', key);

        function win() { if (ended) return; ended = true; cleanup(); api.stopTimer(); setTimeout(() => api.succeed(), 250); }
        function fail() { if (ended) return; ended = true; api.shake(); cleanup(); api.stopTimer(); setTimeout(() => api.fail(), 200); }
        function cleanup() { stopKeyTimer(); document.removeEventListener('keydown', key); }

        api.setTag('REACT');
        api.startTimer(perKey * len + 2, () => fail());
        render(); startKeyTimer();
        return { destroy() { cleanup(); } };
    }
});


/* ---- reaction.js ---- */
MG.register('reaction', {
    title: 'Reaction',
    hint: 'Wait for GREEN, then SPACE / click — don’t jump early',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const rounds = 3;
        const threshold = Math.max(280, 850 - diff * 95);
        const W = 360, H = 240;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        let state = 'red', greenAt = 0, round = 0, ended = false, last = 0, waitTO = null;
        api.setDots(rounds);
        scheduleGreen();

        function scheduleGreen() {
            state = 'red';
            const delay = api.rand(900, 2600);
            clearTimeout(waitTO);
            waitTO = setTimeout(() => { state = 'green'; greenAt = performance.now(); }, delay);
        }
        function tap() {
            if (ended) return;
            if (state === 'red') { fail('TOO EARLY'); return; }
            if (state === 'green') {
                const rt = performance.now() - greenAt;
                last = Math.round(rt);
                if (rt <= threshold) {
                    round++;
                    api.setDots(rounds, Array.from({ length: rounds }, (_, i) => i < round ? 'done' : ''));
                    if (round >= rounds) { win(); return; }
                if (round >= rounds) { win(); return; } api.sfx('beep');
                    state = 'wait'; setTimeout(scheduleGreen, 500);
                } else { fail('TOO SLOW ' + last + 'ms'); }
            }
        }
        function key(e) { if (e.code === 'Space') { e.preventDefault(); tap(); } }
        document.addEventListener('keydown', key);
        cvs.addEventListener('click', tap);

        function win() { if (ended) return; ended = true; cleanup(); api.stopTimer(); setTimeout(() => api.succeed(), 250); }
        function fail(msg) { if (ended) return; ended = true; api.setTag(msg || 'FAIL'); api.shake(); cleanup(); api.stopTimer(); setTimeout(() => api.fail(), 250); }
        function cleanup() { clearTimeout(waitTO); document.removeEventListener('keydown', key); }

        api.startTimer(20, () => fail());

        function draw() {
            ctx.clearRect(0, 0, W, H);
            const dng = (getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#ff3b5c').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            let col = state === 'green' ? suc : (state === 'wait' ? 'rgba(255,255,255,0.15)' : dng);
            ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 30;
            ctx.beginPath(); ctx.arc(W / 2, H / 2 - 10, 60, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillStyle = '#0a0e14'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(state === 'green' ? 'GO' : (state === 'wait' ? '…' : 'WAIT'), W / 2, H / 2 - 10);
            if (last) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '13px monospace'; ctx.fillText('last: ' + last + 'ms (need ≤' + threshold + ')', W / 2, H - 24); }
            if (!ended) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); cleanup(); } };
    }
});


/* ---- resonance.js ---- */
MG.register('resonance', {
    title: 'Resonance',
    hint: 'Tune the sliders so your wave matches the target',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const comps = 2 + Math.floor(diff / 1.5);
        const tol = Math.max(0.06, 0.16 - diff * 0.02);
        const W = 480, H = 180;

        const parts = [];
        for (let i = 0; i < comps; i++) {
            parts.push({
                freq: 1 + i * 0.8 + api.rand(-0.2, 0.2),
                sign: i === comps - 1 && diff >= 3 ? -1 : 1,
                target: api.rand(0.2, 1),
                cur: api.rand(0, 1)
            });
        }

        const box = document.createElement('div');
        box.style.cssText = 'display:flex;flex-direction:column;gap:14px;width:480px;';
        box.innerHTML = `
            <canvas id="wv" width="${W}" height="${H}" style="border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.25);"></canvas>
            <div id="match" class="label" style="text-align:center;">MATCH: 0%</div>
            <div id="sliders" style="display:flex;flex-direction:column;gap:10px;"></div>`;
        api.board.appendChild(box);
        const cvs = box.querySelector('#wv');
        const ctx = cvs.getContext('2d');
        const slBox = box.querySelector('#sliders');
        const matchEl = box.querySelector('#match');

        parts.forEach((p, i) => {
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:center;gap:12px;';
            row.innerHTML = `
                <span style="width:74px;font-size:11px;color:${p.sign < 0 ? 'var(--danger)' : 'var(--muted)'};">
                    ${p.sign < 0 ? 'INVERT ' : 'NODE '}${i + 1}</span>
                <input type="range" min="0" max="100" value="${Math.round(p.cur * 100)}"
                    style="flex:1;accent-color:${p.sign < 0 ? 'var(--danger)' : 'var(--accent)'};">`;
            const slider = row.querySelector('input');
            slider.addEventListener('input', () => { p.cur = slider.value / 100; });
            slBox.appendChild(row);
        });

        function waveAt(x, useTarget) {
            const t = (x / W) * Math.PI * 4;
            let y = 0;
            parts.forEach((p) => {
                const amp = useTarget ? p.target : p.cur;
                y += p.sign * amp * Math.sin(t * p.freq);
            });
            return y;
        }
        function matchPct() {
            let err = 0;
            parts.forEach((p) => { err += Math.abs(p.cur - p.target); });
            const norm = err / parts.length;
            return Math.max(0, 1 - norm);
        }

        let solved = false;
        api.setTag('CALIBRATING');
        api.startTimer(Math.max(16, 38 - diff * 3), () => { if (!solved) api.fail(); });

        function plot(useTarget, color, glow) {
            ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.shadowColor = glow ? color : 'transparent'; ctx.shadowBlur = glow ? 8 : 0;
            ctx.beginPath();
            const scale = H / 2 / (parts.length + 0.5);
            for (let x = 0; x <= W; x += 2) {
                const y = H / 2 - waveAt(x, useTarget) * scale;
                x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
            }
            ctx.stroke(); ctx.shadowBlur = 0;
        }
        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            plot(true, 'rgba(255,255,255,0.28)', false);   // target ghost
            plot(false, acc, true);

            const m = matchPct();
            matchEl.textContent = 'MATCH: ' + Math.round(m * 100) + '%';
            matchEl.style.color = m > 0.92 ? 'var(--success)' : 'var(--muted)';

            if (!solved && (1 - m) < tol) {
                solved = true; api.stopTimer(); api.setTag('LOCKED');
                setTimeout(() => api.succeed(), 400);
                return;
            }
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- skillcheck.js ---- */
MG.register('skillcheck', {
    title: 'Skill Check',
    hint: 'SPACE / click when the marker hits the zone',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const need = api.cfg.rounds || (2 + Math.floor(diff / 1.5));
        const W = 300, H = 300, cx = W / 2, cy = H / 2, R = 110;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const zoneSize = Math.max(0.18, 0.72 - diff * 0.10);
        const speed = 0.022 + diff * 0.016;
        let ang = 0, dir = 1, done = 0, zoneStart = 0, ended = false;

        function newZone() {
            zoneStart = api.rand(0, Math.PI * 2);
            dir = Math.random() < 0.5 ? 1 : -1;
            ang = zoneStart + Math.PI + api.rand(-0.5, 0.5);
        }
        api.setDots(need); newZone();

        function attempt() {
            if (ended) return;
            let d = ang - zoneStart;
            d = ((d % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
            if (d <= zoneSize) {
                done++;
                api.sfx('latch');
                api.setDots(need, Array.from({ length: need }, (_, i) => i < done ? 'done' : ''));
                if (done >= need) { ended = true; api.stopTimer(); cleanup(); setTimeout(() => api.succeed(), 250); }
                else newZone();
            } else { ended = true; api.shake(); api.stopTimer(); cleanup(); setTimeout(() => api.fail(), 200); }
        }
        function key(e) { if (e.code === 'Space') { e.preventDefault(); attempt(); } }
        document.addEventListener('keydown', key);
        cvs.addEventListener('click', attempt);
        function cleanup() { document.removeEventListener('keydown', key); }

        api.startTimer(Math.max(7, 18 - diff * 1.6), () => { cleanup(); api.fail(); });

        function draw() {
            if (!ended) ang += speed * dir;
            ctx.clearRect(0, 0, W, H);
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 14;
            ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = suc; ctx.lineWidth = 14;
            ctx.shadowColor = suc; ctx.shadowBlur = 14;
            ctx.beginPath(); ctx.arc(cx, cy, R, zoneStart, zoneStart + zoneSize); ctx.stroke();
            ctx.shadowBlur = 0;
            const mx = cx + Math.cos(ang) * R, my = cy + Math.sin(ang) * R;
            ctx.fillStyle = '#fff'; ctx.shadowColor = acc; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(mx, my, 10, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillStyle = acc; ctx.font = 'bold 30px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText((done) + '/' + need, cx, cy);
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); cleanup(); } };
    }
});


/* ---- slidepuzzle.js ---- */
MG.register('slidepuzzle', {
    title: 'Slide Puzzle',
    hint: 'Click a tile next to the gap to slide it · order 1..N to finish',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 300, H = 300;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();

        const n = diff >= 5 ? 4 : 3;
        const cell = Math.floor(250 / n), gap = 6;
        const bx = (W - n * cell) / 2, by = (H - n * cell) / 2;
        const total = n * n;
        let board = [], blank = total - 1, done = false, moves = 0;

        function solved() { for (let i = 0; i < total - 1; i++) if (board[i] !== i + 1) return false; return board[total - 1] === 0; }
        function neighbours(i) { const r = Math.floor(i / n), c = i % n, out = []; if (r > 0) out.push(i - n); if (r < n - 1) out.push(i + n); if (c > 0) out.push(i - 1); if (c < n - 1) out.push(i + 1); return out; }
        function slide(i) { board[blank] = board[i]; board[i] = 0; blank = i; }

        for (let i = 0; i < total; i++) board[i] = (i + 1) % total; // [1..n*n-1, 0]
        const shuffle = 40 + diff * 25;
        let prev = -1;
        for (let k = 0; k < shuffle; k++) { const ns = neighbours(blank).filter(x => x !== prev); const pick = ns[api.randInt(0, ns.length - 1)]; prev = blank; slide(pick); }
        if (solved()) { const ns = neighbours(blank); slide(ns[0]); }

        cvs.addEventListener('click', (e) => {
            if (done) return;
            const b = cvs.getBoundingClientRect();
            const x = (e.clientX - b.left) * (W / b.width), y = (e.clientY - b.top) * (H / b.height);
            const c = Math.floor((x - bx) / cell), r = Math.floor((y - by) / cell);
            if (r < 0 || c < 0 || r >= n || c >= n) return;
            const i = r * n + c;
            if (neighbours(i).includes(blank)) {
                slide(i); moves++; api.sfx('tick');
                if (solved()) { done = true; api.stopTimer(); api.setTag('SOLVED'); setTimeout(() => api.succeed(), 300); }
            }
        });

        api.startTimer(Math.max(35, 75 - diff * 5), () => { if (!done) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); } });

        function draw() {
            api.setTag(done ? 'SOLVED' : ('MOVES ' + moves));
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.strokeRect(bx - 3, by - 3, n * cell + 6, n * cell + 6);
            for (let i = 0; i < total; i++) {
                const v = board[i]; if (v === 0) continue;
                const r = Math.floor(i / n), c = i % n, x = bx + c * cell, y = by + r * cell;
                const right = v === i + 1;
                ctx.fillStyle = right ? 'rgba(57,217,138,0.18)' : 'rgba(0,224,184,0.12)';
                ctx.fillRect(x + gap / 2, y + gap / 2, cell - gap, cell - gap);
                ctx.strokeStyle = right ? suc : acc; ctx.lineWidth = 2; ctx.strokeRect(x + gap / 2, y + gap / 2, cell - gap, cell - gap);
                ctx.fillStyle = right ? suc : acc; ctx.font = 'bold ' + Math.floor(cell * 0.4) + 'px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(v, x + cell / 2, y + cell / 2);
            }
            ctx.textBaseline = 'alphabetic';
            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- stacker.js ---- */
MG.register('stacker', {
    title: 'Stacker',
    hint: 'SPACE / click to drop the block on the stack',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const goal = 4 + diff;
        const W = 300, H = 320, blockH = 22;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        let speed = 1.5 + diff * 0.6;
        let stack = [{ x: W / 2 - 70, w: 140 }];
        let cur = { x: 0, w: 140, dir: 1 };
        let placed = 1, ended = false;
        api.setDots(goal);

        function topY(level) { return H - 30 - level * blockH; }

        function drop() {
            if (ended) return;
            const below = stack[stack.length - 1];
            const left = Math.max(cur.x, below.x);
            const right = Math.min(cur.x + cur.w, below.x + below.w);
            const overlap = right - left;
            if (overlap <= 4) { fail(); return; }
            stack.push({ x: left, w: overlap });
            placed++;
            api.sfx('latch'); placed++;
            api.setDots(goal, Array.from({ length: goal }, (_, i) => i < placed ? 'done' : ''));
            if (placed >= goal) { win(); return; }
            cur = { x: 0, w: overlap, dir: 1 };
            speed += 0.15;
        }
        function key(e) { if (e.code === 'Space') { e.preventDefault(); drop(); } }
        document.addEventListener('keydown', key);
        cvs.addEventListener('click', drop);

        function win() { if (ended) return; ended = true; cleanup(); api.stopTimer(); setTimeout(() => api.succeed(), 250); }
        function fail() { if (ended) return; ended = true; api.shake(); cleanup(); api.stopTimer(); setTimeout(() => api.fail(), 200); }
        function cleanup() { document.removeEventListener('keydown', key); }

        api.setTag('STACK');
        api.startTimer(Math.max(12, 26 - diff * 2), () => fail());

        function draw() {
            if (!ended) {
                cur.x += cur.dir * speed;
                if (cur.x + cur.w > W) { cur.x = W - cur.w; cur.dir = -1; }
                if (cur.x < 0) { cur.x = 0; cur.dir = 1; }
            }
            ctx.clearRect(0, 0, W, H);
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            stack.forEach((b, i) => {
                ctx.fillStyle = i === 0 ? 'rgba(255,255,255,0.15)' : acc;
                ctx.globalAlpha = i === 0 ? 1 : 0.55 + (i / stack.length) * 0.45;
                ctx.fillRect(b.x, topY(i), b.w, blockH - 2);
                ctx.globalAlpha = 1;
            });
            const y = topY(stack.length);
            ctx.fillStyle = suc; ctx.shadowColor = suc; ctx.shadowBlur = 12;
            ctx.fillRect(cur.x, y, cur.w, blockH - 2); ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.setLineDash([4,4]);
            const gy = topY(goal);
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
            ctx.fillText('goal', 6, gy - 4);
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); cleanup(); } };
    }
});


/* ---- steadydose.js ---- */
MG.register('steadydose', {
    title: 'Steady Dose',
    hint: 'Move mouse · keep the needle in the band',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 360, H = 300;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'ns-resize';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const zoneH = Math.max(34, 80 - diff * 9);
        const zoneSpeed = 0.8 + diff * 0.5;
        const tremor = diff * 0.9;
        let zoneY = H / 2, zdir = 1, phase = 0;
        let needle = H / 2, fill = 0;

        api.startTimer(Math.max(10, 20 - diff), () => { unbind(); api.fail(); });

        function move(e) {
            const b = cvs.getBoundingClientRect();
            const sy = cvs.height / b.height;
            needle = Math.max(20, Math.min(H - 20, (e.clientY - b.top) * sy));
        }
        cvs.addEventListener('mousemove', move);
        function unbind() { cvs.removeEventListener('mousemove', move); }

        function draw() {
            phase += 0.04;
            zoneY += zdir * zoneSpeed * (1 + Math.sin(phase) * 0.4);
            if (zoneY < zoneH / 2 + 20) zdir = 1;
            if (zoneY > H - zoneH / 2 - 20) zdir = -1;

            const wob = Math.sin(phase * 5) * tremor;
            const nY = needle + wob;
            const inside = nY > zoneY - zoneH / 2 && nY < zoneY + zoneH / 2;
            fill += inside ? 0.9 : -1.3;
            fill = Math.max(0, Math.min(100, fill));
            if (!inside && tremor > 0) api.setTag('UNSTABLE'); else api.setTag('STABLE');

            if (fill >= 100) { api.stopTimer(); unbind(); setTimeout(() => api.succeed(), 200); return; }

            ctx.clearRect(0, 0, W, H);
            const trackX = W / 2 - 30;
            ctx.fillStyle = 'rgba(255,255,255,0.05)';
            ctx.fillRect(trackX, 20, 60, H - 40);
            const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8';
            ctx.fillStyle = inside ? 'rgba(57,217,138,0.25)' : 'rgba(0,224,184,0.12)';
            ctx.strokeStyle = inside ? '#39d98a' : acc; ctx.lineWidth = 2;
            ctx.fillRect(trackX, zoneY - zoneH / 2, 60, zoneH);
            ctx.strokeRect(trackX, zoneY - zoneH / 2, 60, zoneH);
            ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(trackX - 14, nY); ctx.lineTo(trackX - 2, nY - 8); ctx.lineTo(trackX - 2, nY + 8);
            ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillRect(trackX, nY - 1.5, 60, 3);

            ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(W - 26, 20, 10, H - 40);
            ctx.fillStyle = acc;
            const fh = (H - 40) * (fill / 100);
            ctx.fillRect(W - 26, 20 + (H - 40 - fh), 10, fh);

            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); unbind(); } };
    }
});


/* ---- suture.js ---- */
MG.register('suture', {
    title: 'Suture',
    hint: 'Click each stitch when its ring shrinks into the green',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 400, H = 280;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();

        const N = 4 + Math.floor(diff / 2); // 4..6
        const x0 = 50, x1 = W - 50, yMid = H / 2;
        const stitches = [];
        for (let i = 0; i < N; i++) {
            const x = x0 + (x1 - x0) * ((i + 0.5) / N);
            stitches.push({ x, y: yMid + (i % 2 === 0 ? -26 : 26), done: false });
        }
        let idx = 0, ring = 1, dirR = -1, done = false;
        const ringSpd = 0.012 + diff * 0.003;
        const band = Math.max(0.1, 0.26 - diff * 0.03);
        const lo = 0.18, hi = lo + band;

        api.setDots(N);
        function attempt(cx, cy) {
            if (done) return;
            const s = stitches[idx];
            if (Math.hypot(cx - s.x, cy - s.y) < 42 && ring >= lo && ring <= hi) {
                s.done = true; idx++; api.sfx('latch');
                api.setDots(N, stitches.map(st => st.done ? 'done' : ''));
                ring = 1; dirR = -1;
                if (idx >= N) { done = true; api.stopTimer(); api.setTag('CLOSED'); setTimeout(() => api.succeed(), 300); }
            } else { api.shake(); api.addTime(-1500); }
        }
        cvs.addEventListener('click', (e) => { const b = cvs.getBoundingClientRect(); attempt((e.clientX - b.left) * (W / b.width), (e.clientY - b.top) * (H / b.height)); });

        api.setTag('SUTURING');
        api.startTimer(Math.max(16, 28 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); } });

        function draw() {
            if (!done) { ring += ringSpd * dirR; if (ring < lo - 0.12) dirR = 1; if (ring > 1) { ring = 1; dirR = -1; } }
            ctx.clearRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,80,90,0.55)'; ctx.lineWidth = 6; ctx.beginPath();
            for (let x = x0 - 10; x <= x1 + 10; x += 14) { const yy = yMid + Math.sin(x * 0.25) * 4; x === x0 - 10 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
            ctx.stroke();

            ctx.strokeStyle = acc; ctx.lineWidth = 2;
            stitches.forEach(s => { if (s.done) { ctx.beginPath(); ctx.moveTo(s.x, yMid - 26); ctx.lineTo(s.x, yMid + 26); ctx.stroke(); } });

            stitches.forEach((s, i) => {
                ctx.fillStyle = s.done ? suc : (i === idx ? '#fff' : 'rgba(255,255,255,0.3)');
                ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            if (!done && idx < N) {
                const s = stitches[idx], inB = ring >= lo && ring <= hi;
                ctx.strokeStyle = 'rgba(57,217,138,0.3)'; ctx.lineWidth = (hi - lo) * 30;
                ctx.beginPath(); ctx.arc(s.x, s.y, 6 + ((lo + hi) / 2) * 30, 0, Math.PI * 2); ctx.stroke();
                ctx.strokeStyle = inB ? suc : acc; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(s.x, s.y, 6 + ring * 30, 0, Math.PI * 2); ctx.stroke();
            }

            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- targets.js ---- */
MG.register('targets', {
    title: 'Targets',
    hint: 'Click the targets · avoid the red ones',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const need = 6 + diff * 2;
        const maxMiss = Math.max(2, 5 - diff);
        const life = Math.max(750, 1900 - diff * 210);
        const spawnGap = Math.max(380, 950 - diff * 110);
        const decoyChance = 0.12 + diff * 0.05;
        const W = 460, H = 300;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'crosshair';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        let targets = [], hits = 0, miss = 0, ended = false, lastSpawn = 0;
        api.setDots(maxMiss);

        function spawn() {
            const decoy = Math.random() < decoyChance;
            targets.push({
                x: api.rand(40, W - 40), y: api.rand(40, H - 40),
                born: performance.now(), decoy, dead: false
            });
        }
        function rel(e) {
            const b = cvs.getBoundingClientRect();
            return { x: (e.clientX - b.left) * (cvs.width / b.width),
                     y: (e.clientY - b.top) * (cvs.height / b.height) };
        }
        cvs.addEventListener('click', (e) => {
            if (ended) return;
            const p = rel(e);
            for (const t of targets) {
                if (t.dead) continue;
                const age = performance.now() - t.born;
                const r = 22 * (1 - age / life) + 6;
                if (Math.hypot(t.x - p.x, t.y - p.y) < r + 4) {
                    t.dead = true;
                    if (t.decoy) { registerMiss(); }
                    else { hits++; api.sfx('select'); if (hits >= need) win(); }
                    return;
                }
            }
        });
        function registerMiss() {
            miss++;
            api.setDots(maxMiss, Array.from({ length: maxMiss }, (_, i) => i < miss ? 'fail' : ''));
            if (miss >= maxMiss) fail();
        }
        function win() { if (ended) return; ended = true; api.stopTimer(); setTimeout(() => api.succeed(), 250); }
        function fail() { if (ended) return; ended = true; api.shake(); api.stopTimer(); setTimeout(() => api.fail(), 200); }

        api.setTag('0/' + need);
        api.startTimer(Math.max(14, 28 - diff * 2), () => fail());

        function draw() {
            const now = performance.now();
            if (!ended && now - lastSpawn > spawnGap) { spawn(); lastSpawn = now; }
            ctx.clearRect(0, 0, W, H);
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const dng = (getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#ff3b5c').trim();

            targets.forEach((t) => {
                if (t.dead) return;
                const age = now - t.born;
                if (age > life) { t.dead = true; if (!t.decoy) registerMiss(); return; }
                const r = 22 * (1 - age / life) + 6;
                ctx.strokeStyle = t.decoy ? dng : acc; ctx.lineWidth = 3;
                ctx.fillStyle = t.decoy ? 'rgba(255,59,92,0.12)' : 'rgba(0,224,184,0.12)';
                ctx.shadowColor = t.decoy ? dng : acc; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(t.x, t.y, r * 0.4, 0, Math.PI * 2); ctx.stroke();
                ctx.shadowBlur = 0;
            });
            targets = targets.filter((t) => !t.dead);
            api.setTag(hits + '/' + need);
            if (!ended) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- thermite.js ---- */
MG.register('thermite', {
    title: 'Thermite',
    hint: 'Memorize the lit cells · then light the same ones',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const N = 4 + Math.floor(diff / 2);
        const litCount = 3 + diff;
        const cell = Math.min(64, Math.floor(300 / N));
        const W = cell * N, H = cell * N;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const target = new Set();
        while (target.size < Math.min(litCount, N * N)) target.add(api.randInt(0, N * N - 1));
        const picked = new Set();
        let phase = 'show', ended = false, wrong = 0;
        const maxWrong = Math.max(1, 4 - diff);
        api.setDots(target.size);

        const showMs = Math.max(1200, 2600 - diff * 250);
        api.setTag('MEMORIZE');
        setTimeout(() => { if (!ended) { phase = 'input'; api.setTag('REPRODUCE'); api.startTimer(Math.max(8, 16 - diff), () => finish(false)); } }, showMs);

        function rel(e) {
            const b = cvs.getBoundingClientRect();
            const x = (e.clientX - b.left) * (cvs.width / b.width);
            const y = (e.clientY - b.top) * (cvs.height / b.height);
            return Math.floor(y / cell) * N + Math.floor(x / cell);
        }
        cvs.addEventListener('click', (e) => {
            if (phase !== 'input' || ended) return;
            const idx = rel(e);
            if (idx < 0 || idx >= N * N || picked.has(idx)) return;
            if (target.has(idx)) {
                picked.add(idx); api.sfx('zap');
                api.setDots(target.size, Array.from({ length: target.size }, (_, i) => i < picked.size ? 'done' : ''));
                if (picked.size >= target.size) finish(true);
            } else {
                wrong++; api.shake();
                if (wrong >= maxWrong) finish(false);
            }
        });
        function finish(ok) { if (ended) return; ended = true; api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 300); }

        function draw() {
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            ctx.clearRect(0, 0, W, H);
            for (let i = 0; i < N * N; i++) {
                const r = Math.floor(i / N), c = i % N;
                const x = c * cell, y = r * cell;
                let fill = 'rgba(255,255,255,0.05)';
                if (phase === 'show' && target.has(i)) fill = 'rgba(255,138,0,0.7)';
                if (picked.has(i)) fill = suc;
                ctx.fillStyle = fill;
                if ((phase === 'show' && target.has(i)) || picked.has(i)) { ctx.shadowColor = picked.has(i) ? suc : '#ff8a00'; ctx.shadowBlur = 16; }
                ctx.fillRect(x + 3, y + 3, cell - 6, cell - 6);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.strokeRect(x + 3, y + 3, cell - 6, cell - 6);
            }
            for (let i = 0; i < maxWrong; i++) {
                ctx.fillStyle = i < wrong ? (getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#ff3b5c').trim() : 'rgba(255,255,255,0.15)';
                ctx.beginPath(); ctx.arc(10 + i * 14, H - 8, 4, 0, Math.PI * 2); ctx.fill();
            }
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- titration.js ---- */
MG.register('titration', {
    title: 'Titration',
    hint: 'Hold to pour · stop in the green band · don’t overshoot',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 360, H = 300;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const rounds = 2 + Math.floor(diff / 2);
        const bandH = Math.max(0.05, 0.13 - diff * 0.012);
        const pourRate = 0.34 + diff * 0.06;
        let round = 0, level = 0, lo = 0, hi = 0, pour = false, done = false, last = performance.now();

        function newTarget() { lo = 0.45 + Math.random() * (0.92 - bandH - 0.45); hi = lo + bandH; level = 0; }
        newTarget();
        api.setDots(rounds);

        function release() {
            if (done || !pour) return; pour = false;
            if (level >= lo && level <= hi) {
                round++; api.sfx('good'); api.setDots(rounds, Array.from({ length: rounds }, (_, i) => i < round ? 'done' : ''));
                if (round >= rounds) { done = true; api.stopTimer(); api.setTag('TITRATED'); setTimeout(() => api.succeed(), 300); return; }
                newTarget();
            } else if (level > hi) { api.shake(); done = true; api.stopTimer(); api.setTag('OVERSHOT'); setTimeout(() => api.fail(), 300); }
            // under the band: stays, player may pour again
        }
        function down(e) { if (e.code === 'Space') { e.preventDefault(); pour = true; } }
        function up(e) { if (e.code === 'Space') { e.preventDefault(); release(); } }
        document.addEventListener('keydown', down);
        document.addEventListener('keyup', up);
        cvs.addEventListener('mousedown', () => pour = true);
        cvs.addEventListener('mouseup', release);
        cvs.addEventListener('mouseleave', release);

        api.setTag('POURING');
        api.startTimer(Math.max(16, 28 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); document.removeEventListener('keydown', down); document.removeEventListener('keyup', up); setTimeout(() => api.fail(), 200); } });

        function draw() {
            const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
            if (!done && pour) {
                level = Math.min(1, level + pourRate * dt);
                if (level > hi + 0.001) release();
            }
            ctx.clearRect(0, 0, W, H);

            // burette dripping
            const bx = W / 2;
            ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.strokeRect(bx - 8, 14, 16, 40);
            if (pour) { ctx.fillStyle = acc; ctx.beginPath(); ctx.arc(bx, 60 + (performance.now() / 60 % 14), 2.5, 0, Math.PI * 2); ctx.fill(); }

            // beaker
            const beX = bx - 70, beY = 84, beW = 140, beH = H - 120;
            ctx.fillStyle = (level >= lo && level <= hi) ? 'rgba(57,217,138,0.6)' : (level > hi ? 'rgba(255,59,92,0.6)' : 'rgba(0,224,184,0.5)');
            ctx.fillRect(beX, beY + beH * (1 - level), beW, beH * level);
            // target band
            ctx.fillStyle = 'rgba(57,217,138,0.18)'; ctx.fillRect(beX, beY + beH * (1 - hi), beW, beH * (hi - lo));
            ctx.strokeStyle = suc; ctx.lineWidth = 1.5; ctx.strokeRect(beX, beY + beH * (1 - hi), beW, beH * (hi - lo));
            ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(beX, beY); ctx.lineTo(beX, beY + beH); ctx.lineTo(beX + beW, beY + beH); ctx.lineTo(beX + beW, beY); ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
            ctx.fillText('stop in the green band', bx, H - 14);
            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', down); document.removeEventListener('keyup', up); } };
    }
});


/* ---- toolbox.js ---- */
MG.register('toolbox', {
    title: 'Tool Board',
    hint: 'Drag each tool onto its matching outline',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 440, H = 300;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'grab';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();

        const TYPES = ['wrench', 'driver', 'hammer', 'pliers', 'spanner'];
        const N = 3 + Math.floor(diff / 1.5); // 3..5
        const types = TYPES.slice(0, N);
        const tol = 34;

        // shadow slots in a row on the board (shuffled type order)
        const slotTypes = types.slice();
        for (let i = slotTypes.length - 1; i > 0; i--) { const j = api.randInt(0, i); const t = slotTypes[i]; slotTypes[i] = slotTypes[j]; slotTypes[j] = t; }
        const slots = slotTypes.map((type, i) => ({ type, x: W * (i + 0.5) / N, y: 92, filled: false }));

        // loose tools in the tray (shuffled x positions so they don't line up)
        const homeXs = [];
        for (let i = 0; i < N; i++) homeXs.push(W * (i + 0.5) / N);
        for (let i = homeXs.length - 1; i > 0; i--) { const j = api.randInt(0, i); const t = homeXs[i]; homeXs[i] = homeXs[j]; homeXs[j] = t; }
        const tools = types.map((type, i) => ({ type, x: homeXs[i], y: H - 58, hx: homeXs[i], hy: H - 58, placed: false }));

        let drag = null, off = { x: 0, y: 0 }, placedN = 0, done = false;
        api.setDots(N);

        function rel(e) { const b = cvs.getBoundingClientRect(); return { x: (e.clientX - b.left) * (W / b.width), y: (e.clientY - b.top) * (H / b.height) }; }
        function at(x, y) { for (let i = tools.length - 1; i >= 0; i--) { const t = tools[i]; if (!t.placed && Math.abs(x - t.x) < 24 && Math.abs(y - t.y) < 22) return t; } return null; }
        cvs.addEventListener('mousedown', (e) => { const r = rel(e); const t = at(r.x, r.y); if (t) { drag = t; off.x = r.x - t.x; off.y = r.y - t.y; cvs.style.cursor = 'grabbing'; } });
        cvs.addEventListener('mousemove', (e) => { if (!drag) return; const r = rel(e); drag.x = r.x - off.x; drag.y = r.y - off.y; });
        function dropTool() {
            if (!drag) return; const t = drag; drag = null; cvs.style.cursor = 'grab';
            const s = slots.find(sl => !sl.filled && sl.type === t.type && Math.hypot(t.x - sl.x, t.y - sl.y) < tol);
            if (s) {
                s.filled = true; t.placed = true; t.x = s.x; t.y = s.y; placedN++; api.sfx('latch');
                api.setDots(N, tools.map(tt => tt.placed ? 'done' : ''));
                if (placedN >= N) { done = true; api.stopTimer(); api.setTag('STOCKED'); setTimeout(() => api.succeed(), 300); }
            } else { t.x = t.hx; t.y = t.hy; api.sfx('tick'); }
        }
        cvs.addEventListener('mouseup', dropTool);
        cvs.addEventListener('mouseleave', dropTool);

        api.setTag('ORGANIZE');
        api.startTimer(Math.max(18, 32 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); } });

        function drawTool(type, x, y, col, alpha) {
            ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.translate(x, y);
            ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            if (type === 'wrench') { ctx.rotate(-0.6); ctx.beginPath(); ctx.moveTo(-2, 16); ctx.lineTo(2, -6); ctx.stroke(); ctx.beginPath(); ctx.arc(2, -11, 7, Math.PI * 0.2, Math.PI * 1.8); ctx.stroke(); }
            else if (type === 'driver') { ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(0, 2); ctx.stroke(); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, 16); ctx.stroke(); }
            else if (type === 'hammer') { ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(0, 18); ctx.stroke(); ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-11, -9); ctx.lineTo(11, -9); ctx.stroke(); }
            else if (type === 'pliers') { ctx.beginPath(); ctx.moveTo(-6, 18); ctx.lineTo(2, -1); ctx.lineTo(-3, -16); ctx.stroke(); ctx.beginPath(); ctx.moveTo(6, 18); ctx.lineTo(-2, -1); ctx.lineTo(3, -16); ctx.stroke(); }
            else { ctx.beginPath(); ctx.arc(0, -10, 7, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -10, 3, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(0, 18); ctx.stroke(); }
            ctx.restore(); ctx.globalAlpha = 1;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.strokeRect(16, 42, W - 32, 104);
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '10px monospace'; ctx.textAlign = 'left';
            ctx.fillText('SHADOW BOARD', 22, 56);
            ctx.fillText('TOOLS', 22, H - 78);

            slots.forEach(s => {
                if (!s.filled) {
                    drawTool(s.type, s.x, s.y, 'rgba(255,255,255,0.16)', 1);
                    ctx.setLineDash([4, 3]); ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(s.x, s.y, tol - 6, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
                }
            });
            tools.forEach(t => { if (t !== drag) drawTool(t.type, t.x, t.y, t.placed ? suc : acc); });
            if (drag) drawTool(drag.type, drag.x, drag.y, acc);

            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- tripwire.js ---- */
MG.register('tripwire', {
    title: 'Tripwire',
    hint: 'Move the mouse to weave past the sweeping lasers · reach the green exit',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 460, H = 300;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'crosshair';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        // Oscillating "wiper" lasers: each pivots from the top or bottom edge and
        // sweeps a bounded fan into the room. They sit at separated x columns and
        // start out of phase, so a clear gap to weave through always exists.
        const count = 2 + Math.floor((diff - 1) / 2); // 2,2,3,3,4
        const L = H * 0.64;
        const sweep = 0.5 + diff * 0.06;
        const beams = [];
        for (let i = 0; i < count; i++) {
            const top = i % 2 === 0;
            beams.push({
                x: 120 + (i + 0.5) * (W - 190) / count,
                y: top ? 10 : H - 10,
                base: top ? Math.PI / 2 : -Math.PI / 2,
                phase: api.rand(0, Math.PI * 2),
                spd: (0.015 + diff * 0.003) * (Math.random() < 0.5 ? 1 : -1),
                ang: 0
            });
        }

        const start = { x: 26, y: H / 2 };
        const av = { x: start.x, y: start.y, r: 8 };
        let mx = start.x, my = start.y, has = false, done = false;

        cvs.addEventListener('mousemove', (e) => {
            const b = cvs.getBoundingClientRect();
            mx = (e.clientX - b.left) * (W / b.width);
            my = (e.clientY - b.top) * (H / b.height);
            has = true;
        });

        api.setTag('INFILTRATING');
        api.startTimer(Math.max(18, 30 - diff * 2), () => fail());
        function fail() { if (done) return; done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); }
        function win() { if (done) return; done = true; api.stopTimer(); api.setTag('CLEAR'); setTimeout(() => api.succeed(), 300); }

        function segDist(px, py, ax, ay, bx, by) {
            const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
            let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
        }

        function draw() {
            if (has) { av.x += (mx - av.x) * 0.4; av.y += (my - av.y) * 0.4; }
            av.x = Math.max(av.r, Math.min(W - av.r, av.x));
            av.y = Math.max(av.r, Math.min(H - av.r, av.y));

            ctx.clearRect(0, 0, W, H);

            const exX = W - 34;
            ctx.fillStyle = 'rgba(57,217,138,0.12)'; ctx.fillRect(exX, 0, W - exX, H);
            ctx.strokeStyle = suc; ctx.lineWidth = 2; ctx.strokeRect(exX, 0, W - exX, H);
            ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(0, 0, 42, H);

            let tripped = false;
            beams.forEach(bm => {
                if (!done) bm.phase += bm.spd;
                bm.ang = bm.base + Math.sin(bm.phase) * sweep;
                const tx = bm.x + Math.cos(bm.ang) * L, ty = bm.y + Math.sin(bm.ang) * L;
                const d = segDist(av.x, av.y, bm.x, bm.y, tx, ty), near = d < 22;
                ctx.strokeStyle = near ? dng : 'rgba(255,59,92,0.5)';
                ctx.lineWidth = 2; ctx.shadowColor = dng; ctx.shadowBlur = near ? 14 : 6;
                ctx.beginPath(); ctx.moveTo(bm.x, bm.y); ctx.lineTo(tx, ty); ctx.stroke(); ctx.shadowBlur = 0;
                ctx.fillStyle = dng; ctx.beginPath(); ctx.arc(bm.x, bm.y, 5, 0, Math.PI * 2); ctx.fill();
                if (d < av.r + 2) tripped = true;
            });

            ctx.fillStyle = tripped ? dng : acc;
            ctx.shadowColor = tripped ? dng : acc; ctx.shadowBlur = 14;
            ctx.beginPath(); ctx.arc(av.x, av.y, av.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;

            if (tripped && !done) { api.sfx('zap'); api.shake(); fail(); return; }
            if (av.x > exX && !done) { win(); return; }

            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

MG.register('vaultdrill', {
    title: 'Vault Drill',
    hint: 'Stop each drill in the green core · SPACE / click',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const points = 3 + Math.floor(diff / 1.3);
        const W = 340, H = 300, cx = W / 2, cy = H / 2, R = 110;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const drillPts = [];
        for (let i = 0; i < points; i++) {
            const a = (i / points) * Math.PI * 2 - Math.PI / 2;
            drillPts.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, done: false });
        }
        let cur = 0, prog = 0, dir = 1, ended = false;
        const speed = 1.2 + diff * 0.5;
        const coreLow = 42, coreHigh = 58;
        api.setDots(points);

        function attempt() {
            if (ended || cur >= points) return;
            if (prog >= coreLow && prog <= coreHigh) {
                drillPts[cur].done = true; api.sfx('zap'); cur++; prog = 0;
                api.setDots(points, drillPts.map((p) => p.done ? 'done' : ''));
                if (cur >= points) finish(true);
            } else { api.shake(); finish(false); }
        }
        function key(e) { if (e.code === 'Space') { e.preventDefault(); attempt(); } }
        document.addEventListener('keydown', key);
        cvs.addEventListener('click', attempt);

        api.setTag('DRILLING');
        api.startTimer(Math.max(12, 24 - diff * 2), () => finish(false));
        function finish(ok) { if (ended) return; ended = true; document.removeEventListener('keydown', key); api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 250); }

        function draw() {
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            if (!ended && cur < points) { prog += dir * speed; if (prog > 100) { prog = 100; dir = -1; } if (prog < 0) { prog = 0; dir = 1; } }
            ctx.clearRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(cx, cy, R + 16, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.beginPath(); ctx.arc(cx, cy, R - 6, 0, Math.PI * 2); ctx.fill();

            drillPts.forEach((p) => {
                const isCur = !p.done && drillPts.indexOf(p) === cur && !ended;
                ctx.fillStyle = p.done ? suc : (isCur ? acc : 'rgba(255,255,255,0.2)');
                ctx.strokeStyle = ctx.fillStyle; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = isCur ? 12 : (p.done ? 10 : 0);
                ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            });

            ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(cur + '/' + points, cx, cy - 14);

            const bw = 140, bx = cx - bw / 2, by = cy + 18;
            ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(bx, by, bw, 14);
            ctx.fillStyle = 'rgba(57,217,138,0.25)'; ctx.fillRect(bx + bw * coreLow / 100, by, bw * (coreHigh - coreLow) / 100, 14);
            ctx.strokeStyle = suc; ctx.lineWidth = 1; ctx.strokeRect(bx + bw * coreLow / 100, by, bw * (coreHigh - coreLow) / 100, 14);
            ctx.fillStyle = '#fff'; ctx.fillRect(bx + bw * prog / 100 - 1.5, by - 3, 3, 20);
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
});

MG.register('vaultspin', {
    title: 'Vault Spin',
    hint: 'Drag the dial to each lit number',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const tumblers = api.cfg.tumblers || (2 + Math.floor(diff / 2));
        const tol = Math.max(4, 12 - diff * 1.6);
        const segments = 40;

        const W = 320, H = 300;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'grab';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');
        const cxp = W / 2, cyp = H / 2, R = 110;

        const targets = [];
        for (let i = 0; i < tumblers; i++) targets.push(api.randInt(0, segments - 1));
        let step = 0, angle = 0, dragging = false, lastA = 0;
        api.setDots(tumblers);

        function numToAngle(n) { return (n / segments) * Math.PI * 2 - Math.PI / 2; }
        function angleToNum(a) {
            let deg = ((a + Math.PI / 2) % (Math.PI * 2));
            if (deg < 0) deg += Math.PI * 2;
            return Math.round(deg / (Math.PI * 2) * segments) % segments;
        }
        function pointerAngle(e) {
            const b = cvs.getBoundingClientRect();
            const sx = cvs.width / b.width;
            const sy = cvs.height / b.height;
            const px = (e.clientX - b.left) * sx;
            const py = (e.clientY - b.top) * sy;
            return Math.atan2(py - cyp, px - cxp);
        }

        cvs.addEventListener('mousedown', (e) => { dragging = true; lastA = pointerAngle(e); cvs.style.cursor = 'grabbing'; });
        window.addEventListener('mouseup', upH);
        cvs.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const a = pointerAngle(e);
            let d = a - lastA;
            if (d > Math.PI) d -= Math.PI * 2;
            if (d < -Math.PI) d += Math.PI * 2;
            angle += d; lastA = a;
        });
        function upH() {
            if (!dragging) return;
            dragging = false; cvs.style.cursor = 'grab';
            const cur = angleToNum(angle);
            if (cur === targets[step]) {
                step++;
                const st = []; for (let i = 0; i < tumblers; i++) st[i] = i < step ? 'done' : (i === step ? 'active' : '');
                api.setDots(tumblers, st);
                if (step >= tumblers) { api.stopTimer(); cleanup(); setTimeout(() => api.succeed(), 250); }
            }
        }
        function cleanup() { window.removeEventListener('mouseup', upH); }

        api.startTimer(Math.max(12, 26 - diff * 2), () => { cleanup(); api.fail(); });

        function draw() {
            ctx.clearRect(0, 0, W, H);
            const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8';
            ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(cxp, cyp, R + 14, 0, Math.PI * 2); ctx.stroke();
            for (let i = 0; i < segments; i++) {
                const a = numToAngle(i);
                const big = i % 5 === 0;
                const r1 = R + 10, r2 = R + (big ? -2 : 3);
                ctx.strokeStyle = i === targets[step] ? acc : 'rgba(255,255,255,0.25)';
                ctx.lineWidth = big ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(cxp + Math.cos(a) * r1, cyp + Math.sin(a) * r1);
                ctx.lineTo(cxp + Math.cos(a) * r2, cyp + Math.sin(a) * r2);
                ctx.stroke();
                if (big) {
                    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '10px monospace';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(i, cxp + Math.cos(a) * (R - 14), cyp + Math.sin(a) * (R - 14));
                }
            }
            const g = ctx.createRadialGradient(cxp, cyp, 10, cxp, cyp, R);
            g.addColorStop(0, '#1a2230'); g.addColorStop(1, '#0a0e14');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cxp, cyp, R, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.stroke();
            ctx.save(); ctx.translate(cxp, cyp); ctx.rotate(angle);
            ctx.fillStyle = acc; ctx.shadowColor = acc; ctx.shadowBlur = 10;
            ctx.fillRect(-3, -R + 6, 6, 30);
            ctx.restore(); ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.moveTo(cxp, cyp - R - 18); ctx.lineTo(cxp - 7, cyp - R - 30); ctx.lineTo(cxp + 7, cyp - R - 30); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 26px monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(angleToNum(angle), cxp, cyp);

            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); cleanup(); } };
    }
});

MG.register('vitals', {
    title: 'Vitals',
    hint: 'Keep every gauge in the green — tap 1 / 2 / 3 to stabilize',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 380, H = 280;

        const cvs = document.createElement('canvas');

        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const labels = ['HR', 'O2', 'BP'];
        const keys = ['Digit1', 'Digit2', 'Digit3'];
        const G = 3;
        const bandH = Math.max(0.16, 0.3 - diff * 0.025);
        const gauges = [];
        for (let i = 0; i < G; i++) { const lo = 0.32 + Math.random() * (0.36 - bandH); gauges.push({ v: 0.5, lo, hi: lo + bandH, vel: 0, drift: 0.05 + diff * 0.02 }); }
        let stab = 0, done = false;
        const stabGain = 0.16;
        let last = performance.now();

        function key(e) { const i = keys.indexOf(e.code); if (i >= 0 && !done) { e.preventDefault(); gauges[i].vel += 0.16; api.sfx('tick'); } }
        document.addEventListener('keydown', key);

        api.setTag('MONITOR');
        api.startTimer(Math.max(20, 34 - diff * 2), () => { if (!done && stab < 1) fail(); });
        function fail() { if (done) return; done = true; document.removeEventListener('keydown', key); api.stopTimer(); api.shake(); setTimeout(() => api.fail(), 200); }
        function win() { if (done) return; done = true; document.removeEventListener('keydown', key); api.stopTimer(); api.setTag('STABLE'); setTimeout(() => api.succeed(), 300); }

        function draw() {
            const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
            let allIn = true;
            if (!done) {
                gauges.forEach(g => {
                    g.vel += (Math.random() - 0.52) * g.drift * dt * 6;
                    g.vel *= 0.92;
                    g.v = Math.max(0.04, Math.min(0.96, g.v + g.vel * dt * 3));
                    if (g.v < g.lo || g.v > g.hi) allIn = false;
                });
                stab = allIn ? Math.min(1, stab + stabGain * dt) : Math.max(0, stab - stabGain * 0.6 * dt);
                if (stab >= 1) { win(); return; }

            ctx.clearRect(0, 0, W, H);
            const colW = 70, gap = (W - G * colW) / (G + 1), top = 26, bh = H - 96;

                ctx.fillStyle = 'rgba(57,217,138,0.18)'; ctx.fillRect(x, top + bh * (1 - g.hi), colW, bh * (g.hi - g.lo));
                ctx.strokeStyle = 'rgba(57,217,138,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(x, top + bh * (1 - g.hi), colW, bh * (g.hi - g.lo));
                const inB = g.v >= g.lo && g.v <= g.hi, ny = top + bh * (1 - g.v);
                ctx.fillStyle = inB ? suc : dng; ctx.shadowColor = inB ? suc : dng; ctx.shadowBlur = 10;

                ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center'; ctx.fillText(labels[i], x + colW / 2, H - 56);
                ctx.fillStyle = acc; ctx.font = '11px monospace'; ctx.fillText('[' + (i + 1) + ']', x + colW / 2, H - 40);
            });

            ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(30, H - 24, W - 60, 10);
            ctx.fillStyle = suc; ctx.fillRect(30, H - 24, (W - 60) * stab, 10);
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '9px monospace'; ctx.textAlign = 'left'; ctx.fillText('STABILITY ' + Math.round(stab * 100) + '%', 30, H - 27);

            if (!done) loop = requestAnimationFrame(draw);
        }

        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
