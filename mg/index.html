<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minigames</title>
<style>
/* BaconSpace's Minigames — shared stylesheet */

@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Azeret+Mono:wght@400;500;700&display=swap');

:root {
    --accent: #00e0b8;
    --danger: #ff3b5c;
    --success: #39d98a;
    --bg: #0a0e14;
    --panel: rgba(14, 19, 28, 0.92);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8edf2;
    --muted: #6b7686;
    --display: 'Chakra Petch', sans-serif;
    --mono: 'Azeret Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: var(--mono);
    color: var(--text);
    user-select: none;
}

.hidden { display: none !important; }

#root {
    position: fixed; inset: 0;
    display: grid; place-items: center;
}

#stage {
    position: relative; z-index: 1;
    width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        0 30px 80px rgba(0,0,0,0.6),
        0 0 60px -20px var(--accent);
    overflow: hidden;
    animation: panel-in 0.28s cubic-bezier(0.2, 0.9, 0.2, 1) both;
}

@keyframes panel-in {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
}

/* ---------------- HUD ---------------- */
#hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
}
#hud-title { display: flex; flex-direction: column; gap: 2px; }
#hud-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase;
}
#hud-name {
    font-family: var(--display); font-weight: 700;
    font-size: 18px; letter-spacing: 0.5px;
}
#hud-timer { display: flex; align-items: center; gap: 10px; }
#timer-bar {
    width: 120px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.08); overflow: hidden;
}
#timer-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--accent), #fff);
    transition: width 0.1s linear;
}
#timer-text {
    font-variant-numeric: tabular-nums;
    font-size: 13px; color: var(--muted); min-width: 34px; text-align: right;
}

/* ---------------- Board ---------------- */
#board {
    position: relative;
    min-height: 320px;
    padding: 26px;
    display: flex; align-items: center; justify-content: center;
}
#board canvas { display: block; }

/* ---------------- Footer ---------------- */
#footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    min-height: 44px;
}
#dots { display: flex; gap: 7px; }
.dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,0.14);
    transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
}
.dot.done { background: var(--success); box-shadow: 0 0 10px var(--success); }
.dot.fail { background: var(--danger);  box-shadow: 0 0 10px var(--danger); }
.dot.active { background: var(--accent); transform: scale(1.3); }
#hint {
    font-size: 11px; letter-spacing: 1px; color: var(--muted);
    text-transform: uppercase;
}

/* ---------------- Flash overlay ---------------- */
#flash {
    position: fixed; inset: 0; z-index: 5;
    display: grid; place-items: center;
    pointer-events: none;
    background: transparent;
}
#flash-text {
    font-family: var(--display); font-weight: 700;
    font-size: 48px; letter-spacing: 6px; text-transform: uppercase;
    padding: 14px 36px; border-radius: 12px;
    background: rgba(10, 14, 20, 0.82);
    animation: flash-pop 0.4s cubic-bezier(0.2,0.9,0.2,1) both;
}
#flash.win  #flash-text { color: var(--success); text-shadow: 0 0 30px var(--success); }
#flash.lose #flash-text { color: var(--danger);  text-shadow: 0 0 30px var(--danger); }
@keyframes flash-pop {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
}

/* ---------------- Reusable bits for games ---------------- */
.btn {
    font-family: var(--display); font-weight: 600;
    letter-spacing: 1px; font-size: 14px;
    padding: 12px 20px; border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.04);
    color: var(--text); cursor: pointer;
    transition: all 0.15s;
}
.btn:hover { border-color: var(--accent); background: rgba(0,224,184,0.08); }
.btn.danger:hover { border-color: var(--danger); background: rgba(255,59,92,0.08); }

.label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
}

.shake { animation: shake 0.3s; }
@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
}

.glow-accent  { color: var(--accent); }
.glow-success { color: var(--success); }
.glow-danger  { color: var(--danger); }


/* Site-level layout: login gate, lobby, leaderboard.
   Loaded after engine.css, which owns the in-game board look. */

html, body {
    overflow-y: auto;
    background: var(--bg);
}

body {
    min-height: 100vh;
    background:
        radial-gradient(1200px 600px at 50% -10%, rgba(0,224,184,0.08), transparent),
        var(--bg);
}

.hidden { display: none !important; }

/* ---------------- Top bar ---------------- */
#topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
}
#brand {
    font-family: var(--display); font-weight: 700;
    font-size: 20px; letter-spacing: 1px;
}
#brand span { color: var(--accent); }
#user-box {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: var(--muted);
}
#user-box strong { color: var(--text); }

/* ---------------- Login gate ---------------- */
#login-gate {
    min-height: 80vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center; padding: 24px;
}
#login-gate h1 {
    font-family: var(--display); font-size: 30px; letter-spacing: 1px;
}
#login-gate p { color: var(--muted); max-width: 420px; font-size: 13px; line-height: 1.6; }

.discord-btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 0.5px;
    padding: 14px 26px; border-radius: 10px;
    border: 1px solid var(--line);
    background: #5865F2; color: #fff; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}
.discord-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(88,101,242,0.4); }

/* ---------------- Lobby ---------------- */
#lobby { padding: 26px 28px 60px; max-width: 1200px; margin: 0 auto; }
#lobby h2 {
    font-family: var(--display); font-size: 15px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted);
    margin: 26px 0 12px;
}
#lobby h2:first-child { margin-top: 0; }

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}
.game-card {
    text-align: left;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--mono);
}
.game-card:hover { border-color: var(--accent); background: rgba(0,224,184,0.06); transform: translateY(-2px); }
.game-card .g-title {
    font-family: var(--display); font-weight: 700; font-size: 14px; margin-bottom: 4px;
}
.game-card .g-hint { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* ---------------- Leaderboard ---------------- */
#leaderboard {
    max-width: 1200px; margin: 40px auto 0; padding: 0 28px 60px;
}
#leaderboard h2 {
    font-family: var(--display); font-size: 15px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
}
table.lb { width: 100%; border-collapse: collapse; font-size: 13px; }
table.lb th, table.lb td {
    text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line);
}
table.lb th { color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
table.lb tr:hover td { background: rgba(255,255,255,0.03); }
.rank-1 { color: #ffd257; }
.rank-2 { color: #cfd6e0; }
.rank-3 { color: #d7935a; }

/* ---------------- Difficulty picker (shown before launching a game) ---------------- */
#diff-picker {
    position: fixed; inset: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6,8,12,0.7);
}
#diff-picker .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px; width: 320px; text-align: center;
}
#diff-picker .panel h3 { font-family: var(--display); margin-bottom: 4px; }
#diff-picker .panel p { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
#diff-picker .diffs { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
#diff-picker .diffs button {
    width: 40px; height: 40px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.04);
    color: var(--text); font-family: var(--display); cursor: pointer;
}
#diff-picker .diffs button.selected,
#diff-picker .diffs button:hover { border-color: var(--accent); background: rgba(0,224,184,0.12); }

</style>
</head>

        <div class="diffs">
            <button data-diff="1">1</button>
            <button data-diff="2">2</button>
            <button data-diff="3">3</button>
            <button data-diff="4">4</button>
            <button data-diff="5">5</button>
        </div>
        <button id="diff-cancel" class="btn">Cancel</button>
    </div>
</div>

<!-- ============== In-game board (engine renders here) ============== -->
<div id="root" class="hidden">

<script>
/* ============================================================
   DISCORD LOGIN (implicit OAuth grant, name only, no backend)
   ============================================================ */
const DiscordAuth = (function () {
    const STORAGE_KEY = 'mg_discord_user';

    function buildAuthorizeUrl() {
        const p = new URLSearchParams({
            client_id: APP_CONFIG.discord.clientId,
            redirect_uri: APP_CONFIG.discord.redirectUri,
            response_type: 'token',
            scope: APP_CONFIG.discord.scope
        });
        return `https://discord.com/api/oauth2/authorize?${p.toString()}`;
    }

    function login() {
        console.log('[DiscordAuth] redirecting to Discord authorize screen');
        window.location.href = buildAuthorizeUrl();
    }

    function logout() {
        console.log('[DiscordAuth] logging out');
        sessionStorage.removeItem(STORAGE_KEY);
    }

    function getStoredUser() {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
    }

    async function resolveFromRedirect() {
        const existing = getStoredUser();
        if (existing) return existing;

        const hash = window.location.hash;
        if (!hash || !hash.includes('access_token')) return null;

        const params = new URLSearchParams(hash.slice(1));
        const token = params.get('access_token');
        if (!token) return null;

        console.log('[DiscordAuth] received access token, fetching profile');
        history.replaceState(null, '', window.location.pathname + window.location.search);

        try {
            const res = await fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (!res.ok) throw new Error(`Discord API ${res.status}`);
            const profile = await res.json();
            const name = profile.global_name || profile.username;
            const user = { name };
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify(user));
            console.log('[DiscordAuth] logged in as', name);
            return user;
        } catch (err) {
            console.error('[DiscordAuth] failed to resolve profile', err);
            return null;
        }
    }

    return { login, logout, getStoredUser, resolveFromRedirect };
})();
</script>

<script>
/* ============================================================
   LEADERBOARD (cached in this browser via localStorage)
   ============================================================ */
const Leaderboard = (function () {
    const CACHE_KEY = 'mg_leaderboard_cache';

    function readCache() {
        try {
            const raw = localStorage.getItem(CACHE_KEY);
            return raw ? JSON.parse(raw) : {};
        } catch (err) {
            console.error('[Leaderboard] failed to read cache', err);
            return {};
        }
    }

    function writeCache(data) {
        try {
            localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        } catch (err) {
            console.error('[Leaderboard] failed to write cache', err);
        }
    }

    function init() {
        console.log('[Leaderboard] using local browser cache (localStorage)');
    }

    async function recordResult(name, gameId, success, elapsedMs) {
        console.log('[Leaderboard] recording result', { name, gameId, success, elapsedMs });
        const cache = readCache();
        const entry = cache[name] || { name, wins: 0, plays: 0, bestMs: null };
        entry.plays += 1;
        if (success) {
            entry.wins += 1;
            entry.bestMs = (entry.bestMs === null || elapsedMs < entry.bestMs) ? elapsedMs : entry.bestMs;
        }
        entry.lastGame = gameId;
        entry.updatedAt = Date.now();
        cache[name] = entry;
        writeCache(cache);
    }

    async function top(limit = 10) {
        const cache = readCache();
        return Object.values(cache)
            .sort((a, b) => b.wins - a.wins)
            .slice(0, limit);
    }

    function clear() {
        localStorage.removeItem(CACHE_KEY);
        console.log('[Leaderboard] cache cleared');
    }

    return { init, recordResult, top, clear };
})();
</script>

<script>
/* ============================================================
   SFX
   ============================================================ */
const SFX = (function () {
    let ctx = null;
    let enabled = true;
    let master = 0.5;

    function ac() {
        if (!ctx) {
            try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            catch (e) { enabled = false; }
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return ctx;
    }

    function tone(freq, dur, type, vol, slideTo, delay) {
        if (!enabled) return;
        const a = ac(); if (!a) return;
        const t0 = a.currentTime + (delay || 0);
        const osc = a.createOscillator();
        const gain = a.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
        const v = (vol == null ? 0.3 : vol) * master;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(v, t0 + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain); gain.connect(a.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.02);
    }

    function noise(dur, vol, filterFreq) {
        if (!enabled) return;
        const a = ac(); if (!a) return;
        const bufferSize = a.sampleRate * dur;
        const buffer = a.createBuffer(1, bufferSize, a.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noiseNode = a.createBufferSource();
        noiseNode.buffer = buffer;
        const filter = a.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = filterFreq || 1000;
        const gain = a.createGain();
        const v = (vol == null ? 0.2 : vol) * master;
        gain.gain.setValueAtTime(v, a.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
        noiseNode.connect(filter);
        filter.connect(gain);
        gain.connect(a.destination);
        noiseNode.start();
    }

    return { tone, noise };
})();
</script>

<script>
/* ============================================================
   UI & APP CONTROLLER
   ============================================================ */
function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

async function renderLeaderboard() {
    const tbody = document.getElementById('lb-body');
    if (!tbody) return;

    const entries = await Leaderboard.top(10);
    tbody.innerHTML = '';

    if (entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color: var(--muted); text-align: center; padding: 20px;">No games recorded yet</td></tr>';
        return;
    }

    const gameMap = {};
    if (typeof GAMES_MANIFEST !== 'undefined') {
        GAMES_MANIFEST.forEach(g => { gameMap[g.id] = g.title; });
    }

    entries.forEach((entry, i) => {
        const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
        const rankLabel = `#${i + 1}`;
        const lastGameTitle = entry.lastGame ? (gameMap[entry.lastGame] || entry.lastGame) : '—';

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="${rankClass}">${rankLabel}</td>
            <td><strong>${escapeHtml(entry.name)}</strong></td>
            <td class="glow-success">${entry.wins}</td>
            <td>${entry.plays}</td>
            <td style="color: var(--accent);">${escapeHtml(lastGameTitle)}</td>
        `;
        tbody.appendChild(tr);
    });
}

function renderLobby() {
    const grid = document.getElementById('game-grid');
    if (!grid) return;
    grid.innerHTML = '';

    GAMES_MANIFEST.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
            <div class="g-title">${escapeHtml(game.title)}</div>
            <div class="g-hint">${escapeHtml(game.hint)}</div>
        `;
        card.addEventListener('click', () => {
            console.log('[Lobby] Selected game:', game.id);
            // Difficulty picker logic or launch can be attached here
        });
        grid.appendChild(card);
    });
}

document.addEventListener('DOMContentLoaded', async () => {
    Leaderboard.init();
    
    let user = await DiscordAuth.resolveFromRedirect();
    const loginGate = document.getElementById('login-gate');
    const lobby = document.getElementById('lobby');
    const leaderboardEl = document.getElementById('leaderboard');
    const userBox = document.getElementById('user-box');
    const loginBtn = document.getElementById('discord-login-btn');

    if (loginBtn) {
        loginBtn.addEventListener('click', () => DiscordAuth.login());
    }

    if (user) {
        if (loginGate) loginGate.classList.add('hidden');
        if (lobby) lobby.classList.remove('hidden');
        if (leaderboardEl) leaderboardEl.classList.remove('hidden');
        if (userBox) userBox.innerHTML = `Signed in as <strong>${escapeHtml(user.name)}</strong>`;
        renderLobby();
        await renderLeaderboard();
    } else {
        if (loginGate) loginGate.classList.remove('hidden');
        if (lobby) lobby.classList.add('hidden');
        if (leaderboardEl) leaderboardEl.classList.add('hidden');
    }
});
</script>
