MG.register('gaslight', {
    title: 'Gaslight',
    hint: 'Memorize the scene · then answer',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const rounds = 3;
        const itemCount = 3 + diff;
        const flashMs = Math.max(700, 1900 - diff * 280);

        const ICONS = ['🔑','💊','📁','💵','🔫','📱','💎','🧪','📷','🎫','🧨','🗝️'];
        let round = 0, correct = 0;
        api.setDots(rounds);

        const box = document.createElement('div');
        box.style.cssText = 'width:480px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;';
        api.board.appendChild(box);

        api.startTimer(flashMs / 1000 * rounds + rounds * 6, () => finish());

        function scene() {
            if (round >= rounds) { finish(); return; }
            api.setTag('OBSERVE ' + (round + 1) + '/' + rounds);
            const items = [];
            const used = new Set();
            while (items.length < itemCount) {
                const ic = ICONS[api.randInt(0, ICONS.length - 1)];
                if (!used.has(ic)) { used.add(ic); items.push(ic); }
            }
            box.innerHTML = `<div class="label">MEMORIZE</div>
                <div style="display:grid;grid-template-columns:repeat(${Math.ceil(Math.sqrt(itemCount))},1fr);
                     gap:18px;font-size:46px;">
                     ${items.map(i => `<span>${i}</span>`).join('')}
                </div>`;
            setTimeout(() => question(items), flashMs);
        }

        function question(items) {
            const qType = api.randInt(0, Math.min(2, diff - 1 < 0 ? 0 : diff - 1));
            let prompt, answer, options;

            if (qType === 0) {
                const present = Math.random() < 0.5;
                const pick = present ? items[api.randInt(0, items.length - 1)]
                                     : pickAbsent(items);
                prompt = `Was this item in the scene?  ${pick}`;
                answer = present ? 'YES' : 'NO';
                options = ['YES', 'NO'];
            } else if (qType === 1) {
                prompt = 'How many items did you see?';
                answer = String(items.length);
                const set = new Set([items.length]);
                while (set.size < 4) set.add(api.randInt(Math.max(1, items.length - 2), items.length + 2));
                options = [...set].sort(() => Math.random() - 0.5).map(String);
            } else {
                const real = items[api.randInt(0, items.length - 1)];
                prompt = 'Which item was present?';
                answer = real;
                const set = new Set([real]);
                while (set.size < 4) set.add(ICONS[api.randInt(0, ICONS.length - 1)]);
                options = [...set].sort(() => Math.random() - 0.5);
            }
            api.setTag('RECALL');

            box.innerHTML = `<div class="label">RECALL</div>
                <div style="font-family:var(--display);font-size:18px;">${prompt}</div>
                <div id="opts" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;"></div>`;
            const opts = box.querySelector('#opts');
            options.forEach(o => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.style.fontSize = o.length <= 2 ? '24px' : '14px';
                b.textContent = o;
                b.onclick = () => answerPicked(o === answer);
                opts.appendChild(b);
            });
        }

        function pickAbsent(items) {
            let ic;
            do { ic = ICONS[api.randInt(0, ICONS.length - 1)]; } while (items.includes(ic));
            return ic;
        }

        function answerPicked(ok) {
            if (ok) correct++; else api.shake();
            const st = [];
            for (let i = 0; i < rounds; i++) {
                if (i < round) st[i] = (i < correct) ? 'done' : 'fail';
                else st[i] = '';
            }
            round++;
            const st2 = [];
            for (let i = 0; i < rounds; i++) {
                if (i < round) st2[i] = (i < correct) ? 'done' : 'fail';
                else st2[i] = (i === round) ? 'active' : '';
            }
            api.setDots(rounds, st2);
            setTimeout(scene, 400);
        }

        function finish() {
            const pass = correct >= Math.ceil(rounds / 2 + (diff >= 4 ? 0.5 : 0));
            api.stopTimer();
            setTimeout(() => pass ? api.succeed() : api.fail(), 200);
        }

        scene();
        return { destroy() {} };
    }
});


/* ---- getaway.js ---- */
MG.register('getaway', {
    title: 'Getaway',
    hint: 'A / D (or ← →) to switch lanes · dodge traffic until you’re clear',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const lanes = 3;
        const W = 300, H = 330;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const laneX = (i) => (W / lanes) * (i + 0.5);
        let targetLane = 1, carX = laneX(1);
        const carW = 36, carH = 58, carY = H - 70;
        let done = false, dash = 0, spawnT = 0;
        const speed = 3 + diff * 0.7;
        const spawnEvery = Math.max(22, 60 - diff * 7);
        const traffic = [];

        function key(e) {
            if (done) return;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') { targetLane = Math.max(0, targetLane - 1); api.sfx('tick'); }
            else if (e.code === 'ArrowRight' || e.code === 'KeyD') { targetLane = Math.min(lanes - 1, targetLane + 1); api.sfx('tick'); }
        }
        document.addEventListener('keydown', key);

        api.setTag('FLOOR IT');
        api.startTimer(Math.max(11, 17 - diff), () => win());
        function fail() { if (done) return; done = true; document.removeEventListener('keydown', key); api.stopTimer(); api.shake(); api.sfx('bad'); setTimeout(() => api.fail(), 250); }
        function win() { if (done) return; done = true; document.removeEventListener('keydown', key); api.stopTimer(); api.setTag('CLEAR'); setTimeout(() => api.succeed(), 250); }

        function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

        function draw() {
            if (!done) {
                carX += (laneX(targetLane) - carX) * 0.22;
                dash = (dash + speed) % 44;
                if (++spawnT >= spawnEvery) {
                    spawnT = 0;
                    const l = api.randInt(0, lanes - 1);
                    traffic.push({ x: laneX(l), y: -carH });
                    if (diff >= 3 && Math.random() < 0.45) {
                        const l2 = (l + 1 + api.randInt(0, lanes - 2)) % lanes;
                        traffic.push({ x: laneX(l2), y: -carH - api.rand(40, 110) });
                    }
                }
            }

            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 3;
            for (let i = 1; i < lanes; i++) { const x = (W / lanes) * i; for (let y = -44 + dash; y < H; y += 44) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 22); ctx.stroke(); } }

            let crash = false;
            for (const t of traffic) {
                if (!done) t.y += speed;
                ctx.fillStyle = dng; rr(t.x - carW / 2, t.y, carW, carH, 7); ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(t.x - carW / 2 + 5, t.y + 9, carW - 10, 15, 3); ctx.fill();
                if (Math.abs(t.x - carX) < carW * 0.78 && t.y + carH > carY + 8 && t.y < carY + carH - 8) crash = true;
            }
            for (let i = traffic.length - 1; i >= 0; i--) if (traffic[i].y > H + 30) traffic.splice(i, 1);

            ctx.fillStyle = acc; ctx.shadowColor = acc; ctx.shadowBlur = 14; rr(carX - carW / 2, carY, carW, carH, 7); ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(carX - carW / 2 + 5, carY + 9, carW - 10, 15, 3); ctx.fill();

            if (crash && !done) { fail(); return; }
            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
});


/* ---- ghostsignal.js ---- */
MG.register('ghostsignal', {
    title: 'Ghost Signal',
    hint: '↑↓ frequency · ←→ phase · lock to match',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 480, H = 240;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const tol = Math.max(0.04, 0.16 - diff * 0.022);
        const noise = 4 + diff * 3;
        const targetF = api.rand(0.6, 2.2);
        const targetP = api.rand(0, Math.PI * 2);
        let f = api.rand(0.6, 2.2), p = api.rand(0, Math.PI * 2);
        let lockT = 0;
        const needLock = 55;

        api.startTimer(Math.max(12, 24 - diff * 2), () => { unbind(); api.fail(); });

        function key(e) {
            if (e.code === 'ArrowUp')    { f += 0.04; e.preventDefault(); }
            if (e.code === 'ArrowDown')  { f -= 0.04; e.preventDefault(); }
            if (e.code === 'ArrowLeft')  { p -= 0.12; e.preventDefault(); }
            if (e.code === 'ArrowRight') { p += 0.12; e.preventDefault(); }
            f = Math.max(0.4, Math.min(2.6, f));
        }
        document.addEventListener('keydown', key);
        function unbind() { document.removeEventListener('keydown', key); }

        function wave(fr, ph, amp, color, glow) {
            ctx.strokeStyle = color; ctx.lineWidth = 2;
            ctx.shadowColor = glow ? color : 'transparent'; ctx.shadowBlur = glow ? 10 : 0;
            ctx.beginPath();
            for (let x = 0; x <= W; x += 2) {
                const t = (x / W) * Math.PI * 6;
                const y = H / 2 - Math.sin(t * fr + ph) * amp
                    + (glow ? 0 : (Math.random() - 0.5) * noise);
                x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
            }
            ctx.stroke(); ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            wave(targetF, targetP, 60, 'rgba(255,255,255,0.22)', false);
            const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8';
            wave(f, p, 60, acc, true);

            const df = Math.abs(f - targetF);
            let dp = Math.abs(((p - targetP) % (Math.PI * 2)));
            dp = Math.min(dp, Math.PI * 2 - dp) / Math.PI;
            const locked = df < tol && dp < tol;

            if (locked) { lockT++; api.setTag('LOCKING ' + Math.round(lockT / needLock * 100) + '%'); }
            else { lockT = Math.max(0, lockT - 2); api.setTag('SCANNING'); }

            ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(20, H - 14, W - 40, 6);
            ctx.fillStyle = acc; ctx.fillRect(20, H - 14, (W - 40) * (lockT / needLock), 6);

            if (lockT >= needLock) { api.stopTimer(); unbind(); setTimeout(() => api.succeed(), 200); return; }
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); unbind(); } };
    }
});


/* ---- harvest.js ---- */
MG.register('harvest', {
    title: 'Harvest',
    hint: 'SPACE / click as each crop crosses the cut line',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 360, H = 320, cutY = H - 60;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const total = 8 + diff * 2;
        const speed = 1.4 + diff * 0.7;
        const gap = Math.max(34, 64 - diff * 6);
        const needPct = 0.65 + diff * 0.04;
        const window_ = Math.max(22, 44 - diff * 3);

        let crops = [], spawned = 0, cut = 0, judged = 0, frame = 0, ended = false, flash = 0;

        function attempt() {
            if (ended) return;
            flash = 6;
            let best = null, bestD = 999;
            crops.forEach((c) => {
                if (!c.cut && !c.missed) { const d = Math.abs(c.y - cutY); if (d < bestD) { bestD = d; best = c; } }
            });
            if (best && bestD < window_) { best.cut = true; cut++; judged++; api.sfx('select'); }
            checkEnd();
        }
        function key(e) { if (e.code === 'Space') { e.preventDefault(); attempt(); } }
        document.addEventListener('keydown', key);
        cvs.addEventListener('click', attempt);

        function checkEnd() {
            if (judged >= total) {
                api.setTag(Math.round(cut / total * 100) + '%');
                finish((cut / total) >= needPct);
            }
        }
        api.setTag('HARVEST');
        api.startTimer(Math.max(14, 26 - diff), () => finish((cut / total) >= needPct));
        function finish(ok) { if (ended) return; ended = true; document.removeEventListener('keydown', key); api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 250); }

        function draw() {
            frame++;
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            const dng = (getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#ff3b5c').trim();
            if (!ended && spawned < total && frame % gap === 0) {
                crops.push({ x: api.rand(60, W - 60), y: -20, cut: false, missed: false }); spawned++;
            }
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = flash > 0 ? suc : acc; ctx.lineWidth = flash > 0 ? 4 : 2;
            ctx.shadowColor = acc; ctx.shadowBlur = flash > 0 ? 14 : 4;
            ctx.beginPath(); ctx.moveTo(0, cutY); ctx.lineTo(W, cutY); ctx.stroke(); ctx.shadowBlur = 0;
            if (flash > 0) flash--;

            crops.forEach((c) => {
                if (c.cut) return;
                if (!ended) c.y += speed;
                if (c.y > cutY + window_ && !c.missed) { c.missed = true; judged++; }
                ctx.fillStyle = c.missed ? dng : suc;
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = c.missed ? 0 : 6;
                ctx.beginPath();
                ctx.moveTo(c.x, c.y - 14); ctx.lineTo(c.x + 6, c.y); ctx.lineTo(c.x, c.y + 8); ctx.lineTo(c.x - 6, c.y);
                ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.moveTo(c.x, c.y + 8); ctx.lineTo(c.x, c.y + 18); ctx.stroke();
            });
            crops = crops.filter((c) => c.y < H + 30 && !c.cut);
            checkEnd();
            if (!ended) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
});


/* ---- hottrace.js ---- */
MG.register('hottrace', {
    title: 'Hot Trace',
    hint: 'Drag the probe to the end · don’t touch the walls',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 480, H = 280;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'crosshair';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const halfW = Math.max(11, 26 - diff * 3);
        const segs = 6 + diff;
        const pts = [];
        for (let i = 0; i <= segs; i++) {
            const x = 30 + (W - 60) * (i / segs);
            const y = H / 2 + Math.sin(i * 0.9 + diff) * (H / 2 - 50) * (i === 0 || i === segs ? 0 : 1);
            pts.push({ x, y });
        }
        const start = pts[0], end = pts[pts.length - 1];

        let probe = { x: start.x, y: start.y };
        let holding = false, strikes = 0, won = false, lost = false;
        const maxStrikes = Math.max(2, 5 - diff);
        let progress = 0;

        function distToCorridor(px, py) {
            let best = 1e9;
            for (let i = 0; i < pts.length - 1; i++) {
                best = Math.min(best, segDist(px, py, pts[i], pts[i + 1]));
            }
            return best;
        }
        function segDist(px, py, a, b) {
            const dx = b.x - a.x, dy = b.y - a.y;
            const len2 = dx * dx + dy * dy || 1;
            let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            const cx = a.x + t * dx, cy = a.y + t * dy;
            return Math.hypot(px - cx, py - cy);
        }
        function rel(e) {
            const b = cvs.getBoundingClientRect();
            return { x: (e.clientX - b.left) * (cvs.width / b.width),
                     y: (e.clientY - b.top) * (cvs.height / b.height) };
        }

        cvs.addEventListener('mousedown', (e) => {
            const p = rel(e);
            if (Math.hypot(p.x - probe.x, p.y - probe.y) < 22) holding = true;
        });
        window.addEventListener('mouseup', up);
        function up() { holding = false; }
        cvs.addEventListener('mousemove', (e) => {
            if (!holding || won || lost) return;
            const p = rel(e);
            probe = p;
            const d = distToCorridor(p.x, p.y);
            if (d > halfW) {
                strikes++; api.shake(); holding = false;
                probe = nearestOnLine(p);
                if (strikes >= maxStrikes) { lost = true; api.stopTimer(); end_(false); }
            }
            if (Math.hypot(p.x - end.x, p.y - end.y) < 18) { won = true; api.stopTimer(); end_(true); }
        });
        function nearestOnLine(p) {
            let best = { x: start.x, y: start.y }, bd = 1e9;
            for (let i = 0; i < pts.length - 1; i++) {
                const a = pts[i], b = pts[i + 1];
                const dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy || 1;
                let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2; t = Math.max(0, Math.min(1, t));
                const cx = a.x + t * dx, cy = a.y + t * dy, d = Math.hypot(p.x - cx, p.y - cy);
                if (d < bd) { bd = d; best = { x: cx, y: cy }; }
            }
            return best;
        }
        function end_(ok) {
            window.removeEventListener('mouseup', up);
            setTimeout(() => ok ? api.succeed() : api.fail(), 300);
        }

        api.setTag('TRACING');
        api.startTimer(Math.max(12, 24 - diff * 2), () => { if (!won && !lost) end_(false); });

        function draw() {
            ctx.clearRect(0, 0, W, H);
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            const dng = (getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#ff3b5c').trim();

            ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = halfW * 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5;
            ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();

            ctx.fillStyle = acc; ctx.beginPath(); ctx.arc(start.x, start.y, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = suc; ctx.shadowColor = suc; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(end.x, end.y, 11, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

            ctx.fillStyle = holding ? acc : '#fff';
            ctx.shadowColor = acc; ctx.shadowBlur = holding ? 14 : 4;
            ctx.beginPath(); ctx.arc(probe.x, probe.y, 8, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

            for (let i = 0; i < maxStrikes; i++) {
                ctx.fillStyle = i < strikes ? dng : 'rgba(255,255,255,0.15)';
                ctx.beginPath(); ctx.arc(20 + i * 16, 18, 5, 0, Math.PI * 2); ctx.fill();
            }
            if (!holding && !won && !lost) {
                ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
                ctx.fillText('grab the probe at start', W / 2, H - 12);
            }
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); window.removeEventListener('mouseup', up); } };
    }
});


/* ---- hotwire.js ---- */
MG.register('hotwire', {
    title: 'Hotwire',
    hint: 'Connect matching wires, then time the ignition spark',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 420, H = 280;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const pairCount = 2 + Math.floor(diff / 1.5);
        const colors = ['#ff4d6d', '#ffd23f', '#5b8cff', '#39d98a', '#c06bff'];
        const order = [...Array(pairCount).keys()];
        const rightOrder = order.slice().sort(() => Math.random() - 0.5);
        const gap = (H - 120) / (pairCount - 1 || 1);
        const left = order.map((i) => ({ x: 60, y: 40 + i * gap, c: colors[i], done: false }));
        const right = rightOrder.map((cIdx, i) => ({ x: W - 60, y: 40 + i * gap, c: colors[cIdx] }));

        let phase = 'wire', dragFrom = null, mouse = { x: 0, y: 0 }, solved = 0, ended = false;
        const links = [];
        let pos = 0, dir = 1, zoneX = 0, igniteReady = false;
        const igniteSpeed = 2.6 + diff * 0.8;
        const zoneW = Math.max(40, 90 - diff * 10);

        function rel(e) {
            const b = cvs.getBoundingClientRect();
            return { x: (e.clientX - b.left) * (cvs.width / b.width), y: (e.clientY - b.top) * (cvs.height / b.height) };
        }
        function nodeAt(x, y, arr) { return arr.find((n) => Math.hypot(n.x - x, n.y - y) < 16); }

        cvs.addEventListener('mousedown', (e) => {
            if (phase !== 'wire' || ended) return;
            const p = rel(e); const n = nodeAt(p.x, p.y, left);
            if (n && !n.done) dragFrom = n;
        });
        cvs.addEventListener('mousemove', (e) => { mouse = rel(e); });
        cvs.addEventListener('mouseup', (e) => {
            if (phase !== 'wire' || !dragFrom) return;
            const p = rel(e); const t = nodeAt(p.x, p.y, right);
            if (t && t.c === dragFrom.c) {
                dragFrom.done = true; links.push({ a: dragFrom, b: t, c: dragFrom.c }); solved++; api.sfx('latch');
                if (solved >= pairCount) {
                    phase = 'ignite'; api.setTag('IGNITION');
                    zoneX = 60 + Math.random() * (W - 120 - zoneW);
                    pos = 50; dir = 1;
                    setTimeout(() => { igniteReady = true; }, 350);
                }
            } else if (t) { api.shake(); api.stopTimer(); ended = true; setTimeout(() => api.fail(), 200); }
            dragFrom = null;
        });
        cvs.addEventListener('click', () => {
            if (phase !== 'ignite' || ended || !igniteReady) return;
            if (pos >= zoneX && pos <= zoneX + zoneW) { finish(true); }
            else { api.shake(); finish(false); }
        });
        function key(e) { if (e.code === 'Space' && phase === 'ignite') { e.preventDefault(); cvs.click(); } }
        document.addEventListener('keydown', key);

        api.setTag('STRIP WIRES');
        api.startTimer(Math.max(14, 26 - diff * 2), () => finish(false));
        function finish(ok) { if (ended) return; ended = true; document.removeEventListener('keydown', key); api.stopTimer(); if (ok) api.sfx('charge'); setTimeout(() => ok ? api.succeed() : api.fail(), 250); }

        function wire(x1, y1, x2, y2, c, w) {
            ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.shadowColor = c; ctx.shadowBlur = 6;
            const mx = (x1 + x2) / 2;
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2); ctx.stroke(); ctx.shadowBlur = 0;
        }
        function draw() {
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            ctx.clearRect(0, 0, W, H);
            links.forEach((l) => wire(l.a.x, l.a.y, l.b.x, l.b.y, l.c, 4));
            if (dragFrom) wire(dragFrom.x, dragFrom.y, mouse.x, mouse.y, dragFrom.c, 3);
            const port = (n, filled) => { ctx.fillStyle = filled ? n.c : '#0a0e14'; ctx.strokeStyle = n.c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(n.x, n.y, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); };
            left.forEach((n) => port(n, n.done)); right.forEach((n) => port(n, false));

            if (phase === 'ignite') {
                const ty = H - 40;
                ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(50, ty - 12, W - 100, 24);
                ctx.fillStyle = 'rgba(57,217,138,0.2)'; ctx.strokeStyle = suc; ctx.lineWidth = 2;
                ctx.fillRect(zoneX, ty - 12, zoneW, 24); ctx.strokeRect(zoneX, ty - 12, zoneW, 24);
                if (!ended && igniteReady) { pos += dir * igniteSpeed; if (pos > W - 50) { pos = W - 50; dir = -1; } if (pos < 50) { pos = 50; dir = 1; } }
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.shadowColor = acc; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.moveTo(pos, ty - 18); ctx.lineTo(pos, ty + 18); ctx.stroke(); ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
                ctx.fillText(igniteReady ? 'SPACE / click in the green to start the engine' : 'get ready…', W / 2, ty - 26);
            }
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
});


/* ---- intrusion.js ---- */
MG.register('intrusion', {
    title: 'Intrusion',
    hint: 'Click a connected node to hop · avoid red (monitored) nodes',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 480, H = 300;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const cols = 4 + Math.floor(diff / 2);
        const nodes = [];
        const colX = [];
        for (let c = 0; c < cols; c++) {
            const x = 40 + (W - 80) * (c / (cols - 1));
            colX.push(x);
            const count = c === 0 || c === cols - 1 ? 1 : api.randInt(2, 3);
            for (let i = 0; i < count; i++) {
                const y = count === 1 ? H / 2 : 50 + (H - 100) * (i / (count - 1));
                nodes.push({ x, y, col: c, monitored: false, phase: Math.random() * Math.PI * 2 });
            }
        }
        const start = nodes.find((n) => n.col === 0);
        const server = nodes.find((n) => n.col === cols - 1);

        const edges = [];
        for (let c = 0; c < cols - 1; c++) {
            const a = nodes.filter((n) => n.col === c);
            const b = nodes.filter((n) => n.col === c + 1);
            a.forEach((na) => b.forEach((nb) => edges.push([na, nb])));
        }
        function neighbors(n) {
            return edges.filter((e) => e[0] === n || e[1] === n)
                        .map((e) => e[0] === n ? e[1] : e[0])
                        .filter((m) => m.col === n.col + 1);
        }

        const mid = nodes.filter((n) => n.col > 0 && n.col < cols - 1);
        const monCount = Math.min(mid.length, 1 + diff);
        mid.sort(() => Math.random() - 0.5).slice(0, monCount).forEach((n) => n.monitored = true);
        const pulseSpeed = 0.02 + diff * 0.006;

        let pos = start, won = false, lost = false, t = 0;

        function isRed(n) {
            return n.monitored && Math.sin(t * 60 * pulseSpeed * 0.05 + n.phase) > 0.2;
        }
        function red(n) { return n.monitored && (Math.sin(n.phase + t * pulseSpeed) > 0.15); }

        function rel(e) {
            const b = cvs.getBoundingClientRect();
            return { x: (e.clientX - b.left) * (cvs.width / b.width),
                     y: (e.clientY - b.top) * (cvs.height / b.height) };
        }
        cvs.addEventListener('click', (e) => {
            if (won || lost) return;
            const p = rel(e);
            const target = neighbors(pos).find((n) => Math.hypot(n.x - p.x, n.y - p.y) < 22);
            if (!target) return;
            if (red(target)) { lost = true; api.shake(); end_(false); return; }
            pos = target;
            if (pos === server) { won = true; end_(true); }
        });
        function end_(ok) { api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 300); }

        api.setTag('INTRUDING');
        api.startTimer(Math.max(14, 28 - diff * 2), () => { if (!won && !lost) end_(false); });

        function draw() {
            t += 1;
            ctx.clearRect(0, 0, W, H);
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const dng = (getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#ff3b5c').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();

            edges.forEach((e) => {
                const reachable = e[0] === pos;
                ctx.strokeStyle = reachable ? acc : 'rgba(255,255,255,0.08)';
                ctx.lineWidth = reachable ? 2 : 1;
                ctx.beginPath(); ctx.moveTo(e[0].x, e[0].y); ctx.lineTo(e[1].x, e[1].y); ctx.stroke();
            });
            nodes.forEach((n) => {
                const r = red(n);
                let col = 'rgba(255,255,255,0.2)';
                if (n === server) col = suc;
                else if (r) col = dng;
                else if (n.monitored) col = 'rgba(255,140,0,0.5)';
                const hop = neighbors(pos).includes(n);
                ctx.fillStyle = n === pos ? acc : '#0a0e14';
                ctx.strokeStyle = col; ctx.lineWidth = hop ? 3 : 2;
                ctx.shadowColor = col; ctx.shadowBlur = (r || n === server) ? 14 : (hop ? 10 : 0);
                ctx.beginPath(); ctx.arc(n.x, n.y, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.shadowBlur = 0;
                if (n === server) {
                    ctx.fillStyle = suc; ctx.font = '9px monospace'; ctx.textAlign = 'center';
                    ctx.fillText('SRV', n.x, n.y + 26);
                }
            });
            ctx.strokeStyle = acc; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(pos.x, pos.y, 19, 0, Math.PI * 2); ctx.stroke();

            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- jammer.js ---- */
MG.register('jammer', {
    title: 'Signal Jammer',
    hint: 'Jam each alarm channel when its bar peaks',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const channels = 3 + Math.floor(diff / 1.5);
        const W = 440, H = 260;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const chW = (W - 40) / channels;
        const peakLow = 80, peakHigh = 100;
        const chans = [];
        for (let i = 0; i < channels; i++) {
            chans.push({ level: api.rand(0, 40), speed: 0.8 + diff * 0.4 + Math.random() * 0.8, dir: 1, jammed: false });
        }
        let jammedCount = 0, ended = false, wrong = 0;
        const maxWrong = Math.max(2, 5 - diff);
        api.setDots(channels);

        function rel(e) {
            const b = cvs.getBoundingClientRect();
            const x = (e.clientX - b.left) * (cvs.width / b.width);
            return Math.floor((x - 20) / chW);
        }
        cvs.addEventListener('click', (e) => {
            if (ended) return;
            const idx = rel(e);
            if (idx < 0 || idx >= channels || chans[idx].jammed) return;
            const c = chans[idx];
            if (c.level >= peakLow && c.level <= peakHigh) {
                c.jammed = true; jammedCount++; api.sfx('zap');
                api.setDots(channels, Array.from({ length: channels }, (_, i) => i < jammedCount ? 'done' : ''));
                if (jammedCount >= channels) finish(true);
            } else { wrong++; api.shake(); if (wrong >= maxWrong) finish(false); }
        });

        api.setTag('JAMMING');
        api.startTimer(Math.max(13, 24 - diff * 2), () => finish(false));
        function finish(ok) { if (ended) return; ended = true; api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 250); }

        function draw() {
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            const dng = (getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#ff3b5c').trim();
            ctx.clearRect(0, 0, W, H);
            const top = 30, bh = H - 80;
            chans.forEach((c, i) => {
                const x = 20 + i * chW + 6, w = chW - 12;
                if (!ended && !c.jammed) {
                    c.level += c.dir * c.speed;
                    if (c.level > 100) { c.level = 100; c.dir = -1; }
                    if (c.level < 0) { c.level = 0; c.dir = 1; }
                }
                ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(x, top, w, bh);
                ctx.fillStyle = 'rgba(57,217,138,0.18)';
                ctx.fillRect(x, top + bh * (1 - peakHigh / 100), w, bh * (peakHigh - peakLow) / 100);
                const lvl = c.jammed ? 0 : c.level;
                const fh = bh * lvl / 100;
                ctx.fillStyle = c.jammed ? suc : (lvl >= peakLow ? acc : 'rgba(255,140,0,0.7)');
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = (lvl >= peakLow || c.jammed) ? 12 : 0;
                ctx.fillRect(x, top + bh - fh, w, fh); ctx.shadowBlur = 0;
                ctx.fillStyle = c.jammed ? suc : 'rgba(255,255,255,0.5)'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
                ctx.fillText(c.jammed ? 'JAMMED' : ('CH' + (i + 1)), x + w / 2, H - 34);
            });
            for (let i = 0; i < maxWrong; i++) {
                ctx.fillStyle = i < wrong ? dng : 'rgba(255,255,255,0.15)';
                ctx.beginPath(); ctx.arc(20 + i * 14, H - 14, 4, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
            ctx.fillText('click a channel at its peak (green band)', W / 2, 16);
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

MG.register('keypad', {
    title: 'Keypad',
    hint: '● right spot · ○ right digit, wrong spot',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const len = 3 + Math.floor(diff / 2);
        const attempts = Math.max(4, 8 - diff);
        const code = Array.from({ length: len }, () => api.randInt(0, 9));

        let guess = [], tries = 0, ended = false;

        const box = document.createElement('div');
        box.style.cssText = 'display:flex;gap:28px;align-items:flex-start;';
        box.innerHTML = `
            <div>
              <div class="label">ENTRY</div>
              <div id="entry" style="display:flex;gap:8px;margin-bottom:12px;height:46px;align-items:center;width:184px;"></div>
              <div id="pad" style="display:grid;grid-template-columns:repeat(3,56px);gap:8px;width:184px;"></div>
            </div>
            <div style="min-width:150px;">
              <div class="label">HISTORY (${attempts} tries)</div>
              <div id="hist" style="display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:14px;"></div>
            </div>`;
        api.board.appendChild(box);
        const entryEl = box.querySelector('#entry');
        const padEl = box.querySelector('#pad');
        const histEl = box.querySelector('#hist');

        function renderEntry() {
            entryEl.innerHTML = '';
            for (let i = 0; i < len; i++) {
                const d = document.createElement('div');
                d.style.cssText = `flex:1;height:46px;border:1px solid var(--line);border-radius:6px;
                    display:grid;place-items:center;font-size:22px;font-family:var(--mono);
                    color:var(--accent);${guess[i] !== undefined ? 'border-color:var(--accent);' : ''}`;
                d.textContent = guess[i] !== undefined ? guess[i] : '·';
                entryEl.appendChild(d);
            }
        }
        const padKeys = [1,2,3,4,5,6,7,8,9,'⌫',0,'✓'];
        padKeys.forEach((k) => {
            const b = document.createElement('button');
            b.className = 'btn'; b.textContent = k; b.style.cssText = 'padding:12px 0;font-size:18px;min-width:0;';
            b.onclick = () => press(k);
            padEl.appendChild(b);
        });
        function press(k) {
            if (ended) return;
            if (k === '⌫') { guess.pop(); renderEntry(); return; }
            if (k === '✓') { submit(); return; }
            if (guess.length < len) { guess.push(k); renderEntry(); }
            api.sfx('click');
        }
        function submit() {
            if (guess.length < len) { api.shake(); return; }
            const exact = guess.filter((d, i) => d === code[i]).length;
            const codeCount = {}, guessCount = {};
            code.forEach((d, i) => { if (guess[i] !== d) codeCount[d] = (codeCount[d] || 0) + 1; });
            guess.forEach((d, i) => { if (code[i] !== d) guessCount[d] = (guessCount[d] || 0) + 1; });
            let partial = 0;
            Object.keys(guessCount).forEach((d) => { partial += Math.min(guessCount[d], codeCount[d] || 0); });

            const row = document.createElement('div');
            row.style.cssText = 'display:flex;justify-content:space-between;gap:10px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;';
            row.innerHTML = `<span>${guess.join(' ')}</span>
                <span>${'●'.repeat(exact)}<span style="color:var(--muted);">${'○'.repeat(partial)}</span></span>`;
            histEl.appendChild(row);

            tries++;
            if (exact === len) { ended = true; api.stopTimer(); api.setTag('UNLOCKED'); setTimeout(() => api.succeed(), 300); return; }
            if (tries >= attempts) { ended = true; api.shake(); api.stopTimer(); revealCode(); setTimeout(() => api.fail(), 600); return; }
            guess = []; renderEntry();
            api.setTag('TRY ' + (tries + 1) + '/' + attempts);
        }
        function revealCode() {
            const row = document.createElement('div');
            row.style.cssText = 'color:var(--danger);font-size:12px;margin-top:4px;';
            row.textContent = 'CODE: ' + code.join(' ');
            histEl.appendChild(row);
        }

        api.setTag('TRY 1/' + attempts);
        api.startTimer(Math.max(25, 60 - diff * 5), () => { if (!ended) api.fail(); });
        renderEntry();
        return { destroy() {} };
    }
});

MG.register('lasergrid', {
    title: 'Laser Grid',
    hint: 'Move to the exit · don’t touch the lasers',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 460, H = 280;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'none';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const laserCount = 3 + diff;
        const lasers = [];
        for (let i = 0; i < laserCount; i++) {
            const horizontal = Math.random() < 0.5;
            lasers.push({
                horizontal,
                pos: api.rand(60, (horizontal ? H : W) - 60),
                dir: Math.random() < 0.5 ? 1 : -1,
                speed: 0.6 + diff * 0.35 + Math.random() * 0.6
            });
        }
        let player = { x: 24, y: H / 2 }, ended = false, hasMouse = false;
        const exit = { x: W - 30, y: H / 2, r: 22 };

        function rel(e) {
            const b = cvs.getBoundingClientRect();
            return { x: (e.clientX - b.left) * (cvs.width / b.width), y: (e.clientY - b.top) * (cvs.height / b.height) };
        }
        cvs.addEventListener('mousemove', (e) => { const p = rel(e); player = p; hasMouse = true; });

        api.setTag('INFILTRATE');
        api.startTimer(Math.max(12, 22 - diff * 1.6), () => finish(false));
        function finish(ok) { if (ended) return; ended = true; api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 250); }

        function draw() {
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const dng = (getComputedStyle(document.documentElement).getPropertyValue('--danger') || '#ff3b5c').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.strokeRect(8, 8, W - 16, H - 16);

            ctx.fillStyle = suc; ctx.shadowColor = suc; ctx.shadowBlur = 16;
            ctx.beginPath(); ctx.arc(exit.x, exit.y, exit.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillStyle = '#0a0e14'; ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('EXIT', exit.x, exit.y);

            let hit = false;
            lasers.forEach((l) => {
                if (!ended) {
                    l.pos += l.dir * l.speed;
                    const max = l.horizontal ? H - 16 : W - 16;
                    if (l.pos > max) { l.pos = max; l.dir = -1; }
                    if (l.pos < 16) { l.pos = 16; l.dir = 1; }
                }
                ctx.strokeStyle = dng; ctx.lineWidth = 2; ctx.shadowColor = dng; ctx.shadowBlur = 8;
                ctx.beginPath();
                if (l.horizontal) { ctx.moveTo(10, l.pos); ctx.lineTo(W - 10, l.pos); if (Math.abs(player.y - l.pos) < 8) hit = true; }
                else { ctx.moveTo(l.pos, 10); ctx.lineTo(l.pos, H - 10); if (Math.abs(player.x - l.pos) < 8) hit = true; }
                ctx.stroke(); ctx.shadowBlur = 0;
            });

            if (hasMouse) {
                ctx.fillStyle = hit ? dng : acc; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(player.x, player.y, 8, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
                ctx.fillText('move your mouse from the left edge', 20, H / 2);
            }

            if (!ended && hasMouse) {
                if (hit) { api.shake(); finish(false); return; }
                if (Math.hypot(player.x - exit.x, player.y - exit.y) < exit.r) { finish(true); return; }
            }
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- lightsout.js ---- */
MG.register('lightsout', {
    title: 'Lights Out',
    hint: 'Turn every light off · each click flips that cell and its neighbours',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 320, H = 320;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();

        const n = Math.min(5, 3 + Math.floor(diff / 2));
        const cell = Math.floor(250 / n), gap = 6;
        const bx = (W - n * cell) / 2, by = (H - n * cell) / 2;
        const grid = Array.from({ length: n }, () => Array(n).fill(false));

        function toggle(r, c) { if (r >= 0 && c >= 0 && r < n && c < n) grid[r][c] = !grid[r][c]; }
        function flip(r, c) { toggle(r, c); toggle(r - 1, c); toggle(r + 1, c); toggle(r, c - 1); toggle(r, c + 1); }
        function lit() { let k = 0; for (const row of grid) for (const v of row) if (v) k++; return k; }

        const scramble = 2 + diff * 2;
        for (let i = 0; i < scramble; i++) flip(api.randInt(0, n - 1), api.randInt(0, n - 1));
        if (lit() === 0) flip(api.randInt(0, n - 1), api.randInt(0, n - 1));

        let done = false, used = 0;
        cvs.addEventListener('click', (e) => {
            if (done) return;
            const b = cvs.getBoundingClientRect();
            const x = (e.clientX - b.left) * (W / b.width), y = (e.clientY - b.top) * (H / b.height);
            const c = Math.floor((x - bx) / cell), r = Math.floor((y - by) / cell);
            if (r < 0 || c < 0 || r >= n || c >= n) return;
            flip(r, c); used++; api.sfx('tick');
            if (lit() === 0) { done = true; api.stopTimer(); api.setTag('CLEARED'); setTimeout(() => api.succeed(), 300); }
        });

        api.startTimer(Math.max(28, 52 - diff * 3), () => { if (!done) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); } });

        function draw() {
            api.setTag(done ? 'CLEARED' : ('LIT ' + lit()));
            ctx.clearRect(0, 0, W, H);
            for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
                const x = bx + c * cell, y = by + r * cell, on = grid[r][c];
                ctx.fillStyle = on ? acc : 'rgba(255,255,255,0.05)';
                if (on) { ctx.shadowColor = acc; ctx.shadowBlur = 16; }
                ctx.fillRect(x + gap / 2, y + gap / 2, cell - gap, cell - gap);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
                ctx.strokeRect(x + gap / 2, y + gap / 2, cell - gap, cell - gap);
            }
            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- livewire.js ---- */
MG.register('livewire', {
    title: 'Live Wire',
    hint: 'Drag each wire to its matching color',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const pairs = 3 + Math.floor(diff / 2);
        const time  = Math.max(8, 22 - diff * 2.5);

        const colors = ['#ff4d6d', '#ffd23f', '#00e0b8', '#5b8cff', '#c06bff', '#ff8a00'];
        const W = 480, H = 300, pad = 40;

        const wrap = document.createElement('div');
        wrap.style.cssText = `position:relative;width:${W}px;height:${H}px;`;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cssText = 'position:absolute;inset:0;';
        wrap.appendChild(cvs);
        api.board.appendChild(wrap);
        const ctx = cvs.getContext('2d');

        const order = [...Array(pairs).keys()];
        const rightOrder = order.slice().sort(() => Math.random() - 0.5);
        const gap = (H - pad * 2) / (pairs - 1 || 1);
        const left = order.map((i) => ({ x: pad, y: pad + i * gap, c: colors[i], done: false }));
        const right = rightOrder.map((cIdx, i) => ({ x: W - pad, y: pad + i * gap, c: colors[cIdx], idx: cIdx }));

        let dragFrom = null, mouse = { x: 0, y: 0 }, solved = 0;
        const links = [];

        api.startTimer(time, () => api.fail());

        function nodeAt(x, y, arr, r = 16) {
            return arr.find((n) => Math.hypot(n.x - x, n.y - y) < r);
        }

        cvs.addEventListener('mousedown', (e) => {
            const { x, y } = rel(e);
            const n = nodeAt(x, y, left);
            if (n && !n.done) dragFrom = n;
        });
        cvs.addEventListener('mousemove', (e) => { mouse = rel(e); });
        cvs.addEventListener('mouseup', (e) => {
            if (!dragFrom) return;
            const { x, y } = rel(e);
            const t = nodeAt(x, y, right);
            if (t && t.c === dragFrom.c) {
                dragFrom.done = true;
                links.push({ a: dragFrom, b: t, c: dragFrom.c });
                solved++;
                if (solved >= pairs) { api.stopTimer(); setTimeout(() => api.succeed(), 250); }
            } else if (t) {
                api.shake();
                api.stopTimer();
                setTimeout(() => api.fail(), 200);
            }
            dragFrom = null;
        });

        function rel(e) {
            const b = cvs.getBoundingClientRect();
            const sx = cvs.width / b.width;
            const sy = cvs.height / b.height;
            return { x: (e.clientX - b.left) * sx, y: (e.clientY - b.top) * sy };
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            links.forEach((l) => wire(l.a.x, l.a.y, l.b.x, l.b.y, l.c, 4));
            if (dragFrom) wire(dragFrom.x, dragFrom.y, mouse.x, mouse.y, dragFrom.c, 3);
            left.forEach((n) => port(n.x, n.y, n.c, n.done));
            right.forEach((n) => port(n.x, n.y, n.c, false));
            loop = requestAnimationFrame(draw);
        }
        function wire(x1, y1, x2, y2, c, w) {
            ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round';
            ctx.shadowColor = c; ctx.shadowBlur = 8;
            ctx.beginPath();
            const mx = (x1 + x2) / 2;
            ctx.moveTo(x1, y1);
            ctx.bezierCurveTo(mx, y1, mx, y2, x2, y2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
        function port(x, y, c, done) {
            ctx.fillStyle = done ? c : '#0a0e14';
            ctx.strokeStyle = c; ctx.lineWidth = 3;
            ctx.shadowColor = c; ctx.shadowBlur = done ? 14 : 6;
            ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;
        }

        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

MG.register('lockpick', {
    title: 'Lockpick',
    hint: 'Move mouse to rotate · click on the sweet spot',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const pins = 2 + Math.floor(diff / 1.3);
        const tol = Math.max(0.1, 0.32 - diff * 0.04);
        const W = 300, H = 300, cx = W / 2, cy = H / 2, R = 100;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'grab';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const sweetspots = [];
        for (let i = 0; i < pins; i++) sweetspots.push(api.rand(0, Math.PI * 2));
        let pin = 0, pickAng = 0, ended = false;
        api.setDots(pins);

        function rel(e) {
            const b = cvs.getBoundingClientRect();
            const x = (e.clientX - b.left) * (cvs.width / b.width) - cx;
            const y = (e.clientY - b.top) * (cvs.height / b.height) - cy;
            return Math.atan2(y, x);
        }
        function diffAng(a, b) {
            let d = Math.abs(((a - b) % (Math.PI * 2)));
            return Math.min(d, Math.PI * 2 - d);
        }
        cvs.addEventListener('mousemove', (e) => { pickAng = rel(e); });
        cvs.addEventListener('click', () => {
            if (ended) return;
            if (diffAng(pickAng, sweetspots[pin]) < tol) {
                pin++;
                api.sfx('latch');
                api.setDots(pins, Array.from({ length: pins }, (_, i) => i < pin ? 'done' : ''));
                if (pin >= pins) { ended = true; api.stopTimer(); setTimeout(() => api.succeed(), 250); }
            } else { api.shake(); /* light penalty: lose a sliver of time */ api.addTime(-1500); }
        });

        api.setTag('PICKING');
        api.startTimer(Math.max(10, 22 - diff * 2), () => { if (!ended) api.fail(); });

        function draw() {
            ctx.clearRect(0, 0, W, H);
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx, cy, R - 16, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = '#1a2230'; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.stroke();

            const prox = 1 - Math.min(1, diffAng(pickAng, sweetspots[pin]) / (Math.PI / 2));
            const close = diffAng(pickAng, sweetspots[pin]) < tol;
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(pickAng);
            ctx.strokeStyle = close ? suc : acc; ctx.lineWidth = 4; ctx.lineCap = 'round';
            ctx.shadowColor = close ? suc : acc; ctx.shadowBlur = close ? 16 : 6 * prox + 2;
            ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(R + 8, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(R + 8, 0); ctx.lineTo(R - 4, -7); ctx.lineTo(R - 4, 7); ctx.closePath();
            ctx.fillStyle = close ? suc : acc; ctx.fill();
            ctx.restore(); ctx.shadowBlur = 0;

            ctx.fillStyle = close ? suc : 'rgba(255,255,255,0.4)';
            ctx.font = '12px monospace'; ctx.textAlign = 'center';
            ctx.fillText(close ? 'CLICK NOW' : (prox > 0.7 ? 'warm…' : 'searching…'), cx, cy + R + 22);

            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- locksmith.js ---- */
MG.register('locksmith', {
    title: 'Locksmith',
    hint: 'Raise each pin to the shear line · SPACE to set',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const pinCount = 3 + Math.floor(diff / 1.3);
        const tol = Math.max(5, 12 - diff * 1.4);
        const W = 360, H = 260;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const shearY = 90;
        const pins = [];
        const pinW = (W - 80) / pinCount;
        for (let i = 0; i < pinCount; i++) {
            pins.push({ x: 40 + pinW * (i + 0.5), target: api.randInt(40, 150), h: 0, set: false });
        }
        let cur = 0, dir = 1, ended = false;
        api.setDots(pinCount);

        function attempt() {
            if (ended || cur >= pinCount) return;
            const p = pins[cur];
            if (Math.abs(p.h - p.target) < tol) {
                p.set = true; p.h = p.target; api.sfx('latch');
                api.setDots(pinCount, pins.map((x) => x.set ? 'done' : ''));
                cur++;
                if (cur >= pinCount) { finish(true); }
            } else { api.shake(); p.h = 0; }
        }
        function key(e) { if (e.code === 'Space') { e.preventDefault(); attempt(); } }
        document.addEventListener('keydown', key);
        cvs.addEventListener('click', attempt);

        api.setTag('PICKING');
        api.startTimer(Math.max(14, 26 - diff * 2), () => finish(false));
        function finish(ok) { if (ended) return; ended = true; document.removeEventListener('keydown', key); api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 250); }

        const riseSpeed = 1.6 + diff * 0.5;
        function draw() {
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            if (!ended && cur < pinCount) {
                const p = pins[cur];
                p.h += dir * riseSpeed;
                if (p.h > 170) { p.h = 170; dir = -1; }
                if (p.h < 0) { p.h = 0; dir = 1; }
            }
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
            ctx.beginPath(); ctx.moveTo(20, shearY); ctx.lineTo(W - 20, shearY); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = acc; ctx.font = '10px monospace'; ctx.textAlign = 'left';
            ctx.fillText('SHEAR LINE', 22, shearY - 6);

            pins.forEach((p, i) => {
                const baseY = H - 30;
                const isCur = i === cur && !ended;
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.fillRect(p.x - 12, shearY, 24, baseY - shearY);
                const topY = baseY - p.h;
                ctx.fillStyle = p.set ? suc : (isCur ? acc : 'rgba(255,255,255,0.25)');
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = isCur ? 12 : 0;
                ctx.fillRect(p.x - 9, topY, 18, baseY - topY);
                ctx.shadowBlur = 0;
                if (isCur) {
                    const tY = baseY - p.target;
                    ctx.strokeStyle = suc; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(p.x - 14, tY); ctx.lineTo(p.x + 14, tY); ctx.stroke();
                }
            });
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
            ctx.fillText('SPACE when the pin meets its mark', W / 2, H - 8);
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
});

MG.register('lugnuts', {
    title: 'Lug Nuts',
    hint: 'SPACE / click when the torque needle hits the green band',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 300, H = 300, cx = W / 2, cy = H / 2 - 10;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const N = 5;
        const order = [0, 2, 4, 1, 3]; // star torque pattern
        const nuts = [];
        for (let i = 0; i < N; i++) {
            const a = -Math.PI / 2 + i * (Math.PI * 2 / N);
            nuts.push({ x: cx + Math.cos(a) * 78, y: cy + Math.sin(a) * 78, set: false });
        }
        let step = 0, t = 0, done = false;
        const band = Math.max(0.12, 0.28 - diff * 0.03);
        const lo = 0.6, hi = lo + band;
        const spd = 0.012 + diff * 0.004;

        api.setDots(N);
        function update() { api.setDots(N, order.map((oi, k) => nuts[order[k]].set ? 'done' : (k === step ? 'active' : ''))); }
        update();

        function attempt() {
            if (done) return;
            const ni = order[step];
            if (t >= lo && t <= hi) {
                nuts[ni].set = true; api.sfx('latch'); step++; t = 0; update();
                if (step >= N) { done = true; api.stopTimer(); api.setTag('TORQUED'); setTimeout(() => api.succeed(), 300); }
            } else { api.shake(); api.addTime(-1500); t = 0; }
        }
        function key(e) { if (e.code === 'Space') { e.preventDefault(); attempt(); } }
        document.addEventListener('keydown', key);
        cvs.addEventListener('click', attempt);

        api.setTag('TORQUING');
        api.startTimer(Math.max(14, 26 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); document.removeEventListener('keydown', key); setTimeout(() => api.fail(), 200); } });

        function hexNut(x, y, r, col, glow) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 6);
            ctx.beginPath();
            for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; const px = Math.cos(a) * r, py = Math.sin(a) * r; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
            ctx.closePath();
            ctx.fillStyle = col; ctx.shadowColor = glow ? col : 'transparent'; ctx.shadowBlur = glow ? 10 : 0; ctx.fill();
            ctx.restore(); ctx.shadowBlur = 0;
        }

        function draw() {
            if (!done) { t += spd; if (t > 1) t = 0; }
            ctx.clearRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 16;
            ctx.beginPath(); ctx.arc(cx, cy, 78, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.beginPath(); ctx.arc(cx, cy, 58, 0, Math.PI * 2); ctx.fill();

            const activeNut = done ? -1 : order[step];
            nuts.forEach((n, i) => hexNut(n.x, n.y, 13, n.set ? suc : (i === activeNut ? acc : 'rgba(255,255,255,0.2)'), n.set || i === activeNut));

            const gx = 40, gy = H - 24, gw = W - 80, gh = 12;
            ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(gx, gy, gw, gh);
            ctx.fillStyle = 'rgba(57,217,138,0.3)'; ctx.fillRect(gx + gw * lo, gy, gw * (hi - lo), gh);
            const inB = t >= lo && t <= hi;
            ctx.fillStyle = inB ? suc : acc; ctx.fillRect(gx + gw * t - 2, gy - 3, 4, gh + 6);
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
            ctx.fillText('TORQUE  ·  nut ' + Math.min(step + 1, N) + '/' + N, cx, gy - 6);

            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
});
