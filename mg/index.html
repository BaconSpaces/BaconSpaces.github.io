<style>
/* BaconSpace's Minigames — shared stylesheet */

@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Azeret+Mono:wght@400;500;700&display=swap');

:root {
    --accent: #00e0b8;
    --danger: #ff3b5c;
    --success: #39d98a;
    --bg: #0a0e14;
    --panel: rgba(14, 19, 28, 0.92);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8edf2;
    --muted: #6b7686;
    --display: 'Chakra Petch', sans-serif;
    --mono: 'Azeret Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: var(--mono);
    color: var(--text);
    user-select: none;
}

.hidden { display: none !important; }

#root {
    position: fixed; inset: 0;
    display: grid; place-items: center;
}

#stage {
    position: relative; z-index: 1;
    width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        0 30px 80px rgba(0,0,0,0.6),
        0 0 60px -20px var(--accent);
    overflow: hidden;
    animation: panel-in 0.28s cubic-bezier(0.2, 0.9, 0.2, 1) both;
}

@keyframes panel-in {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
}

/* ---------------- HUD ---------------- */
#hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
}
#hud-title { display: flex; flex-direction: column; gap: 2px; }
#hud-tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase;
}
#hud-name {
    font-family: var(--display); font-weight: 700;
    font-size: 18px; letter-spacing: 0.5px;
}
#hud-timer { display: flex; align-items: center; gap: 10px; }
#timer-bar {
    width: 120px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.08); overflow: hidden;
}
#timer-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--accent), #fff);
    transition: width 0.1s linear;
}
#timer-text {
    font-variant-numeric: tabular-nums;
    font-size: 13px; color: var(--muted); min-width: 34px; text-align: right;
}

/* ---------------- Board ---------------- */
#board {
    position: relative;
    min-height: 320px;
    padding: 26px;
    display: flex; align-items: center; justify-content: center;
}
#board canvas { display: block; }

/* ---------------- Footer ---------------- */
#footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    min-height: 44px;
}
#dots { display: flex; gap: 7px; }
.dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,0.14);
    transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
}
.dot.done { background: var(--success); box-shadow: 0 0 10px var(--success); }
.dot.fail { background: var(--danger);  box-shadow: 0 0 10px var(--danger); }
.dot.active { background: var(--accent); transform: scale(1.3); }
#hint {
    font-size: 11px; letter-spacing: 1px; color: var(--muted);
    text-transform: uppercase;
}

/* ---------------- Flash overlay ---------------- */
#flash {
    position: fixed; inset: 0; z-index: 5;
    display: grid; place-items: center;
    pointer-events: none;
    background: transparent;
}
#flash-text {
    font-family: var(--display); font-weight: 700;
    font-size: 48px; letter-spacing: 6px; text-transform: uppercase;
    padding: 14px 36px; border-radius: 12px;
    background: rgba(10, 14, 20, 0.82);
    animation: flash-pop 0.4s cubic-bezier(0.2,0.9,0.2,1) both;
}
#flash.win  #flash-text { color: var(--success); text-shadow: 0 0 30px var(--success); }
#flash.lose #flash-text { color: var(--danger);  text-shadow: 0 0 30px var(--danger); }
@keyframes flash-pop {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
}

/* ---------------- Reusable bits for games ---------------- */
.btn {
    font-family: var(--display); font-weight: 600;
    letter-spacing: 1px; font-size: 14px;
    padding: 12px 20px; border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.04);
    color: var(--text); cursor: pointer;
    transition: all 0.15s;
}
.btn:hover { border-color: var(--accent); background: rgba(0,224,184,0.08); }
.btn.danger:hover { border-color: var(--danger); background: rgba(255,59,92,0.08); }

.label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
}

.shake { animation: shake 0.3s; }
@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
}

.glow-accent  { color: var(--accent); }
.glow-success { color: var(--success); }
.glow-danger  { color: var(--danger); }


/* Site-level layout: login gate, lobby, leaderboard.
   Loaded after engine.css, which owns the in-game board look. */

html, body {
    overflow-y: auto;
    background: var(--bg);
}

body {
    min-height: 100vh;
    background:
        radial-gradient(1200px 600px at 50% -10%, rgba(0,224,184,0.08), transparent),
        var(--bg);
}

.hidden { display: none !important; }

/* ---------------- Top bar ---------------- */
#topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
}
#brand {
    font-family: var(--display); font-weight: 700;
    font-size: 20px; letter-spacing: 1px;
}
#brand span { color: var(--accent); }
#user-box {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: var(--muted);
}
#user-box strong { color: var(--text); }

/* ---------------- Login gate ---------------- */
#login-gate {
    min-height: 80vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center; padding: 24px;
}
#login-gate h1 {
    font-family: var(--display); font-size: 30px; letter-spacing: 1px;
}
#login-gate p { color: var(--muted); max-width: 420px; font-size: 13px; line-height: 1.6; }

.discord-btn {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 0.5px;
    padding: 14px 26px; border-radius: 10px;
    border: 1px solid var(--line);
    background: #5865F2; color: #fff; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
}
.discord-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(88,101,242,0.4); }

/* ---------------- Lobby ---------------- */
#lobby { padding: 26px 28px 60px; max-width: 1200px; margin: 0 auto; }
#lobby h2 {
    font-family: var(--display); font-size: 15px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted);
    margin: 26px 0 12px;
}
#lobby h2:first-child { margin-top: 0; }

.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}
.game-card {
    text-align: left;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--mono);
}
.game-card:hover { border-color: var(--accent); background: rgba(0,224,184,0.06); transform: translateY(-2px); }
.game-card .g-title {
    font-family: var(--display); font-weight: 700; font-size: 14px; margin-bottom: 4px;
}
.game-card .g-hint { font-size: 11px; color: var(--muted); line-height: 1.4; }

/* ---------------- Leaderboard ---------------- */
#leaderboard {
    max-width: 1200px; margin: 40px auto 0; padding: 0 28px 60px;
}
#leaderboard h2 {
    font-family: var(--display); font-size: 15px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
}
table.lb { width: 100%; border-collapse: collapse; font-size: 13px; }
table.lb th, table.lb td {
    text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line);
}
table.lb th { color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
table.lb tr:hover td { background: rgba(255,255,255,0.03); }
.rank-1 { color: #ffd257; }
.rank-2 { color: #cfd6e0; }
.rank-3 { color: #d7935a; }

/* ---------------- Difficulty picker (shown before launching a game) ---------------- */
#diff-picker {
    position: fixed; inset: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6,8,12,0.7);
}
#diff-picker .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 26px; width: 320px; text-align: center;
}
#diff-picker .panel h3 { font-family: var(--display); margin-bottom: 4px; }
#diff-picker .panel p { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
#diff-picker .diffs { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
#diff-picker .diffs button {
    width: 40px; height: 40px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.04);
    color: var(--text); font-family: var(--display); cursor: pointer;
}
#diff-picker .diffs button.selected,
#diff-picker .diffs button:hover { border-color: var(--accent); background: rgba(0,224,184,0.12); }

</style>
</head>

<script>
/* ============================================================
   DISCORD LOGIN (implicit OAuth grant, name only, no backend)
   ============================================================ */
// Discord login — implicit OAuth2 grant.
// This is the one Discord flow that works from a pure static site:
// no client secret, no backend. It hands back an access token in the
// URL fragment, which we use exactly once, to read the user's
// display name via GET /users/@me, then discard.
//
// We deliberately request nothing but "identify" — no email, no
// guilds, no avatar changes — and we only ever read the name.

const DiscordAuth = (function () {
    const STORAGE_KEY = 'mg_discord_user';

    function buildAuthorizeUrl() {
        const p = new URLSearchParams({
            client_id: APP_CONFIG.discord.clientId,
            redirect_uri: APP_CONFIG.discord.redirectUri,
            response_type: 'token',
            scope: APP_CONFIG.discord.scope
        });
        return `https://discord.com/api/oauth2/authorize?${p.toString()}`;
    }

    function login() {
        console.log('[DiscordAuth] redirecting to Discord authorize screen');
        window.location.href = buildAuthorizeUrl();
    }

    function logout() {
        console.log('[DiscordAuth] logging out');
        sessionStorage.removeItem(STORAGE_KEY);
    }

    function getStoredUser() {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
    }

    // Called on every page load. If the URL has a fresh token
    // fragment from Discord, resolve it to a display name once.
    async function resolveFromRedirect() {
        const existing = getStoredUser();
        if (existing) return existing;

        const hash = window.location.hash;
        if (!hash || !hash.includes('access_token')) return null;

        const params = new URLSearchParams(hash.slice(1));
        const token = params.get('access_token');
        if (!token) return null;

        console.log('[DiscordAuth] received access token, fetching profile');
        history.replaceState(null, '', window.location.pathname + window.location.search);

        try {
            const res = await fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (!res.ok) throw new Error(`Discord API ${res.status}`);
            const profile = await res.json();
            const name = profile.global_name || profile.username;
            const user = { name };
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify(user));
            console.log('[DiscordAuth] logged in as', name);
            return user;
        } catch (err) {
            console.error('[DiscordAuth] failed to resolve profile', err);
            return null;
        }
    }

    return { login, logout, getStoredUser, resolveFromRedirect };
})();

</script>

<script>
/* ============================================================
   LEADERBOARD (saved to a local .json file via browser-fs-access)
   ============================================================ */
// Leaderboard — committed directly into this GitHub repo as a JSON
// Leaderboard — saved as a real .json file on this computer, via the
// browser's File System Access API (through the browser-fs-access
// library, loaded as an ES module below). The first save needs one
// click to pick/permit the file (browsers require that — no page can
// touch your filesystem silently); after that, saves happen without
// prompting again for the rest of the session.

const Leaderboard = (function () {
    let cache = { scores: {} };
    let fileHandle = null; // set once the user connects a file; reused for subsequent saves

    function init() {
        console.log('[Leaderboard] using local file storage (browser-fs-access) — click "Connect Save File" to begin');
    }

    function isConnected() { return !!fileHandle; }

    // Opens the picker so the user selects (or creates) leaderboard.json.
    // Must be called from a user gesture (e.g. a button click) — browsers
    // block file pickers triggered without direct user interaction.
    async function connect() {
        const { fileOpen } = window.browserFsAccess;
        try {
            const file = await fileOpen({
                mimeTypes: ['application/json'],
                extensions: ['.json'],
                description: 'Leaderboard JSON file'
            });
            fileHandle = file.handle || null;
            const text = await file.text();
            try { const parsed = JSON.parse(text); cache = parsed && parsed.scores ? parsed : { scores: {} }; }
            catch (e) { cache = { scores: {} }; }
            console.log('[Leaderboard] connected to local file:', file.name);
            return true;
        } catch (err) {
            console.log('[Leaderboard] file connect cancelled or failed', err);
            return false;
        }
    }

    async function saveToFile() {
        const { fileSave } = window.browserFsAccess;
        const blob = new Blob([JSON.stringify(cache, null, 2)], { type: 'application/json' });
        fileHandle = await fileSave(
            blob,
            { fileName: APP_CONFIG.localFile.fileName, extensions: ['.json'] },
            fileHandle // reusing the handle skips the picker on repeat saves, where supported
        );
    }

    // One win = one point. Tracked per Discord display name.
    async function recordResult(name, gameId, success, elapsedMs) {
        console.log('[Leaderboard] recording result', { name, gameId, success, elapsedMs });
        if (!isConnected()) { console.warn('[Leaderboard] no file connected yet — result not saved'); return; }
        const entry = cache.scores[name] || { name, wins: 0, plays: 0, bestMs: null };
        entry.plays += 1;
        if (success) {
            entry.wins += 1;
            entry.bestMs = (entry.bestMs === null || elapsedMs < entry.bestMs) ? elapsedMs : entry.bestMs;
        }
        entry.lastGame = gameId;
        entry.updatedAt = Date.now();
        cache.scores[name] = entry;
        try { await saveToFile(); }
        catch (err) { console.error('[Leaderboard] failed to save local file', err); }
    }

    async function top(limit = 10) {
        return Object.values(cache.scores)
            .sort((a, b) => b.wins - a.wins)
            .slice(0, limit);
    }

    async function clear() {
        cache = { scores: {} };
        try { await saveToFile(); console.log('[Leaderboard] local file cleared'); }
        catch (err) { console.error('[Leaderboard] failed to clear local file', err); }
    }

    return { init, recordResult, top, clear, connect, isConnected };
})();

</script>

<script>
/* ============================================================
   SFX
   ============================================================ */
const SFX = (function () {
    let ctx = null;
    let enabled = true;
    let master = 0.5;

    function ac() {
        if (!ctx) {
            try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            catch (e) { enabled = false; }
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return ctx;
    }

    function tone(freq, dur, type, vol, slideTo, delay) {
        if (!enabled) return;
        const a = ac(); if (!a) return;
        const t0 = a.currentTime + (delay || 0);
        const osc = a.createOscillator();
        const gain = a.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
        const v = (vol == null ? 0.3 : vol) * master;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(v, t0 + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain); gain.connect(a.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.02);
    }

    function noise(dur, vol, filterFreq) {
        if (!enabled) return;
        const a = ac(); if (!a) return;
        const t0 = a.currentTime;
        const len = Math.floor(a.sampleRate * dur);
        const buf = a.createBuffer(1, len, a.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = a.createBufferSource(); src.buffer = buf;
        const filt = a.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = filterFreq || 1200;
        const gain = a.createGain(); gain.gain.value = (vol == null ? 0.2 : vol) * master;
        src.connect(filt); filt.connect(gain); gain.connect(a.destination);
        src.start(t0);
    }

    const lib = {
        click:   () => tone(520, 0.05, 'square', 0.16),
        tick:    () => tone(880, 0.03, 'square', 0.10),
        select:  () => tone(660, 0.06, 'triangle', 0.18),
        step:    () => { tone(700, 0.07, 'sine', 0.2); },
        good:    () => { tone(740, 0.08, 'sine', 0.22); tone(990, 0.1, 'sine', 0.18, null, 0.06); },
        bad:     () => { tone(200, 0.18, 'sawtooth', 0.22, 90); },
        error:   () => { tone(160, 0.12, 'square', 0.2, 110); },
        success: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.22, null, i * 0.08)); },
        fail:    () => { [330, 247, 165].forEach((f, i) => tone(f, 0.22, 'sawtooth', 0.22, null, i * 0.1)); },
        charge:  () => tone(300, 0.25, 'sine', 0.2, 700),
        zap:     () => { noise(0.12, 0.18, 2200); tone(900, 0.08, 'square', 0.12, 300); },
        beep:    () => tone(1040, 0.05, 'sine', 0.14),
        latch:   () => { tone(420, 0.05, 'square', 0.2); tone(620, 0.06, 'square', 0.16, null, 0.04); },
        whoosh:  () => noise(0.2, 0.14, 800),
        heartbeat: () => { tone(70, 0.12, 'sine', 0.3); tone(60, 0.1, 'sine', 0.24, null, 0.16); }
    };

    function play(name) {
        if (!enabled) return;
        const fn = lib[name];
        if (fn) try { fn(); } catch (e) {}
    }

    return {
        play,
        setEnabled: (v) => { enabled = !!v; },
        setVolume:  (v) => { master = Math.max(0, Math.min(1, v)); },
        isEnabled:  () => enabled,
        _lib: lib
    };
})();

if (typeof window !== 'undefined') window.SFX = SFX;

</script>

<script>
/* ============================================================
   ENGINE — logs a console line at every checkpoint each game hits
   ============================================================ */
// BaconSpace's Minigames — standalone browser engine
// Adapted from the FiveM NUI engine: no Lua bridge, instead reports
// results straight to app.js, and logs a console line at every
// checkpoint ("stand point") each game passes through.
const MG = (function () {
    const games = {};
    let current = null;
    let raf = null;
    let timer = null;
    let ended = false;
    let activeGameId = null;
    let onResultCallback = null; // set by app.js: (gameId, success, elapsedMs) => {}

    const $ = (id) => document.getElementById(id);

    function log(point, detail) {
        const tag = `[MG:${activeGameId || '—'}]`;
        if (detail !== undefined) console.log(`${tag} ${point}`, detail);
        else console.log(`${tag} ${point}`);
    }

    /* ---- Timer ---- */
    function startTimer(seconds, onExpire) {
        log('checkpoint:timer-start', { seconds });
        timer = { duration: seconds * 1000, start: performance.now(), onExpire };
        tick();
    }
    function tick() {
        if (!timer) return;
        const elapsed = performance.now() - timer.start;
        const remain = Math.max(0, timer.duration - elapsed);
        const pct = remain / timer.duration;
        $('timer-fill').style.width = (pct * 100) + '%';
        $('timer-text').textContent = (remain / 1000).toFixed(1);
        $('timer-fill').style.background = pct < 0.25
            ? 'linear-gradient(90deg, var(--danger), #fff)'
            : 'linear-gradient(90deg, var(--accent), #fff)';
        if (remain <= 0) {
            log('checkpoint:timer-expired');
            const fn = timer.onExpire; timer = null;
            if (fn) fn();
            return;
        }
        raf = requestAnimationFrame(tick);
    }
    function stopTimer() {
        if (raf) cancelAnimationFrame(raf);
        raf = null; timer = null;
    }
    function addTime(ms) {
        if (timer) { timer.start += ms; log('checkpoint:time-added', { ms }); }
    }

    /* ---- Round dots ---- */
    function setDots(total, states) {
        log('checkpoint:dots', { total, states });
        const c = $('dots'); c.innerHTML = '';
        for (let i = 0; i < total; i++) {
            const d = document.createElement('div');
            d.className = 'dot' + (states && states[i] ? ' ' + states[i] : '');
            c.appendChild(d);
        }
    }

    /* ---- Lifecycle ---- */
    let startedAt = 0;
    function open(payload) {
        ended = false;
        activeGameId = payload.game;
        startedAt = performance.now();
        log('checkpoint:open', { difficulty: payload.difficulty });

        const game = games[payload.game];
        $('root').classList.remove('hidden');
        $('flash').className = 'hidden';

        const name = game ? game.title : payload.game;
        $('hud-name').textContent = name;
        $('hud-tag').textContent = 'SECURE TASK';
        $('hint').textContent = (game && game.hint) ? game.hint : '';
        $('board').innerHTML = '';
        setDots(0);

        if (!game) { log('checkpoint:unknown-game'); return end(false); }

        const api = {
            board: $('board'),
            cfg: payload,
            startTimer, stopTimer, addTime, setDots,
            setHint: (t) => { log('checkpoint:hint', t); $('hint').textContent = t || ''; },
            setTag:  (t) => { log('checkpoint:tag', t); $('hud-tag').textContent = t || ''; },
            succeed: () => { log('checkpoint:succeed-called'); end(true); },
            fail:    () => { log('checkpoint:fail-called'); end(false); },
            shake:   () => { log('checkpoint:shake');
                             $('stage').classList.add('shake');
                             if (typeof SFX !== 'undefined') SFX.play('bad');
                             setTimeout(() => $('stage').classList.remove('shake'), 320); },
            sfx:     (name) => { log('checkpoint:sfx', name); if (typeof SFX !== 'undefined') SFX.play(name); },
            rand: (a, b) => a + Math.random() * (b - a),
            randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1))
        };

        current = game.run(api) || {};
        log('checkpoint:running');
    }

    function cleanup() {
        stopTimer();
        if (current && typeof current.destroy === 'function') {
            try { current.destroy(); } catch (e) {}
        }
        current = null;
        document.onkeydown = null;
    }

    function end(success) {
        if (ended) return;
        ended = true;
        const elapsedMs = Math.round(performance.now() - startedAt);
        cleanup();
        log('checkpoint:end', { success, elapsedMs });
        if (typeof SFX !== 'undefined') SFX.play(success ? 'success' : 'fail');

        const flash = $('flash');
        flash.className = success ? 'win' : 'lose';
        $('flash-text').textContent = success ? 'Success' : 'Failed';

        setTimeout(() => {
            $('root').classList.add('hidden');
            flash.className = 'hidden';
            $('board').innerHTML = '';
            log('checkpoint:reported', { success, elapsedMs });
            if (typeof onResultCallback === 'function') {
                onResultCallback(activeGameId, success, elapsedMs);
            }
            activeGameId = null;
        }, 850);
    }

    /* ---- Global cancel key ---- */
    document.addEventListener('keydown', (e) => {
        if (ended || !current) return;
        if (e.key === 'Escape') {
            const allow = current.__allowCancel !== false;
            if (allow) { log('checkpoint:cancelled'); end(false); }
        }
    });

    return {
        games,
        register(id, def) { games[id] = def; log('registered', id); },
        open,
        onResult(cb) { onResultCallback = cb; },
        _internal: { end }
    };
})();

</script>

<script>
/* ============================================================
   ALL 70 MINIGAMES — each registers itself with MG.register(...)
   ============================================================ */
/* ---- animus.js ---- */
MG.register('animus', {
    title: 'Animus',
    hint: 'Click a ring to rotate · align all key segments to the line',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const ringCount = 2 + Math.floor(diff / 1.3);
        const segs = 6 + (diff >= 3 ? 2 : 0);
        const W = 320, H = 320, cx = W / 2, cy = H / 2;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const guideSeg = 0;
        const rings = [];
        for (let i = 0; i < ringCount; i++) {
            rings.push({
                rIn: 40 + i * 32,
                rOut: 40 + i * 32 + 26,
                key: api.randInt(0, segs - 1),
                offset: api.randInt(1, segs - 1)
            });
        }

        let solved = false;
        function rel(e) {
            const b = cvs.getBoundingClientRect();
            const x = (e.clientX - b.left) * (cvs.width / b.width) - cx;
            const y = (e.clientY - b.top) * (cvs.height / b.height) - cy;
            return Math.hypot(x, y);
        }
        cvs.addEventListener('click', (e) => {
            if (solved) return;
            const dist = rel(e);
            const ring = rings.find((r) => dist >= r.rIn - 6 && dist <= r.rOut + 6);
            if (!ring) return;
            ring.offset = (ring.offset + 1) % segs;
            checkSolved();
        });
        function checkSolved() {
            const ok = rings.every((r) => (r.key + r.offset) % segs === guideSeg);
            if (ok) {
                solved = true; api.stopTimer(); api.setTag('SYNCHRONIZED');
                setTimeout(() => api.succeed(), 450);
            }
        }

        api.setTag('DESYNCED');
        api.startTimer(Math.max(16, 34 - diff * 2), () => { if (!solved) api.fail(); });

        function draw() {
            ctx.clearRect(0, 0, W, H);
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            const segAng = (Math.PI * 2) / segs;
            const guideAngle = -Math.PI / 2;

            ctx.strokeStyle = solved ? suc : acc; ctx.lineWidth = 2;
            ctx.shadowColor = solved ? suc : acc; ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(guideAngle) * 30, cy + Math.sin(guideAngle) * 30);
            ctx.lineTo(cx + Math.cos(guideAngle) * (rings[ringCount - 1].rOut + 14),
                       cy + Math.sin(guideAngle) * (rings[ringCount - 1].rOut + 14));
            ctx.stroke(); ctx.shadowBlur = 0;

            rings.forEach((ring) => {
                for (let s = 0; s < segs; s++) {
                    const isKey = (s === (ring.key + ring.offset) % segs);
                    const a0 = guideAngle - segAng / 2 + s * segAng;
                    const a1 = a0 + segAng * 0.86;
                    const aligned = isKey && (((ring.key + ring.offset) % segs) === guideSeg);
                    ctx.beginPath();
                    ctx.arc(cx, cy, ring.rOut, a0, a1);
                    ctx.arc(cx, cy, ring.rIn, a1, a0, true);
                    ctx.closePath();
                    if (isKey) {
                        ctx.fillStyle = aligned ? suc : acc;
                        ctx.shadowColor = aligned ? suc : acc; ctx.shadowBlur = 14;
                    } else {
                        ctx.fillStyle = 'rgba(255,255,255,0.07)';
                        ctx.shadowBlur = 0;
                    }
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();
                }
            });
            ctx.fillStyle = solved ? suc : '#1a2230';
            ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.stroke();

            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

MG.register('archery', {
    title: 'Longshot',
    hint: 'Drag from the bow toward the target · longer drag = more power · release',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 460, H = 300;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'crosshair';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const bow = { x: 56, y: H - 60 };
        const g = 0.4, k = 0.17, maxPull = 150;
        const rounds = 2 + Math.floor(diff / 2);
        const tgR = Math.max(17, 32 - diff * 3);
        const aidLen = diff <= 2 ? 90 : diff <= 4 ? 46 : 24;
        const wind = diff >= 4 ? (Math.random() < 0.5 ? -1 : 1) * (0.015 + diff * 0.006) : 0;
        let round = 0, aiming = false, aim = { x: 0, y: 0 }, arrow = null, done = false;

        api.setDots(rounds);
        function newTarget() { return { x: 280 + Math.random() * (W - 320), y: 55 + Math.random() * (H - 150) }; }
        let target = newTarget();

        function rel(e) { const b = cvs.getBoundingClientRect(); return { x: (e.clientX - b.left) * (W / b.width), y: (e.clientY - b.top) * (H / b.height) }; }
        function setAim(r) { aim = { x: r.x - bow.x, y: r.y - bow.y }; const m = Math.hypot(aim.x, aim.y); if (m > maxPull) { aim.x *= maxPull / m; aim.y *= maxPull / m; } }
        cvs.addEventListener('mousedown', (e) => { if (done || arrow) return; aiming = true; setAim(rel(e)); });
        cvs.addEventListener('mousemove', (e) => { if (aiming) setAim(rel(e)); });
        function loose() { if (!aiming) return; aiming = false; if (Math.hypot(aim.x, aim.y) < 14) return; arrow = { x: bow.x, y: bow.y, vx: aim.x * k, vy: aim.y * k }; api.sfx('whoosh'); }
        cvs.addEventListener('mouseup', loose);
        cvs.addEventListener('mouseleave', () => { aiming = false; });

        api.setTag('AIM');
        api.startTimer(Math.max(22, 38 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); } });

        function draw() {
            if (arrow && !done) {
                arrow.vy += g; arrow.vx += wind; arrow.x += arrow.vx; arrow.y += arrow.vy;
                if (Math.hypot(arrow.x - target.x, arrow.y - target.y) < tgR) {
                    round++; api.sfx('good'); api.setDots(rounds, Array.from({ length: rounds }, (_, i) => i < round ? 'done' : ''));
                    if (round >= rounds) { done = true; api.stopTimer(); api.setTag('BULLSEYE'); setTimeout(() => api.succeed(), 300); return; }
                    target = newTarget(); arrow = null;
                } else if (arrow.y > H - 14 || arrow.x > W + 20 || arrow.x < -20 || arrow.y < -60) { arrow = null; api.sfx('bad'); }
            }
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(0, H - 12, W, 12);

            ctx.strokeStyle = suc; ctx.lineWidth = 2; ctx.shadowColor = suc; ctx.shadowBlur = 10;
            ctx.beginPath(); ctx.arc(target.x, target.y, tgR, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(target.x, target.y, tgR * 0.55, 0, Math.PI * 2); ctx.stroke(); ctx.shadowBlur = 0;
            ctx.fillStyle = suc; ctx.beginPath(); ctx.arc(target.x, target.y, 3, 0, Math.PI * 2); ctx.fill();

            if (aiming && Math.hypot(aim.x, aim.y) >= 14) {
                let sx = bow.x, sy = bow.y, vx = aim.x * k, vy = aim.y * k;
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                for (let i = 0; i < aidLen; i++) {
                    vy += g; vx += wind; sx += vx; sy += vy;
                    if (sy > H - 12 || sx > W + 10 || sx < -10) break;
                    if (i % 3 === 0) { ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI * 2); ctx.fill(); }
                }
            }

            ctx.strokeStyle = acc; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(bow.x, bow.y, 14, -Math.PI / 2.1, Math.PI / 2.1); ctx.stroke();
            if (aiming) {
                const ex = bow.x + aim.x, ey = bow.y + aim.y, ang = Math.atan2(aim.y, aim.x);
                ctx.strokeStyle = 'rgba(0,224,184,0.7)'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(bow.x, bow.y); ctx.lineTo(ex, ey); ctx.stroke();
                ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
                ctx.fillStyle = acc; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-2, -5); ctx.lineTo(-2, 5); ctx.closePath(); ctx.fill();
                ctx.restore();
            }

            if (arrow) {
                const a = Math.atan2(arrow.vy, arrow.vx);
                ctx.save(); ctx.translate(arrow.x, arrow.y); ctx.rotate(a);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(8, 0); ctx.stroke();
                ctx.fillStyle = acc; ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(2, -3); ctx.lineTo(2, 3); ctx.closePath(); ctx.fill();
                ctx.restore();
            }
            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});


/* ---- beltsort.js ---- */
MG.register('beltsort', {
    title: 'Quality Control',
    hint: 'Click the cracked (red) parts before they leave the belt · let good ones pass',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 440, H = 280;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const need = 5 + diff;
        const maxWrong = Math.max(2, 5 - diff);
        const speed = 1.1 + diff * 0.4;
        const spawnGap = Math.max(34, 72 - diff * 8);
        const beltY = H / 2, R = 16;
        let parts = [], caught = 0, wrong = 0, frame = 0, done = false, dash = 0;

        api.setDots(maxWrong);
        function strike() { wrong++; api.setDots(maxWrong, Array.from({ length: maxWrong }, (_, i) => i < wrong ? 'fail' : '')); if (wrong >= maxWrong) finish(false); }
        function finish(ok) { if (done) return; done = true; api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 250); }

        cvs.addEventListener('click', (e) => {
            if (done) return;
            const b = cvs.getBoundingClientRect();
            const x = (e.clientX - b.left) * (W / b.width), y = (e.clientY - b.top) * (H / b.height);
            for (let i = parts.length - 1; i >= 0; i--) {
                const p = parts[i];
                if (!p.gone && Math.hypot(x - p.x, y - beltY) < R + 4) {
                    p.gone = true;
                    if (p.def) { caught++; api.sfx('zap'); api.setTag(caught + '/' + need); if (caught >= need) finish(true); }
                    else { api.shake(); strike(); }
                    return;
                }
            }
        });

        api.setTag('0/' + need);
        api.startTimer(Math.max(20, 34 - diff * 2), () => finish(caught >= need));

        function gear(x, y, r, col, def) {
            ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
            ctx.shadowColor = col; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.stroke();
            for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.62, y + Math.sin(a) * r * 0.62); ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); ctx.stroke(); }
            ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.arc(x, y, r * 0.2, 0, Math.PI * 2); ctx.stroke();
            if (def) { ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x - r * 0.4, y - r * 0.3); ctx.lineTo(x + r * 0.05, y + r * 0.1); ctx.lineTo(x - r * 0.15, y + r * 0.35); ctx.stroke(); }
        }

        function draw() {
            frame++;
            if (!done && frame % spawnGap === 0) parts.push({ x: -R, def: Math.random() < 0.5, gone: false });
            if (!done) dash = (dash + speed) % 28;
            ctx.clearRect(0, 0, W, H);

            // belt
            ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(0, beltY - R - 10, W, (R + 10) * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, beltY - R - 10); ctx.lineTo(W, beltY - R - 10); ctx.moveTo(0, beltY + R + 10); ctx.lineTo(W, beltY + R + 10); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2;
            for (let x = -28 + dash; x < W; x += 28) { ctx.beginPath(); ctx.moveTo(x, beltY + R + 10); ctx.lineTo(x + 14, beltY + R + 10); ctx.stroke(); }

            parts.forEach(p => {
                if (p.gone) return;
                if (!done) p.x += speed;
                if (p.x > W + R) { p.gone = true; if (p.def) strike(); return; }
                gear(p.x, beltY, R, p.def ? dng : acc, p.def);
            });
            parts = parts.filter(p => !p.gone);

            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
            ctx.fillText('PULL THE CRACKED PARTS · ' + caught + ' / ' + need, W / 2, 22);
            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

MG.register('bluff', {
    title: 'Bluff',
    hint: 'Read the tell · CALL a bluff, FOLD on truth',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const hands = api.cfg.hands || 3;
        const readTime = Math.max(2.2, 5 - diff * 0.5);

        const tells = [
            { face: '😬', text: 'forced grin, eyes flick away', bluff: true },
            { face: '😐', text: 'flat, steady gaze', bluff: false },
            { face: '😅', text: 'beads of sweat, quick swallow', bluff: true },
            { face: '🙂', text: 'relaxed jaw, slow blink', bluff: false },
            { face: '😶', text: 'frozen still — too still', bluff: true },
            { face: '😏', text: 'calm smirk, even breathing', bluff: false }
        ];

        let hand = 0, correct = 0, current = null, timeout = null;
        api.setDots(hands);

        const box = document.createElement('div');
        box.style.cssText = 'width:420px;display:flex;flex-direction:column;align-items:center;gap:18px;';
        box.innerHTML = `
            <div id="face" style="font-size:84px;line-height:1;filter:drop-shadow(0 0 20px var(--accent));"></div>
            <div id="tell" style="font-family:var(--display);font-size:15px;color:var(--muted);min-height:22px;"></div>
            <div id="meter" style="width:100%;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;">
                <div id="mfill" style="height:100%;width:50%;background:var(--accent);transition:width .1s;"></div>
            </div>
            <div style="display:flex;gap:14px;margin-top:6px;">
                <button class="btn danger" id="call">CALL BLUFF</button>
                <button class="btn" id="fold">FOLD</button>
            </div>`;
        api.board.appendChild(box);
        const faceEl = box.querySelector('#face');
        const tellEl = box.querySelector('#tell');
        const mfill  = box.querySelector('#mfill');

        function nextHand() {
            if (hand >= hands) { finish(); return; }
            current = tells[api.randInt(0, tells.length - 1)];
            faceEl.textContent = current.face;
            tellEl.textContent = current.text;
            api.setTag('HAND ' + (hand + 1) + '/' + hands);
            let p = 0.5;
            clearInterval(box._wob);
            box._wob = setInterval(() => {
                p += (Math.random() - 0.5) * (0.1 + diff * 0.04);
                p = Math.max(0.05, Math.min(0.95, p));
                mfill.style.width = (p * 100) + '%';
            }, 80);
            clearTimeout(timeout);
            timeout = setTimeout(() => decide(null), readTime * 1000);
        }

        function decide(choice) {
            clearTimeout(timeout);
            clearInterval(box._wob);
            if (!current) return;
            const right = (choice === 'call' && current.bluff) ||
                          (choice === 'fold' && !current.bluff);
            if (right) correct++;
            const st = [];
            for (let i = 0; i < hands; i++) {
                st[i] = i < hand ? (i < correct ? 'done' : 'fail') : (i === hand ? 'active' : '');
            }
            if (!right) api.shake();
            hand++;
            redrawDots();
            setTimeout(nextHand, 350);
        }

        function redrawDots() {
            const st = [];
            let c = correct, wrong = hand - correct, ci = 0;
            for (let i = 0; i < hands; i++) {
                if (i < hand) { st[i] = (i < correct) ? 'done' : 'fail'; }
                else st[i] = (i === hand) ? 'active' : '';
            }
            api.setDots(hands, st);
        }

        function finish() {
            const pass = correct >= Math.ceil(hands / 2 + (diff >= 4 ? 0.5 : 0));
            api.stopTimer();
            setTimeout(() => pass ? api.succeed() : api.fail(), 200);
        }

        box.querySelector('#call').onclick = () => decide('call');
        box.querySelector('#fold').onclick = () => decide('fold');

        api.startTimer(readTime * hands + 2, () => { /* overall guard */ finish(); });
        nextHand();

        return { destroy() { clearTimeout(timeout); clearInterval(box._wob); } };
    }
});

MG.register('bonepin', {
    title: 'Bone Set',
    hint: 'Drag each fragment onto its matching slot',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 400, H = 280;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'grab';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();

        const N = 2 + Math.floor(diff / 1.5); // 2..5
        const tol = Math.max(12, 30 - diff * 3);
        const slotY = H / 2 - 22;
        const pieces = [];
        for (let i = 0; i < N; i++) {
            const sx = 70 + (W - 140) * ((i + 0.5) / N);
            pieces.push({ sx, sy: slotY, x: 60 + Math.random() * (W - 120), y: H - 58 + Math.random() * 28, w: (W - 140) / N - 8, rot: api.rand(-0.3, 0.3), placed: false });
        }
        let drag = null, off = { x: 0, y: 0 }, placedN = 0, done = false;

        api.setDots(N);
        function rel(e) { const b = cvs.getBoundingClientRect(); return { x: (e.clientX - b.left) * (W / b.width), y: (e.clientY - b.top) * (H / b.height) }; }
        function at(cx, cy) { for (let i = pieces.length - 1; i >= 0; i--) { const p = pieces[i]; if (!p.placed && Math.abs(cx - p.x) < p.w / 2 + 6 && Math.abs(cy - p.y) < 16) return p; } return null; }

        cvs.addEventListener('mousedown', (e) => { const r = rel(e); const p = at(r.x, r.y); if (p) { drag = p; off.x = r.x - p.x; off.y = r.y - p.y; cvs.style.cursor = 'grabbing'; } });
        cvs.addEventListener('mousemove', (e) => { if (!drag) return; const r = rel(e); drag.x = r.x - off.x; drag.y = r.y - off.y; });
        function dropPiece() {
            if (!drag) return; const p = drag; drag = null; cvs.style.cursor = 'grab';
            if (Math.hypot(p.x - p.sx, p.y - p.sy) < tol) {
                p.placed = true; p.x = p.sx; p.y = p.sy; p.rot = 0; placedN++; api.sfx('latch');
                api.setDots(N, pieces.map(pp => pp.placed ? 'done' : ''));
                if (placedN >= N) { done = true; api.stopTimer(); api.setTag('SET'); setTimeout(() => api.succeed(), 300); }
            } else api.sfx('tick');
        }
        cvs.addEventListener('mouseup', dropPiece);
        cvs.addEventListener('mouseleave', dropPiece);

        api.setTag('ALIGNING');
        api.startTimer(Math.max(16, 30 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); } });

        function frag(x, y, w, rot, col, alpha) {
            ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.translate(x, y); ctx.rotate(rot);
            const hw = w / 2;
            ctx.fillStyle = col; ctx.beginPath();
            ctx.moveTo(-hw, -8); ctx.lineTo(hw, -8); ctx.arc(hw, 0, 8, -Math.PI / 2, Math.PI / 2); ctx.lineTo(-hw, 8); ctx.arc(-hw, 0, 8, Math.PI / 2, -Math.PI / 2); ctx.closePath(); ctx.fill();
            ctx.restore(); ctx.globalAlpha = 1;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            pieces.forEach(p => { if (!p.placed) { frag(p.sx, p.sy, p.w, 0, 'rgba(255,255,255,0.5)', 0.22); ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.strokeRect(p.sx - p.w / 2, p.sy - 12, p.w, 24); ctx.setLineDash([]); } });
            pieces.forEach(p => { const near = !p.placed && Math.hypot(p.x - p.sx, p.y - p.sy) < tol; frag(p.x, p.y, p.w, p.placed ? 0 : p.rot, (p.placed || near) ? suc : acc); });
            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

MG.register('breachmatrix', {
    title: 'Breach Matrix',
    hint: 'Pick codes (row, then column, then row…) to match the sequence',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const N = 4 + Math.floor(diff / 2);
        const seqLen = 2 + Math.floor(diff / 1.5);
        const bufLen = seqLen + 2;
        const CODES = ['1C', '55', 'BD', 'E9', '7A', 'FF'];

        const matrix = [];
        for (let r = 0; r < N; r++) {
            matrix[r] = [];
            for (let c = 0; c < N; c++) matrix[r][c] = CODES[api.randInt(0, CODES.length - 1)];
        }
        const path = [];
        let mode = 'row', fixed = 0, used = new Set();
        let rr = 0, cc;
        for (let i = 0; i < seqLen; i++) {
            if (mode === 'row') {
                let col; let guard = 0;
                do { col = api.randInt(0, N - 1); guard++; } while (used.has('r' + fixed + 'c' + col) && guard < 20);
                used.add('r' + fixed + 'c' + col);
                path.push(matrix[fixed][col]); cc = col; mode = 'col';
            } else {
                let row; let guard = 0;
                do { row = api.randInt(0, N - 1); guard++; } while (used.has('r' + row + 'c' + cc) && guard < 20);
                used.add('r' + row + 'c' + cc);
                path.push(matrix[row][cc]); fixed = row; mode = 'row';
            }
        }
        const target = path.slice();

        const buffer = [];
        let selMode = 'row', lockRow = 0, lockCol = null, finished = false;

        const box = document.createElement('div');
        box.style.cssText = 'display:flex;gap:26px;align-items:flex-start;';
        box.innerHTML = `
            <div>
              <div class="label">CODE MATRIX</div>
              <div id="mx" style="display:grid;grid-template-columns:repeat(${N},1fr);gap:6px;"></div>
            </div>
            <div style="min-width:150px;">
              <div class="label">SEQUENCE REQUIRED</div>
              <div id="seq" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;"></div>
              <div class="label">BUFFER</div>
              <div id="buf" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
            </div>`;
        api.board.appendChild(box);
        const mxEl = box.querySelector('#mx');
        const seqEl = box.querySelector('#seq');
        const bufEl = box.querySelector('#buf');

        const chip = (txt, cls) => `<span class="bm-chip ${cls || ''}" style="
            font-family:var(--mono);font-size:13px;padding:6px 9px;border-radius:5px;
            border:1px solid var(--line);min-width:30px;text-align:center;">${txt}</span>`;

        function renderSeq() {
            seqEl.innerHTML = target.map((t, i) =>
                chip(t, i < matchedLen() ? 'ok' : '')).join('');
            seqEl.querySelectorAll('.ok').forEach(e => {
                e.style.borderColor = 'var(--success)'; e.style.color = 'var(--success)';
            });
        }
        function matchedLen() {
            let best = 0;
            for (let start = 0; start < buffer.length; start++) {
                let k = 0;
                while (start + k < buffer.length && k < target.length && buffer[start + k] === target[k]) k++;
                if (k > best) best = k;
                if (best === target.length) break;
            }
            return best;
        }
        function renderBuf() {
            bufEl.innerHTML = '';
            for (let i = 0; i < bufLen; i++) {
                bufEl.innerHTML += chip(buffer[i] || '·', buffer[i] ? 'filled' : '');
            }
            bufEl.querySelectorAll('.filled').forEach(e => {
                e.style.borderColor = 'var(--accent)'; e.style.color = 'var(--accent)';
            });
        }
        function renderMx() {
            mxEl.innerHTML = '';
            for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
                const active = (selMode === 'row' && r === lockRow) ||
                               (selMode === 'col' && c === lockCol);
                const cellEl = document.createElement('button');
                cellEl.className = 'btn';
                cellEl.textContent = matrix[r][c];
                cellEl.style.cssText = `padding:8px;font-size:13px;min-width:0;
                    opacity:${active ? 1 : 0.3};
                    border-color:${active ? 'var(--accent)' : 'var(--line)'};
                    cursor:${active ? 'pointer' : 'not-allowed'};`;
                cellEl.onclick = () => pick(r, c, active);
                mxEl.appendChild(cellEl);
            }
        }
        function pick(r, c, active) {
            if (finished || !active) return;
            buffer.push(matrix[r][c]);
            if (selMode === 'row') { lockCol = c; selMode = 'col'; }
            else { lockRow = r; selMode = 'row'; }
            renderMx(); renderBuf(); renderSeq();
            if (matchedLen() >= target.length) {
                finished = true; api.stopTimer(); api.setTag('BREACHED');
                setTimeout(() => api.succeed(), 350);
            } else if (buffer.length >= bufLen) {
                finished = true; api.shake(); api.stopTimer();
                setTimeout(() => api.fail(), 300);
            }
        }

        api.setTag('INJECTING');
        api.startTimer(Math.max(15, 35 - diff * 3), () => { if (!finished) api.fail(); });
        renderMx(); renderBuf(); renderSeq();
        return { destroy() {} };
    }
});

MG.register('breathalyzer', {
    title: 'Breathalyzer',
    hint: 'Hold SPACE / mouse to blow · keep the flow in the green to log a reading',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));

        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const bandH = Math.max(0.16, 0.34 - diff * 0.03);
        const lo = 0.48, hi = lo + bandH;
        const rise = 0.95, drain = 0.85, fillRate = 0.32;
        let flow = 0, reading = 0, hold = false, done = false, last = performance.now();

        function down(e) { if (e.code === 'Space') { e.preventDefault(); hold = true; } }
        function up(e) { if (e.code === 'Space') { e.preventDefault(); hold = false; } }
        document.addEventListener('keydown', down);
        document.addEventListener('keyup', up);
        cvs.addEventListener('mousedown', () => hold = true);
        cvs.addEventListener('mouseup', () => hold = false);
        cvs.addEventListener('mouseleave', () => hold = false);

        api.setTag('BLOW');
        api.startTimer(Math.max(16, 26 - diff * 2), () => fail());
        function clean() { document.removeEventListener('keydown', down); document.removeEventListener('keyup', up); }
        function fail() { if (done) return; done = true; clean(); api.stopTimer(); api.shake(); setTimeout(() => api.fail(), 200); }
        function win() { if (done) return; done = true; clean(); api.stopTimer(); api.setTag('READING LOGGED'); setTimeout(() => api.succeed(), 300); }

        function draw() {
            const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
            if (!done) {
                flow = Math.max(0, Math.min(1, flow + (hold ? rise : -drain) * dt));
                const inB = flow >= lo && flow <= hi;
                reading = Math.max(0, Math.min(1, reading + (inB ? fillRate : -fillRate * 0.5) * dt));
                if (reading >= 1) { win(); return; }
            }
            ctx.clearRect(0, 0, W, H);

            // flow gauge (vertical)
            const gx = 90, gw = 54, top = 30, bh = H - 80;
            ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(gx, top, gw, bh);
            ctx.fillStyle = 'rgba(57,217,138,0.18)'; ctx.fillRect(gx, top + bh * (1 - hi), gw, bh * (hi - lo));
            ctx.strokeStyle = 'rgba(57,217,138,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(gx, top + bh * (1 - hi), gw, bh * (hi - lo));
            const inB = flow >= lo && flow <= hi;
            const fy = top + bh * (1 - flow);
            ctx.fillStyle = inB ? suc : dng; ctx.shadowColor = inB ? suc : dng; ctx.shadowBlur = 12;
            ctx.fillRect(gx - 4, fy - 3, gw + 8, 6); ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '10px monospace'; ctx.textAlign = 'center'; ctx.fillText('FLOW', gx + gw / 2, H - 38);

            // device + reading bar
            const dxc = 230;
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2;
            ctx.strokeRect(dxc - 36, 60, 72, 120);
            ctx.fillStyle = inB ? 'rgba(57,217,138,0.12)' : 'rgba(255,255,255,0.03)'; ctx.fillRect(dxc - 36, 60, 72, 120);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(Math.round(reading * 100) + '%', dxc, 120);
            ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(dxc - 36, 196, 72, 10);
            ctx.fillStyle = suc; ctx.fillRect(dxc - 36, 196, 72 * reading, 10);
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '10px monospace'; ctx.fillText('READING', dxc, 224);

            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); clean(); } };
    }
});


/* ---- cascade.js ---- */
MG.register('cascade', {
    title: 'Cascade',
    hint: 'Watch the sequence · repeat it back',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const nodeCount = 4 + Math.floor(diff / 1.5);
        const roundsToWin = 3 + diff;
        const flashMs = Math.max(280, 620 - diff * 70);

        const W = 320, H = 320;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'pointer';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const nodes = [];
        const R = 110, cx = W / 2, cy = H / 2;
        const colors = ['#ff4d6d', '#ffd23f', '#00e0b8', '#5b8cff', '#c06bff', '#ff8a00', '#39d98a'];
        for (let i = 0; i < nodeCount; i++) {
            const a = (i / nodeCount) * Math.PI * 2 - Math.PI / 2;
            nodes.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, c: colors[i % colors.length], lit: 0 });
        }

        let seq = [], inputIdx = 0, phase = 'show', round = 0, busy = false;
        api.setDots(roundsToWin);
        api.setTag('WATCH');

        function nextRound() {
            round++;
            if (round > roundsToWin) { finish(true); return; }
            seq.push(api.randInt(0, nodeCount - 1));
            inputIdx = 0; phase = 'show'; busy = true;
            playSequence();
        }
        function playSequence() {
            let i = 0;
            api.setTag('WATCH ' + round);
            const iv = setInterval(() => {
                if (i >= seq.length) {
                    clearInterval(iv); phase = 'input'; busy = false;
                    api.setTag('REPEAT ' + round);
                    return;
                }
                nodes[seq[i]].lit = 12; i++;
                api.sfx('beep');
            }, flashMs);
        }

        cvs.addEventListener('click', (e) => {
            if (phase !== 'input' || busy) return;
            const b = cvs.getBoundingClientRect();
            const x = (e.clientX - b.left) * (cvs.width / b.width);
            const y = (e.clientY - b.top) * (cvs.height / b.height);
            const idx = nodes.findIndex((n) => Math.hypot(n.x - x, n.y - y) < 26);
            if (idx < 0) return;
            nodes[idx].lit = 12;
            if (idx === seq[inputIdx]) {
                inputIdx++;
                if (inputIdx >= seq.length) {
                    const st = []; for (let i = 0; i < roundsToWin; i++) st[i] = i < round ? 'done' : '';
                    api.setDots(roundsToWin, st);
                    phase = 'wait'; busy = true;
                    setTimeout(nextRound, 500);
                }
            } else { api.shake(); finish(false); }
        });

        let ended = false;
        function finish(ok) {
            if (ended) return; ended = true;
            api.stopTimer();
            setTimeout(() => ok ? api.succeed() : api.fail(), 350);
        }

        api.startTimer(Math.max(20, 50 - diff * 4), () => { if (!ended) finish(false); });

        function draw() {
            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
            nodes.forEach((n) => {
                const glow = n.lit > 0;
                ctx.fillStyle = glow ? n.c : 'rgba(255,255,255,0.06)';
                ctx.strokeStyle = n.c; ctx.lineWidth = 2;
                ctx.shadowColor = n.c; ctx.shadowBlur = glow ? 22 : 4;
                ctx.beginPath(); ctx.arc(n.x, n.y, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.shadowBlur = 0;
                if (n.lit > 0) n.lit--;
            });
            loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        nextRound();
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

MG.register('cashcount', {
    title: 'Count The Take',
    hint: 'Click bills to hit the exact amount · UNDO to remove the last',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 420, H = 300;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;

        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const DENOMS = [5, 10, 20, 50, 100];
        const target = 5 * api.randInt(15 + diff * 6, 35 + diff * 22);
        let total = 0, stack = [], done = false, flash = 0;

        const bw = (W - 50) / (DENOMS.length + 1);
        const btns = DENOMS.map((d, i) => ({ d, x: 25 + i * bw, w: bw - 8, y: H - 78, h: 52 }));
        const undoBtn = { x: 25 + DENOMS.length * bw, w: bw - 8, y: H - 78, h: 52 };

        function check() { api.setTag('$' + total + ' / $' + target); if (total === target) { done = true; api.stopTimer(); api.setTag('EXACT — $' + total); setTimeout(() => api.succeed(), 350); } }
        function add(d) { if (done) return; total += d; stack.push(d); flash = 6; api.sfx('click'); check(); }
        function undo() { if (done || !stack.length) return; total -= stack.pop(); api.sfx('tick'); }

        cvs.addEventListener('click', (e) => {
            if (done) return;
            const b = cvs.getBoundingClientRect();
            const x = (e.clientX - b.left) * (W / b.width), y = (e.clientY - b.top) * (H / b.height);
            for (const bt of btns) if (x >= bt.x && x <= bt.x + bt.w && y >= bt.y && y <= bt.y + bt.h) { add(bt.d); return; }
            if (x >= undoBtn.x && x <= undoBtn.x + undoBtn.w && y >= undoBtn.y && y <= undoBtn.y + undoBtn.h) undo();
        });

        api.setTag('$0 / $' + target);
        api.startTimer(Math.max(20, 34 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); } });

        function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

        function draw() {
            if (flash > 0) flash--;
            ctx.clearRect(0, 0, W, H);

            const over = total > target;
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '11px monospace'; ctx.textAlign = 'center'; ctx.fillText('TARGET', W / 2, 36);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 38px monospace'; ctx.fillText('$' + target.toLocaleString(), W / 2, 78);

            ctx.fillStyle = over ? dng : (total === target ? suc : acc);
            ctx.font = 'bold 26px monospace'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = flash * 3;
            ctx.fillText('$' + total.toLocaleString(), W / 2, 124); ctx.shadowBlur = 0;
            ctx.fillStyle = over ? dng : 'rgba(255,255,255,0.4)'; ctx.font = '11px monospace';
            ctx.fillText(over ? 'OVER — undo some' : (target - total) + ' to go  ·  ' + stack.length + ' bills', W / 2, 146);

            btns.forEach(bt => {
                ctx.fillStyle = 'rgba(57,217,138,0.10)'; rr(bt.x, bt.y, bt.w, bt.h, 7); ctx.fill();
                ctx.strokeStyle = suc; ctx.lineWidth = 1.5; rr(bt.x, bt.y, bt.w, bt.h, 7); ctx.stroke();
                ctx.fillStyle = suc; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center'; ctx.fillText('$' + bt.d, bt.x + bt.w / 2, bt.y + bt.h / 2 + 5);
            });
            ctx.fillStyle = 'rgba(255,59,92,0.10)'; rr(undoBtn.x, undoBtn.y, undoBtn.w, undoBtn.h, 7); ctx.fill();
            ctx.strokeStyle = dng; ctx.lineWidth = 1.5; rr(undoBtn.x, undoBtn.y, undoBtn.w, undoBtn.h, 7); ctx.stroke();
            ctx.fillStyle = dng; ctx.font = 'bold 12px monospace'; ctx.fillText('UNDO', undoBtn.x + undoBtn.w / 2, undoBtn.y + undoBtn.h / 2 + 4);

            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

            if (hit === pts[idx]) {

                if (idx >= n) { done = true; api.stopTimer(); api.setTag('CONSTELLATION'); setTimeout(() => api.succeed(), 300); }
            } else { wrong++; api.shake(); if (wrong >= maxWrong) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 300); } }
        });

        api.setTag('STARGAZING');
        api.startTimer(Math.max(14, 26 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); } });

        function draw() {
            ctx.clearRect(0, 0, W, H);
            stars.forEach(s => { ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); });

            ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.shadowColor = acc; ctx.shadowBlur = 8;
            ctx.beginPath();
            for (let i = 0; i < idx; i++) { if (i === 0) ctx.moveTo(pts[0].x, pts[0].y); else ctx.lineTo(pts[i].x, pts[i].y); }
            ctx.stroke(); ctx.shadowBlur = 0;

            decoys.forEach(p => { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill(); });
            pts.forEach((p, i) => {
                const lit = i < idx, next = i === idx;
                ctx.fillStyle = lit ? suc : (next ? '#fff' : acc);
                ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = next ? 14 : (lit ? 10 : 4);
                ctx.beginPath(); ctx.arc(p.x, p.y, next ? 6 : 5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
                ctx.fillText(i + 1, p.x, p.y - 10);
            });
            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

MG.register('cooking', {
    title: 'Cooking',
    hint: 'Hit SPACE when the marker is in the green for each step',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const steps = 3 + Math.floor(diff / 1.3);
        const W = 420, H = 220;
        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const STEP_NAMES = ['CHOP', 'SEAR', 'SEASON', 'STIR', 'PLATE', 'GARNISH'];
        const zoneW = Math.max(44, 130 - diff * 14);
        const speed = 1.6 + diff * 0.8;

        let step = 0, ended = false, pos = 60, dir = 1;
        let zoneX = newZone();
        api.setDots(steps);

        function newZone() { return 70 + Math.random() * (W - 140 - zoneW); }

        function attempt() {
            if (ended) return;
            const inside = pos >= zoneX && pos <= zoneX + zoneW;
            if (inside) {
                step++;
                api.sfx('step');
                api.setDots(steps, Array.from({ length: steps }, (_, i) => i < step ? 'done' : ''));
                if (step >= steps) { finish(true); return; }
                zoneX = newZone(); dir = Math.random() < 0.5 ? 1 : -1;
            } else { finish(false); }
        }
        function key(e) { if (e.code === 'Space') { e.preventDefault(); attempt(); } }
        document.addEventListener('keydown', key);
        cvs.addEventListener('click', attempt);

        api.startTimer(Math.max(11, 24 - diff * 1.6), () => finish(false));
        function finish(ok) { if (ended) return; ended = true; if (!ok) api.shake(); document.removeEventListener('keydown', key); api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 200); }

        function draw() {
            const acc = (getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#00e0b8').trim();
            const suc = (getComputedStyle(document.documentElement).getPropertyValue('--success') || '#39d98a').trim();
            if (!ended) {
                pos += dir * speed;
                if (pos > W - 60) { pos = W - 60; dir = -1; }
                if (pos < 60) { pos = 60; dir = 1; }
            }
            ctx.clearRect(0, 0, W, H);
            api.setTag(STEP_NAMES[step % STEP_NAMES.length] + ' (' + (step + 1) + '/' + steps + ')');

            const trackY = H / 2;
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.fillRect(50, trackY - 24, W - 100, 48);
            ctx.fillStyle = 'rgba(57,217,138,0.18)';
            ctx.strokeStyle = suc; ctx.lineWidth = 2;
            ctx.fillRect(zoneX, trackY - 24, zoneW, 48);
            ctx.strokeRect(zoneX, trackY - 24, zoneW, 48);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.shadowColor = acc; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.moveTo(pos, trackY - 32); ctx.lineTo(pos, trackY + 32); ctx.stroke(); ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
            ctx.fillText('SPACE in the green', W / 2, trackY + 60);
            if (!ended) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); document.removeEventListener('keydown', key); } };
    }
});


/* ---- counterfeit.js ---- */
MG.register('counterfeit', {
    title: 'Counterfeit',
    hint: 'Drag the plate onto the guides · hold it aligned to print each bill',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const W = 420, H = 300;

        const cvs = document.createElement('canvas');
        cvs.width = W; cvs.height = H;
        cvs.style.cursor = 'grab';
        api.board.appendChild(cvs);
        const ctx = cvs.getContext('2d');

        const css = getComputedStyle(document.documentElement);
        const acc = (css.getPropertyValue('--accent') || '#00e0b8').trim();
        const suc = (css.getPropertyValue('--success') || '#39d98a').trim();
        const dng = (css.getPropertyValue('--danger') || '#ff3b5c').trim();

        const need = 3 + Math.floor(diff / 2);
        const tol = Math.max(8, 22 - diff * 3);
        const printTime = 0.55 + diff * 0.06;
        const drift = diff >= 3 ? 0.25 + diff * 0.12 : 0;
        const tx = W / 2, ty = 120, pw = 150, ph = 70;
        let printed = 0, charge = 0, done = false, last = performance.now();
        let px = 0, py = 0, dragging = false, off = { x: 0, y: 0 };

        function newPlate() { const a = Math.random() * Math.PI * 2, r = 55 + Math.random() * 55; px = tx + Math.cos(a) * r; py = ty + Math.sin(a) * r; charge = 0; }
        newPlate();
        api.setDots(need);

        function rel(e) { const b = cvs.getBoundingClientRect(); return { x: (e.clientX - b.left) * (W / b.width), y: (e.clientY - b.top) * (H / b.height) }; }
        cvs.addEventListener('mousedown', (e) => { const r = rel(e); if (Math.abs(r.x - px) < pw / 2 && Math.abs(r.y - py) < ph / 2) { dragging = true; off.x = r.x - px; off.y = r.y - py; cvs.style.cursor = 'grabbing'; } });
        cvs.addEventListener('mousemove', (e) => { if (!dragging) return; const r = rel(e); px = r.x - off.x; py = r.y - off.y; });
        cvs.addEventListener('mouseup', () => { dragging = false; cvs.style.cursor = 'grab'; });
        cvs.addEventListener('mouseleave', () => { dragging = false; });

        api.setTag('PRINTING');
        api.startTimer(Math.max(18, 32 - diff * 2), () => { if (!done) { done = true; api.stopTimer(); setTimeout(() => api.fail(), 200); } });

        function draw() {
            const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now;
            if (!done) {
                if (drift && !dragging) { px += (Math.random() - 0.5) * drift; py += (Math.random() - 0.5) * drift; }
                px = Math.max(pw / 2, Math.min(W - pw / 2, px)); py = Math.max(40 + ph / 2, Math.min(H - 30 - ph / 2, py));
                const aligned = Math.hypot(px - tx, py - ty) < tol;
                if (aligned) { charge += dt / printTime; if (charge >= 1) { printed++; api.sfx('latch'); api.setDots(need, Array.from({ length: need }, (_, i) => i < printed ? 'done' : '')); if (printed >= need) { done = true; api.stopTimer(); api.setTag('PRINTED'); setTimeout(() => api.succeed(), 300); } else newPlate(); } }
                else charge = Math.max(0, charge - dt / printTime * 1.5);
            }
            ctx.clearRect(0, 0, W, H);

            // press body
            ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2; ctx.strokeRect(tx - pw / 2 - 14, ty - ph / 2 - 14, pw + 28, ph + 28);
            // target guides (registration marks)
            const aligned = Math.hypot(px - tx, py - ty) < tol;
            ctx.strokeStyle = aligned ? suc : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 4]); ctx.strokeRect(tx - pw / 2, ty - ph / 2, pw, ph); ctx.setLineDash([]);
            ctx.beginPath(); ctx.moveTo(tx - 12, ty); ctx.lineTo(tx + 12, ty); ctx.moveTo(tx, ty - 12); ctx.lineTo(tx, ty + 12); ctx.stroke();

            // the plate (movable bill)
            ctx.save(); ctx.globalAlpha = 0.92;
            ctx.fillStyle = aligned ? 'rgba(57,217,138,0.18)' : 'rgba(0,224,184,0.12)';
            ctx.fillRect(px - pw / 2, py - ph / 2, pw, ph);
            ctx.strokeStyle = aligned ? suc : acc; ctx.lineWidth = 2; ctx.strokeRect(px - pw / 2, py - ph / 2, pw, ph);
            ctx.strokeStyle = aligned ? suc : acc; ctx.beginPath(); ctx.arc(px, py, 16, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(px - 10, py); ctx.lineTo(px + 10, py); ctx.moveTo(px, py - 10); ctx.lineTo(px, py + 10); ctx.stroke();
            ctx.fillStyle = aligned ? suc : acc; ctx.font = '9px monospace'; ctx.textAlign = 'left'; ctx.fillText('$100', px - pw / 2 + 8, py - ph / 2 + 16);
            ctx.restore();

            // charge bar
            ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(40, H - 26, W - 80, 8);
            ctx.fillStyle = suc; ctx.fillRect(40, H - 26, (W - 80) * charge, 8);
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
            ctx.fillText(aligned ? 'HOLD STEADY — PRINTING' : 'align the plate', W / 2, H - 32);

            if (!done) loop = requestAnimationFrame(draw);
        }
        let loop = requestAnimationFrame(draw);
        return { destroy() { cancelAnimationFrame(loop); } };
    }
});

MG.register('crafting', {
    title: 'Crafting',
    hint: 'Add ingredients in the shown order',
    run(api) {
        const diff = Math.max(1, Math.min(5, api.cfg.difficulty || 2));
        const seqLen = 3 + Math.floor(diff / 1.2);
        const slots = Math.min(8, 4 + diff);
        const ICONS = ['\u2697\ufe0f','\ud83e\uddea','\ud83d\udd25','\u2744\ufe0f','\u26a1','\ud83c\udf3f','\ud83d\udca7','\u2728'];
        const palette = ICONS.slice(0, slots);
        const recipe = Array.from({ length: seqLen }, () => api.randInt(0, slots - 1));

        let step = 0, ended = false, showing = true;
        api.setDots(seqLen);

        const box = document.createElement('div');
        box.style.cssText = 'display:flex;flex-direction:column;gap:16px;align-items:center;width:460px;';
        box.innerHTML = `
            <div class="label" id="lbl">RECIPE \u2014 MEMORIZE</div>
            <div id="recipe" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:48px;"></div>
            <div id="station" style="display:grid;grid-template-columns:repeat(${Math.ceil(slots / 2)},1fr);gap:10px;"></div>`;
        api.board.appendChild(box);
        const recipeEl = box.querySelector('#recipe');
        const stationEl = box.querySelector('#station');
        const lbl = box.querySelector('#lbl');

        function renderRecipe(reveal) {
            recipeEl.innerHTML = '';
            recipe.forEach((r, i) => {
                const d = document.createElement('div');
                const show = reveal || i < step;
                d.style.cssText = `width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-size:22px;
                    border:2px solid ${i === step && !reveal ? 'var(--accent)' : 'var(--line)'};
                    ${i < step ? 'border-color:var(--success);' : ''}`;
                d.textContent = show ? palette[r] : '?';
                recipeEl.appendChild(d);
            });
        }

            const b = document.createElement('button');
            b.className = 'btn'; b.textContent = ic; b.style.cssText = 'font-size:24px;padding:10px;min-width:0;';
            b.onclick = () => pick(idx);
            stationEl.appendChild(b);

            if (ended || showing) return;
            if (idx === recipe[step]) {
                step++; api.sfx('step');
                api.setDots(seqLen, Array.from({ length: seqLen }, (_, i) => i < step ? 'done' : ''));
                renderRecipe(false);
                if (step >= seqLen) { finish(true); }
            } else { api.shake(); finish(false); }
        }
        function finish(ok) { if (ended) return; ended = true; api.stopTimer(); setTimeout(() => ok ? api.succeed() : api.fail(), 300); }

        renderRecipe(true);
        api.setTag('MEMORIZE');
        const showMs = Math.max(1400, 2600 - diff * 240);
        setTimeout(() => {
            if (ended) return;
            showing = false; lbl.textContent = 'CRAFT \u2014 FOLLOW THE ORDER';
            api.setTag('CRAFT');
            renderRecipe(false);
            api.startTimer(Math.max(10, 20 - diff), () => finish(false));
        }, showMs);

        return { destroy() {} };
    }
});
