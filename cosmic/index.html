<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cosmic Match</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--R:#ff4f6d;--Y:#ffc43a;--G:#35d49a;--B:#4a9dff;--tx:#ecebff;--mute:#9b9dcb;--line:#3a3d85;--panel:#14163a}
html,body{min-height:100%}
body{font-family:ui-rounded,"Avenir Next","Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--tx);background:radial-gradient(ellipse at 50% -10%,#32206e 0,#0d0d2b 48%,#05050f 100%) fixed;overflow-x:hidden}

#app{position:relative;max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}

button:hover:not(:disabled){background:rgba(255,255,255,.16)}

button:focus-visible,.card:focus-visible,.mode:focus-visible{outline:3px solid #fff;outline-offset:2px}
#opps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opp{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;min-width:104px;transition:border-color .2s,box-shadow .2s}
.opp.act{border-color:#b58cff;box-shadow:0 0 18px #7d5cff88}
.opp.out{opacity:.4}

#table{display:flex;align-items:center;justify-content:center;gap:22px;padding:14px 0 6px}
#info{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:140px}
#claim{font-weight:800;padding:5px 12px;border-radius:99px;border:2px solid #fff8;font-size:14px;text-align:center}
#dir,#modeinfo{color:var(--mute);font-size:13px;text-align:center;max-width:240px}
#modeinfo{color:#d6c9ff;font-weight:700}
.card{position:relative;width:64px;height:92px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;border:2px solid #ffffffd9;box-shadow:0 4px 12px #0008;user-select:none;flex:0 0 auto;transition:transform .15s,opacity .15s}
.card.R{background:linear-gradient(150deg,#ff7a92,#c71f40)}
.card.Y{background:linear-gradient(150deg,#ffd75e,#d89200);color:#2a1d00}
.card.G{background:linear-gradient(150deg,#58e9b2,#119565)}
.card.B{background:linear-gradient(150deg,#74b6ff,#1d62c4)}
.card.W{background:conic-gradient(var(--R),var(--Y),var(--G),var(--B),var(--R))}
.card .big{font-size:32px;text-shadow:0 2px 6px #0006}
.card .big.sm{font-size:20px}
.card.Y .big{text-shadow:none}
.card .cn,.card .cm{position:absolute;font-size:13px}
.card .cn{top:4px;left:6px}.card .cm{bottom:4px;right:6px}
.card.liar{border-style:dashed}
.card .lb{position:absolute;top:-9px;right:-7px;font-size:13px;background:var(--panel);border-radius:50%;padding:1px 4px;font-style:normal;border:1px solid var(--line);color:#fff}
.card .fx{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:24px;height:16px;border-radius:5px;border:1.5px solid #fff;font-size:10px;font-style:normal;display:flex;align-items:center;justify-content:center;color:#fff}
.fx.R{background:var(--R)}.fx.Y{background:var(--Y);color:#2a1d00}.fx.G{background:var(--G)}.fx.B{background:var(--B)}
.card.back{background:radial-gradient(circle at 50% 40%,#6a4ad8,#1c1450 70%);font-size:22px}
.card.back span{text-shadow:0 0 10px #c9b6ff}
#drawPile{cursor:pointer}
#drawPile.ready{box-shadow:0 0 0 3px #b58cff,0 0 20px #7d5cff}
#controls{display:flex;gap:8px;justify-content:center}
#status{text-align:center;font-weight:800;min-height:24px}
#actbar{position:relative;display:none;justify-content:center;min-height:54px}
#actbar.on{display:flex}
#actbar button{background:linear-gradient(90deg,#7d5cff,#e04cc2);border:0;font-size:17px;padding:10px 26px;animation:pulse .8s infinite alternate}
#actbar i{position:absolute;left:10%;right:10%;bottom:0;height:4px;border-radius:4px;background:#b58cff;transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
@keyframes pulse{to{transform:scale(1.06)}}
#log{font-size:13px;color:var(--mute);text-align:center;min-height:68px;line-height:1.35}
#hand{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 4px 6px;margin-top:auto}

.dim{opacity:.38;filter:grayscale(.4)}
#modal{position:fixed;inset:0;background:#03030cd0;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:520px;width:100%;max-height:92vh;overflow:auto;line-height:1.45}
.box h2{margin:12px 0 8px;font-size:18px}.box p,.box li{margin:6px 0;font-size:15px}.box ul{padding-left:20px}
.cols{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cols button{flex:1 1 90px}
.cb.R{background:var(--R)}.cb.Y{background:var(--Y);color:#2a1d00}.cb.G{background:var(--G);color:#042}.cb.B{background:var(--B)}
.cb{border:0}
.box:has(.menu){padding:0;max-width:800px;overflow:hidden;background:linear-gradient(180deg,#1d1750 0,#14163a 240px)}
.menu{display:flex;flex-direction:column;max-height:92vh}
.menu-body{padding:18px 22px 8px;overflow:auto;flex:1}
.hero{text-align:center}
.hero h1{font-size:38px;letter-spacing:1px;margin:2px 0 2px;background-size:200% 100%;animation:shift 6s ease-in-out infinite alternate}
@keyframes shift{to{background-position:100% 0}}
.hero .sub{color:var(--mute);font-size:14px}
.msg{margin:14px auto 0;max-width:440px;padding:10px 14px;border-radius:12px;background:rgba(125,92,255,.25);border:1px solid #b58cff;font-weight:800}
.demo{display:flex;justify-content:center;height:84px;margin:0 0 2px}
.demo .card{width:46px;height:68px;margin-left:-12px;transform-origin:50% 130%}
.demo .card:nth-child(1){transform:rotate(-22deg)}.demo .card:nth-child(2){transform:rotate(-11deg)}.demo .card:nth-child(3){transform:translateY(-8px)}.demo .card:nth-child(4){transform:rotate(11deg)}.demo .card:nth-child(5){transform:rotate(22deg)}
.sect{margin-top:16px}
.sect h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:9px 6px;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:rgba(255,255,255,.04);transition:transform .15s,border-color .15s,background .15s}
.mode:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}
.mode .ic{font-size:23px;line-height:1.2}.mode b{font-size:15px}.mode .tg{font-size:11px;color:var(--mute)}
.mode.sel{border-color:#b58cff;background:rgba(125,92,255,.24);box-shadow:0 0 18px #7d5cff55}
.detail{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.detail p{font-size:13px;color:var(--mute);margin:2px 0 0}.detail button{flex:0 0 auto}
.sect .cols{margin-top:0}
.sect .note{margin-top:8px}
.seg button.on{background:#7d5cff;border-color:#b58cff}
.menu-foot{padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#101233}
.go{background:linear-gradient(90deg,#7d5cff,#e04cc2)!important;border:0!important;font-size:18px;padding:13px;width:100%}
.card.spin::after{content:"";position:absolute;inset:3px;border-radius:8px;background:repeating-conic-gradient(from 0deg,#ffffff2a 0 15deg,transparent 15deg 30deg);pointer-events:none}
.wheelwrap{position:relative;width:270px;margin:0 auto;text-align:center}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:26px;z-index:2;color:#fff;text-shadow:0 2px 6px #000}
.wheel{position:relative;width:250px;height:250px;border-radius:50%;margin:20px auto 12px;border:4px solid #fff;box-shadow:0 0 30px #7d5cff88;transition:transform 2.4s cubic-bezier(.12,.75,.2,1)}
.wl{position:absolute;left:50%;top:50%;width:0;height:0}
.wl i{position:absolute;left:0;top:0;font-style:normal;font-size:26px}
.pickrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#meter{min-height:0}
.mbar{width:180px;height:12px;border-radius:99px;border:2px solid #fff8;background:#0c0e2a;overflow:hidden}
.mbar i{display:block;height:100%;transition:width .4s,background .4s}
.hgrp{border:2px solid var(--line);border-radius:14px;padding:6px 8px 8px;background:rgba(255,255,255,.03)}

.hcards{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-width:60px}
.unlit{opacity:.35;filter:grayscale(.6)}
.litp .card{box-shadow:0 0 0 3px #ffc43a,0 0 18px #ffc43a88}
#tip.dock{left:10px!important;right:10px;top:64px!important;max-width:none;font-size:14px}
#tip .tiphint{color:#ffd86b;font-weight:800;margin-top:6px}
.card.armed{transform:translateY(-12px)!important;outline:3px solid #fff;outline-offset:2px}
.ghost.on{background:#7d5cff;border-color:#b58cff}
body.infomode .card[data-tip]{cursor:help}
#starrow{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
#starrow:empty{display:none}
#starrow .lbl{flex:0 0 100%;text-align:center;font-size:12px;color:var(--mute);font-weight:800}
#starrow .card{cursor:pointer}
.bounty{padding:4px 12px;border-radius:99px;border:2px solid #ffc43a;background:rgba(255,196,58,.15);font-weight:800;font-size:13px;text-align:center}
.open{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:300px;margin:4px 0}
.open .card{width:30px;height:44px;border-radius:6px;border-width:1px}
.open .card .big{font-size:15px}
.open .card .cn,.open .card .cm,.open .card .lb,.open .card .fx{display:none}
.opp.openp{min-width:150px}
.scol{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px}
.sbks{display:flex;flex-direction:column;gap:2px}
.sbks i{display:block;width:52px;height:8px;border-radius:4px;background:linear-gradient(90deg,#5a3fc0,#2a1c78);border:1px solid #fff6}
.grp{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b58cff;margin:14px 0 8px;font-weight:800}
.hl2{flex:0 0 100%;text-align:center;font-size:12px;color:var(--mute);font-weight:800}
.endslot .card{box-shadow:0 0 0 3px #ffc43a,0 0 16px #ffc43a88}
.pyr .card,.phold{width:46px;height:66px}
.pyr .card .big{font-size:20px}.pyr .card .cn,.pyr .card .cm{font-size:10px}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 100%}
.hgrp.pyr,.hgrp .pyr{flex:0 0 auto;align-items:center}
.prow{display:flex;gap:6px;justify-content:center}
.phold{border:1px dashed #ffffff30;border-radius:8px}
.grid3{display:grid;grid-template-columns:repeat(3,auto);gap:6px;justify-content:center}
.showc{margin-top:4px}.showc .note{margin:0 0 2px;text-align:center}
.showc .card{width:40px;height:58px;margin:0 auto;cursor:pointer}
.showc .card .big{font-size:18px}.showc .card .cn,.showc .card .cm,.showc .card .lb{display:none}
.card.onshow::after{content:'🪟';position:absolute;bottom:-10px;right:-8px;font-size:16px}
.card.lucky{box-shadow:0 0 0 3px #7cfc9a,0 0 18px #7cfc9a88}
.card.lucky::before{content:'🍀';position:absolute;top:-12px;left:-8px;font-size:18px}
#tip{position:fixed;z-index:30;display:none;max-width:270px;background:#0c0e2a;border:1px solid #7d5cff;border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.4;box-shadow:0 8px 28px #000a;pointer-events:none}
#tip b{display:block;font-size:14px;margin-bottom:3px;color:#fff}
#tip div{color:#cfd0f5;margin-top:3px}
.twin{display:flex;gap:16px;align-items:flex-start;justify-content:center}
.twin>div{text-align:center}
.twin .pl{font-size:12px;color:var(--mute);margin-bottom:4px;font-weight:800}
.twin .pc{margin-top:5px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;border:2px solid #fff8;display:inline-block}
textarea{width:100%;min-height:120px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:#0c0e2a;color:var(--tx);font:inherit;padding:8px;resize:vertical}
.note{font-size:12px;color:var(--mute);margin-top:4px}
@media(max-width:560px){.card{width:52px;height:76px}.card .big{font-size:26px}.card .big.sm{font-size:16px}.card .fx{width:20px;height:13px;font-size:8px}#hand{gap:6px}h1{font-size:20px}.hero h1{font-size:30px}.mode{padding:8px 3px}.mode .ic{font-size:20px}.mode b{font-size:13px}.menu-body{padding:16px 14px 8px}.detail{flex-direction:column;align-items:stretch;text-align:left}.opp{min-width:84px;padding:6px 8px}#table{gap:12px}#info{min-width:100px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="stars"></div>
<div id="app">
  <header>
    <div><h1>✦ Cosmic Match</h1><span id="modeTag"></span></div>
    <div><button class="ghost" id="infoBtn" aria-pressed="false" title="Card info mode: tap or click any card to read it without playing it">ℹ Info</button><button class="ghost" id="rulesBtn">Rules</button><button class="ghost" id="newBtn">Menu</button></div>
  </header>

  <div id="status"></div>
  <div id="actbar"></div>
  <div id="controls"><button id="drawBtn" disabled>Draw a card</button><button id="passBtn" disabled>End turn</button></div>

</div>

<script>
const COLORS=['R','Y','G','B'],CN={R:'Red',Y:'Gold',G:'Green',B:'Blue'},SH={R:'●',Y:'▲',G:'◆',B:'■'};
const NAMES=['Nova','Orion','Lyra','Vega','Atlas','Zenith','Pulsar','Quasar','Comet','Astra','Helix','Nebula','Rigel','Sol','Titan'],AV=['🛰️','👽','🌠','🪐','☄️','🚀','🌌','🌙','⭐','🔭','🛸','🌞','🌍','🌑','✨'];
const nm=q=>q.human?'You':q.name;
const SW=()=>['mercy','liars','eclipse','bounty','chrono','gambit','open','bookends','duo','stacks','carousel','potato','roundabout','collector','lucky','pyramid','bingo','showcase'].includes(G?G.mode:'');
const sortHand=a=>[...a].sort((a,b)=>(COLORS.indexOf(a.c)<0?9:COLORS.indexOf(a.c))-(COLORS.indexOf(b.c)<0?9:COLORS.indexOf(b.c))||(a.n??20)-(b.n??20)||a.k.localeCompare(b.k));
function swapHands(a,b){if(G.mode==='duo'){const x=a.hand.slice(),y=b.hand.slice();a.hand.splice(0,a.hand.length,...y);b.hand.splice(0,b.hand.length,...x)}else{[a.hand,b.hand]=[b.hand,a.hand]}}
const total=p=>p.hand.length+(p.vault?p.vault.length:0);
const KN={draw2:'Draw Two',skip:'Skip',rev:'Reverse',draw4:'Draw Four',discall:'Discard All',skipall:'Skip Everyone',wrev4:'Wild Reverse Draw 4',wd6:'Wild Draw 6',wd10:'Wild Draw 10',roul:'Wild Color Roulette',wflip:'Wild All Flip',wt2:'Flex Wild Target Draw 2',wall:'Flex Wild All Draw',wd4:'Flex Wild Draw 4',wild4:'Wild Draw 4',wildc:'Wild Challenge',wild:'Wild',swild:'Wild',crown:'Wild Crown',quake:'Wild Quake',excavate:'Wild Excavate',landslide:'Wild Landslide',elevator:'Wild Elevator',freespace:'Wild Free Space',reroll:'Wild Re-Roll',mixup:'Wild Mix-Up',daub:'Wild Double Daub',jam:'Wild Jammer',spotlight:'Wild Spotlight',tradeup:'Wild Trade-Up',padlock:'Wild Padlock',pickpocket:'Wild Pickpocket',floodlight:'Wild Floodlight',anchor:'Wild Anchor',backspin:'Wild Backspin',clone:'Wild Clone',callout:'Wild Call-Out',fourleaf:'Wild Four-Leaf',curse:'Wild Curse',dig:'Wild Dig',topple:'Wild Topple',aim:'Wild Aim',jolt:'Wild Jolt',block:'Wild Block',dump:'Wild Double Dump',freeze:'Wild Freeze',cswap:'Wild Swap Card',slide:'Wild Slide',scramble:'Wild Scramble',tagin:'Wild Tag-In',dteam:'Wild Double Team',poster:'Wild Poster',heist:'Wild Heist',rewind:'Wild Rewind',ff:'Wild Fast-Forward',echo:'Wild Echo',jackpot:'Wild Jackpot',insure:'Wild Insurance',meteor:'Meteor',orbit:'Orbit',align:'Wild Align',worbit:'Wild Orbit',vent:'Wild Vent',surge:'Wild Surge',disc2:'Discard Two',wclear:'Wild Clear',wgive:'Wild Give Away',pt:'Point Taken',dtog:'Wild Drawn Together',pileup:'Wild Pile Up',dare:'Dare',wdare:'Wild Dare',hit2:'Hit 2',trade:'Trade Hands',allhit:'Wild All Hit',hitfire:'Wild Hit-Fire',awild:'Wild',arev:'Wild Reverse',askip:'Wild Skip',askip2:'Wild Skip Two',adraw2:'Wild Draw Two',adraw4:'Wild Draw Four',at2:'Wild Targeted Draw Two',aswap:'Wild Forced Swap'};
const LAB={draw2:'+2',skip:'⊘',rev:'⇄',draw4:'+4',discall:'✖',skipall:'⏭',wrev4:'⇄+4',wd6:'+6',wd10:'+10',roul:'🎲',wflip:'⟲',wt2:'◎2',wall:'✦2',wd4:'+4',wild4:'+4',wildc:'?!',swild:'✦',crown:'👑',quake:'🌋',excavate:'⛏️',landslide:'🪨',elevator:'🛗',freespace:'🆓',reroll:'🎲',mixup:'🌀',daub:'🖍️',jam:'📛',spotlight:'🔦',tradeup:'🔄',padlock:'🔒',pickpocket:'🧤',floodlight:'💡',anchor:'⚓',backspin:'↩️',clone:'🧬',callout:'📣',fourleaf:'🍀',curse:'🕳️',dig:'⛏️',topple:'💥',aim:'🎯',jolt:'🌩️',block:'🚫',dump:'🗑️',freeze:'❄️',cswap:'🔄',slide:'↔️',scramble:'🌀',tagin:'🤝',dteam:'💪',poster:'📜',heist:'🦹',rewind:'⏪',ff:'⏩',echo:'🔁',jackpot:'🎰',insure:'🛡️',meteor:'☄️',orbit:'⟳',align:'🌗',worbit:'✦⟳',vent:'🌬️',surge:'⚡',disc2:'D2',wclear:'🧹',wgive:'🎁',pt:'☝️',dtog:'🔗',pileup:'📚',hit2:'×2',trade:'⇆',allhit:'💥',hitfire:'🔥',awild:'✦',arev:'⇄',askip:'⊘',askip2:'⊘⊘',adraw2:'+2',adraw4:'+4',at2:'◎2',aswap:'⇆'};
const DRAWV={draw2:2,draw4:4,wrev4:4,wd6:6,wd10:10,wild4:4};
const MODES={
  classic:{name:'Cosmic',d:'The classic game: match color or number, then play to 500 points.'},
  liars:{name:"Liar's Match",d:'Liar cards are played face down. Bluff your way out, or call out someone else.'},
  mercy:{name:'No Mercy',d:'Stack draw cards, wipe out whole colors, and hit 25 cards and you\'re out.'},
  flex:{name:'Flex',d:'Two-sided cards and a Power card let you flex into a different color.'},

function takeCard(){if(!G.deck.length&&(G.disc.length>1||G.aside.length)){const top=G.disc.pop();G.deck=shuffle([...G.disc,...G.aside]);G.aside=[];G.disc=[top]}return G.deck.pop()}
function draw(p,n){
  if(G.links&&!G._lk&&n>0&&G.links.includes(p)){const o=G.links[0]===p?G.links[1]:G.links[0];if(o&&o!==p){G._lk=true;log(`🔗 ${nm(o)} draw${o.human?'':'s'} ${n} too`);draw(o,n);G._lk=false}}
  for(let i=0;i<n;i++){
  if(p.out)return;
  if(!G.deck.length&&(G.disc.length>1||G.aside.length)){const top=G.disc.pop();G.deck=shuffle([...G.disc,...G.aside]);G.aside=[];G.disc=[top]}
  if(!G.deck.length)return;p.hand.push(G.deck.pop());
  if(G.mode==='twin'){const c=p.hand[p.hand.length-1],l=p.hand.filter(h=>h!==c&&h.side==='L').length,r=p.hand.filter(h=>h!==c&&h.side==='R').length;c.side=l<r?'L':r<l?'R':p.act}
  if(G.mode==='stacks'){const c=p.hand[p.hand.length-1],cnt=k=>p.hand.filter(h=>h!==c&&h.stk===k).length;c.stk=[0,1,2].sort((a,b)=>cnt(a)-cnt(b))[0]}
  if(G.mode==='pyramid'||G.mode==='bingo'){const c=p.hand[p.hand.length-1];c.pos=-1;c.gp=-1}
  if(G.mode==='mercy'&&p.hand.length>=25){p.out=true;G.aside.push(...p.hand);p.hand=[];log(`💥 ${p.name} hit 25 cards and is out!`);return}}}

function advance(s=1){
  if(G.frozen&&G.frozen.who===G.players[G.cur])G.frozen=null;
  if(G.mode==='carousel'){const q=G.players[G.cur];if(q&&!q.out)q.ptr=(q.ptr+3)%Math.max(q.hand.length,1)}
  let k=0,guard=0;
  while(k<s&&guard++<200){G.cur=mod(G.cur+G.dir,G.players.length);if(!G.players[G.cur].out)k++;if(G.frozen&&G.players[G.cur]===G.frozen.who&&k<s)G.frozen=null}}

/* ---------- which sides of a card can be played right now ---------- */
function sidesFor(p,c,free){
  const m=G.mode,t=G.top;
  if(m==='allwild')return['r'];
  if(m==='eclipse'){
    if(G.pending>0)return(DRAWV[c.k]&&DRAWV[c.k]>=G.lastVal)?['a','b']:[];
    const sd=[];G.piles.forEach((pl,i)=>{if(isWild(c)||matches(c,pl))sd.push(i?'b':'a')});return sd}
  if(m==='twin'){
    const ok=h=>isWild(h)||matches(h,t);
    if(!ok(c))return[];
    if(free)return['r'];
    const other=p.act==='L'?'R':'L',allowed=p.hand.some(h=>h.side===p.act&&ok(h))?p.act:other;
    return c.side===allowed?['r']:[]}
  if(m==='triple'){
    const sd=[];G.piles.forEach((pl,i)=>{if(!G.lit.includes(i))return;if(isWild(c)||pl.wild||matches(c,pl))sd.push('abc'[i])});return sd}
  if(m==='pyramid'){
    if(!(isWild(c)||matches(c,t)))return[];
    if(c.pos<0)return['r'];
    const r=c.pos<1?0:c.pos<3?1:c.pos<6?2:3;
    if(r===3)return['r'];
    const st=[0,1,3,6],j=c.pos-st[r],kids=[st[r+1]+j,st[r+1]+j+1];
    return kids.some(k=>p.hand.some(h=>h.pos===k))?[]:['r']}
  if(m==='lucky'){
    if(p.lucky&&p.lucky.includes(c.id))return['r'];
    return(isWild(c)||matches(c,t))?['r']:[]}
  if(m==='stacks'){
    if(!(isWild(c)||matches(c,t)))return[];
    if(free)return['r'];
    const top=[...p.hand].reverse().find(h=>h.stk===c.stk);
    return c===top?['r']:[]}
  if(m==='carousel'){
    if(!(isWild(c)||matches(c,t)))return[];
    if(free)return['r'];
    const L=p.hand.length;
    return(L<=3||mod(p.hand.indexOf(c)-p.ptr,L)<3)?['r']:[]}
  if(m==='open'){
    if(G.frozen&&G.frozen.who===p&&c.c===G.frozen.c)return[];
    return(isWild(c)||matches(c,t))?['r']:[]}
  if(m==='bookends'){
    const i=p.hand.indexOf(c);
    return((i===0||i===p.hand.length-1)&&(isWild(c)||matches(c,t)))?['r']:[]}
  if(m==='dare'||m==='party'||m==='overload'||m==='vault'||m==='observatory'||m==='bounty'||m==='chrono'||m==='gambit'||m==='duo'||m==='potato'||m==='roundabout'||m==='collector'||m==='bingo'||m==='showcase')return(isWild(c)||matches(c,t))?['r']:[];
  if(m==='attack'){if(c.k==='trade'&&p.hand.length===1)return[];return(isWild(c)||matches(c,t))?['r']:[]}
  if(m==='liars')return(c.liar||matches(c,t))?['r']:[];
  if(m==='mercy'){
    if(G.pending>0)return(DRAWV[c.k]&&DRAWV[c.k]>=G.lastVal)?['r']:[];
    return(isWild(c)||matches(c,t))?['r']:[]}
  if(m==='spin'||m==='classic'){
    if(c.k==='swild')return['r'];
    if(c.k==='wild4')return m==='classic'?['r']:p.hand.some(h=>h!==c&&h.c===t.c)?[]:['r'];
    return matches(c,t)?['r']:[]}
  if(c.k==='wflip')return['r'];
  if(isWild(c))return(c.flex&&p.power)?['r','f']:['r'];
  const reg=matches(c,t),s=[];
  if(reg)s.push('r');
  if(c.flex&&p.power&&(c.f===t.c||(reg&&c.k!=='num')))s.push('f');
  return s}

const TIPTXT={crown:'Wild. Choose a color. Discard the peak (top card) of your pyramid for free.',quake:'Wild. Choose a color. The next player\'s pyramid is scrambled.',excavate:'Wild. Choose a color, then move any pyramid card to your reserve, where it is always playable.',landslide:'Wild. Choose a color. The next player draws 2 and is skipped.',elevator:'Wild. Choose a color. Your peak card swaps with the next player\'s peak.',freespace:'Wild. Choose a color, then clear any one card on your Bingo card for free.',reroll:'Wild. Choose a color. Shuffle your own Bingo card to line cards up.',mixup:'Wild. Choose a color. The next player\'s Bingo card is shuffled.',daub:'Wild. Choose a color. Your next Bingo makes everyone else draw 2.',jam:'Wild. Choose a color. The next player\'s next Bingo is jammed (no payout).',spotlight:'Wild. Choose a color, then pick which of your cards is on display.',tradeup:'Wild. Choose a color. Your display card swaps with the next player\'s.',padlock:'Wild. Choose a color. Your display card can\'t be raided until your next turn.',pickpocket:'Wild. Choose a color. Take the next player\'s display card (they draw 1).',floodlight:'Wild. Choose a color. Every opponent puts a card of that color on display if they can.',anchor:'Wild. Choose a color. Your hand skips the next hand rotation.',backspin:'Wild. Choose a color. The hand rotation reverses direction.',clone:'Wild. Choose a color. Copy one card in your hand (handy for completing a set).',callout:'Wild. Choose a color and a number. Every other player holding that number draws 1.',fourleaf:'Wild. Choose a color. Next turn you get TWO lucky cards.',curse:'Wild. Choose a color. The next player gets no lucky card on their next turn.',dig:'Wild. Choose a color, then send the top card of one of your stacks to the bottom.',topple:'Wild. Choose a color. The top card of each of the next player\'s stacks goes to the bottom.',aim:'Wild. Choose a color, then pick a card: your window starts there next turn.',jolt:'Wild. Choose a color. The next player\'s window jumps to a random spot.',block:'Wild. Choose a color. The next card passed to you is refused and goes back to the sender.',dump:'Wild. Choose a color. This turn you pass TWO cards instead of one.',freeze:'Wild. Choose a color. The next player cannot play cards of that color this turn.',cswap:'Wild. Choose a color. Swap one of your cards for any card from any player (their hands are face-up).',slide:'Wild. Choose a color, then move any card from your hand to either end of your row.',scramble:'Wild. Choose a color. The next player\'s row is shuffled.',tagin:'Wild. Choose a color. The next player is skipped, so your partner goes next.',dteam:'Wild. Choose a color. Every opponent draws 1.',poster:'Wild. Choose a color, then set the Bounty to any color and number you like.',heist:'Wild. Choose a color. Steal one random card from the next player.',rewind:'Wild. Choose a color. The last card played goes back to its owner (its effects still happen).',ff:'Wild. Choose a color and take another turn right away.',echo:'Wild. Choose a color. The last Skip, Reverse or Draw Two effect happens again.',jackpot:'Wild. Choose a color, then flip the top 3 cards of the deck. Cards matching that color are discarded for free and the rest join your hand.',insure:'Wild. Choose a color. Your next failed Gamble is discarded instead of taken (Shield).',meteor:'Burns every Star in the row and refills it. The next player is skipped.',vent:'Wild. Choose a color. Resets the Mass to 0.',surge:'Wild. Choose a color. The next card played counts double Mass.',worbit:'Wild. Choose a color, then the Sun and Moon piles swap places.',disc2:'Play it with one more card of the same color from your hand (the second card shows on top). Counts as one press on the pile.',wclear:'Wild. Resets that pile\'s Card Counter to green. The next card played there sets the color.',wgive:'Wild. If it overloads the pile, give the cards you must draw to any players. The next card played there sets the color.',skip:'The next player loses their turn.',rev:'Reverses the direction of play. With 2 players it works like a Skip.',draw2:'The next player draws 2 and loses their turn.',draw4:'Adds +4 to the draw stack. The next player must stack a draw card or take it.',discall:'Discard every card of this color from your hand.',skipall:'Skip every other player and take another turn.',wrev4:'Wild. Reverses direction, then the next player faces +4 (stackable). With 2 players it comes back to you.',wd6:'Wild. The next player faces +6 (stackable).',wd10:'Wild. The next player faces +10 (stackable).',roul:'Wild. The next player picks a color, then flips cards from the deck until that color shows up and keeps them all.',swild:'Wild. Play it any time and choose the next color.',wild4:'Wild Draw Four. Choose a color. The next player draws 4 and loses their turn.',wildc:'Wild Challenge. Choose a color. Everyone else lays a card face down claiming that color, and the next player may flip one.',wflip:'Wild. Choose a color. Every player flips their Power card.',wt2:'Wild. Regular side: a classic wild. Flex side: a player you choose draws 2.',wall:'Wild. Regular side: a classic wild. Flex side: every other player draws 2.',wd4:'Wild Draw Four. Regular side: next player draws 4 (or challenges). Flex side: a player you choose draws 4.',hit2:'The next player hits the launcher twice, then their turn is over.',trade:'You must trade hands with a player you choose. It can\'t be your last card.',allhit:'Wild. Choose a color. Every other player hits the launcher once.',hitfire:'Wild. Choose a color. The next player keeps hitting the launcher until cards fire, then loses their turn.',awild:'Does nothing, but it is one less card in your hand.',arev:'Reverses the direction of play.',askip:'The next player loses their turn.',askip2:'The next two players lose their turns.',adraw2:'The next player draws 2 and loses their turn.',adraw4:'The next player draws 4 and loses their turn.',at2:'A player you choose draws 2 and keeps their turn.',aswap:'You must swap hands with a player you choose.',dare:'The next player draws 2, or does the dare for this number.',wdare:'Wild. Choose a color. The next player draws 2, or does the dare for this number.',pt:'Everyone points at a player. Each player draws one card per person pointing at them (max 5).',dtog:'Wild. Link two players: when one draws, the other draws the same amount. Point Taken ends the link.',pileup:'Wild. Flip a mini-pile from the deck. Players must pass it on with cards of that color, and whoever can\'t takes the whole pile.',align:'Wild. Choose a color: both piles turn that color, which sets off an Eclipse if they weren\'t matching.',orbit:'The Sun and Moon piles swap places.'};
function tipLines(c){
  const m=G?G.mode:'',k=c.k,L=[];
  if(k==='num'){
    L.push('Match by color or number.');
    if(SW()&&c.n===7)L.push('7: swap hands with a player you choose.');
    if(SW()&&c.n===0)L.push('0: everyone passes their hand in the direction of play.');
    if(c.spin)L.push('🌀 Spin card: after you play it, the next player spins the wheel.');
    if(c.flip)L.push('⟳ After you play it, flip your Power card.');
    if(c.flex)L.push(`⚡ Flex card: with Power ON you can play it as ${CN[c.f]}.`)
  }else{
    let t=TIPTXT[k]||'';
    if((m==='mercy'||m==='eclipse')&&k==='draw2')t='Adds +2 to the draw stack. The next player must stack a draw card of 2 or more, or take it.';
    if(m==='triple'&&k==='swild')t='Wild. Playable on any lit pile. The next card played there sets the color.';
    if(m==='eclipse'&&k==='wild4')t='Wild. Choose a color. Adds +4 to the draw stack.';
    if(m==='liars'&&k==='wild4')t='Wild Draw Four. Played face down. It\'s honest only if you hold no card of the current color.';
    if(m==='dare'&&(k==='dare'||k==='wdare')&&G.dares&&c.d)t+=' Dare: '+G.dares[c.d-1];
    L.push(t);
    if(c.c&&!['discall','skipall'].includes(k))L.push('Matches by color or symbol.');
    if(c.flex&&['skip','rev','draw2'].includes(k)){
      const fx={skip:'skip everyone, so you go again',rev:'reverse and skip the next player',draw2:'every other player draws 1'}[k];
      L.push(`⚡ Flex side (Power ON): ${fx}. It matches ${CN[c.f]}.`)}
  }
  if(m==='overload'){const v=k==='num'?c.n:(['swild','vent','surge'].includes(k)?0:5);L.push(`Adds ${v} to the Mass (limit ${LIMIT}).`)}
  if(m==='bounty'&&G.bounty&&k==='num'&&c.c===G.bounty.c&&c.n===G.bounty.n)L.push('💰 This is the Bounty card! Play it to cash in.');
  if(m==='collector'&&k==='num'&&G){const cnt=G.players[0].hand.filter(h=>h.k==='num'&&h.n===c.n).length;if(cnt)L.push(`You hold ${cnt} card${cnt===1?'':'s'} numbered ${c.n}. Three vanish.`)}
  if(m==='lucky'&&G&&G.players[0].lucky&&G.players[0].lucky.includes(c.id))L.push('🍀 Lucky card! It can be played on anything this turn.');
  if(m==='twin'&&c.side)L.push(`In your ${c.side==='L'?'Left':'Right'} hand.`);
  if(c.liar)L.push('🎭 Liar card: always played face down. You may bluff.');
  if(G&&typeof SCORED==='function'&&SCORED()&&G.scores)L.push(`Worth ${cardPts(c)} points if left in a hand.`);
  return L}
const tipHTML=c=>`<b>${esc(desc(c))}</b>${tipLines(c).filter(Boolean).map(x=>`<div>${esc(x)}</div>`).join('')}`;
function cardHTML(c,dim){
  const raw=String(lab(c)),l=(c.k==='num'&&(c.n===6||c.n===9))?`<u>${c.n}</u>`:raw,s=c.c?SH[c.c]:'✦';
  return `<div class="card ${c.c||'W'} ${c.liar?'liar':''} ${c.spin?'spin':''} ${dim?'dim':''}" data-id="${c.id}" ${dim===undefined?'':'tabindex="0"'} data-tip="${esc(tipHTML(c))}" aria-label="${esc(desc(c))}"><b class="cn">${s}</b><span class="big ${raw.length>2?'sm':''}">${l}</span><b class="cm">${s}</b>${c.liar?'<em class="lb">🎭</em>':c.spin?'<em class="lb">🌀</em>':c.flip?'<em class="lb">⟳</em>':''}${c.f?`<i class="fx ${c.f}">${SH[c.f]}</i>`:''}</div>`}
function render(){
  if(!G)return;
  const me=G.players[0],myTurn=G.humanTurn,M=G.mode==='mercy';
  $('#opps').innerHTML=G.players.slice(1).map((p,i)=>`<div class="opp ${G.cur===i+1?'act':''} ${p.out?'out':''} ${G.mode==='open'?'openp':''}"><div class="av">${p.out?'💥':p.av}</div><div class="nm">${p.name}${G.links&&G.links.includes(p)?' 🔗':''}${G.mode==='gambit'&&p.shield?' 🛡️':''}${G.mode==='duo'&&p.team===0?' 🤝':''}${G.mode==='potato'&&p.blockNext?' 🚫':''}</div>${p.out?'<div class="ct">out</div>':`${G.mode==='open'?`<div class="open">${sortHand(p.hand).map(c=>cardHTML(c)).join('')}</div>`:`<div class="fan">${'<i></i>'.repeat(Math.min(p.hand.length,8))}</div>`}<div class="ct">${p.hand.length} card${p.hand.length===1?'':'s'}${G.mode==='flex'?(p.power?' · ⚡':' · ⭕'):''}${G.mode==='twin'?` (${p.hand.filter(h=>h.side==='L').length}+${p.hand.filter(h=>h.side==='R').length})`:''}${G.mode==='vault'&&p.vault?` +🔒${p.vault.length}`:''}${G.mode==='duo'?(p.team===0?' (shared with you)':' (team hand)'):''}${G.mode==='bingo'?` · 🎯${p.bingos?p.bingos.size:0}`:''}</div>${G.mode==='showcase'?showHTML(p):''}`}</div>`).join('');
  $('#drawPile').innerHTML=`<span>${G.deck.length}</span>`;
  $('#drawPile').classList.toggle('ready',!!myTurn&&!G.drew);
  if(G.mode==='triple')$('#discard').innerHTML=`<div class="twin">${G.piles.map((pl,i)=>`<div class="${G.lit.includes(i)?'litp':'unlit'}"><div class="pl">${pileName(i)} ${lampDot(pl)}</div>${cardHTML(pl.card)}<div class="pc" style="border-color:${pl.wild?'#fff':'var(--'+pl.c+')'}">${pl.wild?'any card':SH[pl.c]+' '+CN[pl.c]}</div></div>`).join('')}</div>`;
  else if(G.mode==='eclipse')$('#discard').innerHTML=`<div class="twin">${G.piles.map((pl,i)=>`<div><div class="pl">${i?'☾ Moon':'☀ Sun'}</div>${cardHTML(pl.card)}<div class="pc" style="border-color:var(--${pl.c})">${SH[pl.c]} ${CN[pl.c]}</div></div>`).join('')}</div>`;
  else $('#discard').innerHTML=G.topFace?cardHTML(G.topCard):`<div class="card back"><span>🎭</span></div>`;
  const t=G.top,col=t.c?`var(--${t.c})`:'#fff';
  $('#claim').textContent=(G.topFace?'':'Claimed: ')+`${SH[t.c]} ${t.k==='wild'?CN[t.c]:desc(t)}`;
  $('#claim').style.background=t.c?`color-mix(in srgb,${col} 35%,#10122e)`:'#10122e';
  $('#claim').style.borderColor=col;
  $('#meter').innerHTML=G.mode==='overload'?`<div class="mbar"><i style="width:${Math.min(100,G.mass/LIMIT*100)}%;background:${G.mass>=LIMIT-9?'#ff4f6d':G.mass>=LIMIT*.5?'#ffc43a':'#35d49a'}"></i></div>`:'';
  if(G.mode==='bounty'&&G.bounty)$('#meter').innerHTML=`<div class="bounty">💰 Bounty: ${SH[G.bounty.c]} ${CN[G.bounty.c]} ${G.bounty.n}</div>`;
  if(G.mode==='allwild'||G.mode==='eclipse'||G.mode==='triple'){$('#claim').textContent='';$('#claim').style.display='none'}else $('#claim').style.display='';
  $('#dir').textContent=G.dir===1?'↻ clockwise':'↺ counter-clockwise';
  let mi='';
  if(M)mi=G.pending>0?`Draw stack: +${G.pending}. Beat +${G.lastVal} or take it.`:(me.out?'You are out!':`Out at 25 cards (you: ${me.hand.length})`);
  if(G.mode==='flex')mi=me.power?'⚡ Power ON: flex sides available':'⭕ Power OFF: regular sides only';
  if(SCORED())mi=`Round ${G.round}: ${G.players.map((p,i)=>`${p.human?'You':p.name} ${G.scores[i]}`).join(' · ')} (to 500)`;
  if(G.mode==='eclipse')mi=G.pending>0?`Draw stack: +${G.pending}. Beat +${G.lastVal} or take it.`:'Match either pile. Line up both colors for an Eclipse!';
  if(G.mode==='overload')mi=`⚡ Mass ${G.mass}/${LIMIT}${G.dbl?' (next card ×2!)':''}`;
  if(G.mode==='twin')mi='Alternate hands. Empty both to win.';
  if(G.mode==='open')mi=G.frozen?`❄️ ${nm(G.frozen.who)} can't play ${CN[G.frozen.c]} this turn`:'Everyone\'s cards are face-up. Plan around what you see!';
  if(G.mode==='bookends')mi='Only your two end cards can be played.';
  if(G.mode==='duo')mi='One team, one hand. Empty the team hand to win.';
  if(G.mode==='stacks')mi='Three stacks. Only the top card of each can be played.';
  if(G.mode==='carousel')mi='Only the 3 highlighted cards play. The window moves every turn.';
  if(G.mode==='roundabout'){const n=aliveCount(),k=n-(G.turns%n);mi=`🎡 Hands rotate ${G.rot===1?'forward':'backward'} in ${k} turn${k===1?'':'s'}${me.anchor?' (⚓ you keep yours)':''}`}
  if(G.mode==='pyramid')mi='Only free cards play: nothing on top. The reserve is always free.';
  if(G.mode==='bingo')mi='Clear a row, column or diagonal: everyone else draws!';
  if(G.mode==='showcase')mi=me.lock?'🔒 Your display card is padlocked.':'Click an opponent\'s display card to raid it.';
  if(G.mode==='collector')mi='🧺 Three of a number vanish at the start of your turn.';
  if(G.mode==='lucky')mi=me.lucky&&me.lucky.length?'🍀 Your lucky card glows: it plays on anything!':'🍀 One lucky card each turn plays on anything.';
  if(G.mode==='potato')mi=me.blockNext?'🚫 You will refuse the next card passed to you. Remember: play one, pass one.':'Remember: play one, pass one.';
  if(G.mode==='bounty')mi='Play the Bounty card to make everyone else draw 1 and shed a card.';
  if(G.mode==='chrono')mi='Rewind, Fast-Forward and Echo bend time.';
  if(G.mode==='gambit')mi=me.shield?'🛡️ Shield on: your next failed gamble is absorbed':'After each play you may gamble on the top card.';
  if(G.mode==='observatory')mi='Pick a Star to take it, or draw blind.';
  if(G.mode==='vault')mi=`🔒 Your vault: ${me.vault.length} card${me.vault.length===1?'':'s'}`;
  if(G.mode==='triple')mi=`Lit piles: ${G.lit.map(i=>i+1).join(', ')}. Can't play? You press a pile!`;
  if(G.mode==='party')mi=G.links?`🔗 Linked: ${G.links.map(nm).join(' + ')}`:'Speed Play: match number + color to jump in';
  if(G.mode==='dare')mi=me.dare?`🎯 Your dare: ${me.dare}`:`Dare list: ${DARENAMES[G.dareList]}`;
  $('#modeinfo').textContent=mi;
  const sorted=[...me.hand].sort((a,b)=>(COLORS.indexOf(a.c)<0?9:COLORS.indexOf(a.c))-(COLORS.indexOf(b.c)<0?9:COLORS.indexOf(b.c))||(a.n??20)-(b.n??20)||a.k.localeCompare(b.k));
  $('#starrow').innerHTML=G.mode==='observatory'?`<span class="lbl">🔭 Stars: take one instead of drawing blind</span>${G.row.map(c=>cardHTML(c,(myTurn&&!G.drew)?!sidesFor(me,c,true).length:false)).join('')}`:'';
  const hc=c=>{let dim=false;if(myTurn)dim=G.drew?c!==G.drew:!sidesFor(me,c).length;return cardHTML(c,G.laying?false:myTurn?dim:false)};
  if(G.mode==='twin')$('#hand').innerHTML=['L','R'].map(sd=>`<div class="hgrp ${me.act===sd?'act':''}"><div class="hl">${sd==='L'?'🤚 Left hand':'✋ Right hand'}${me.act===sd?' · active':''}</div><div class="hcards">${sorted.filter(c=>c.side===sd).map(hc).join('')||'<span class="note">empty</span>'}</div></div>`).join('');
  else if(G.mode==='pyramid'){
    const at=pos=>me.hand.find(h=>h.pos===pos),row=(a,b)=>`<div class="prow">${Array.from({length:b-a+1},(_,i)=>{const c=at(a+i);return c?hc(c):'<div class="phold"></div>'}).join('')}</div>`;
    const res=me.hand.filter(h=>h.pos<0);
    $('#hand').innerHTML=`<div class="pyr">${row(0,0)}${row(1,2)}${row(3,5)}${row(6,9)}</div>`+(res.length?`<div class="hgrp"><div class="hl">Reserve · always playable</div><div class="hcards pyr">${res.map(hc).join('')}</div></div>`:'')}
  else if(G.mode==='bingo'){
    const at=g=>me.hand.find(h=>h.gp===g),cell=g=>{const c=at(g);return c?hc(c):'<div class="phold"></div>'};
    const res=me.hand.filter(h=>h.gp<0);
    $('#hand').innerHTML=`<div class="hgrp pyr"><div class="hl">🎯 Your Bingo card · lines cleared: ${me.bingos.size}/8</div><div class="grid3">${[0,1,2,3,4,5,6,7,8].map(cell).join('')}</div></div>`+(res.length?`<div class="hgrp"><div class="hl">Reserve</div><div class="hcards pyr">${res.map(hc).join('')}</div></div>`:'')}
  else if(G.mode==='stacks')$('#hand').innerHTML=[0,1,2].map(k=>{const cs=me.hand.filter(h=>h.stk===k);return `<div class="hgrp"><div class="hl">Stack ${k+1} · ${cs.length} card${cs.length===1?'':'s'}</div><div class="scol">${cs.length?hc(cs[cs.length-1]):'<span class="note">empty</span>'}${cs.length>1?`<div class="sbks">${'<i></i>'.repeat(Math.min(cs.length-1,4))}</div>`:''}</div></div>`}).join('');
  else if(G.mode==='carousel')$('#hand').innerHTML=`<div class="hl2">🎠 only the 3 highlighted cards can be played · the window moves 3 cards after every turn</div>`+me.hand.map((c,i)=>`<div class="slot ${(me.hand.length<=3||mod(i-me.ptr,me.hand.length)<3)?'endslot':''}">${hc(c)}</div>`).join('');
  else if(G.mode==='bookends')$('#hand').innerHTML=`<div class="hl2">◀ left end · only the two highlighted end cards can be played · right end ▶</div>`+me.hand.map((c,i)=>`<div class="slot ${i===0||i===me.hand.length-1?'endslot':''}">${hc(c)}</div>`).join('');
  else if(G.mode==='duo')$('#hand').innerHTML=`<div class="hgrp"><div class="hl">🤝 Team hand, shared with ${G.players.filter(q=>q.team===0&&q!==me).map(q=>q.name).join(' & ')}</div><div class="hcards">${sorted.map(hc).join('')}</div></div>`;
  else if(G.mode==='vault')$('#hand').innerHTML=`<div class="hgrp"><div class="hl">Hand</div><div class="hcards">${sorted.map(hc).join('')||'<span class="note">empty: your vault opens next turn</span>'}</div></div>`+(me.vault.length?`<div class="hgrp"><div class="hl">🔒 Vault (${me.vault.length})</div><div class="hcards">${me.vault.map(()=>'<div class="card back" data-tip="&lt;b&gt;Vault card&lt;/b&gt;&lt;div&gt;Hidden. When your hand is empty you open these blind, one per turn.&lt;/div&gt;"><span>🔒</span></div>').join('')}</div></div>`:'');
  else $('#hand').innerHTML=sorted.map(hc).join('');
  if(G.mode==='showcase'&&me.show){const el=document.querySelector(`#hand .card[data-id="${me.show}"]`);if(el)el.classList.add('onshow')}
  if(G.mode==='lucky'&&myTurn&&me.lucky)me.lucky.forEach(id=>{const el=document.querySelector(`#hand .card[data-id="${id}"]`);if(el)el.classList.add('lucky')});
  if(armed){const el=document.querySelector(`#hand .card[data-id="${armed}"], #starrow .card[data-id="${armed}"]`);if(el)el.classList.add('armed')}
  const anyLegal=!!myTurn&&me.hand.some(c=>sidesFor(me,c).length);
  $('#drawBtn').textContent=G.mode==='observatory'?'Draw blind':M?(G.pending>0?`Take ${G.pending} cards`:'Draw until playable'):(G.mode==='eclipse'&&G.pending>0)?`Take ${G.pending} cards`:G.mode==='attack'?'Hit the launcher':'Draw a card';
  $('#drawBtn').disabled=!myTurn||!!G.drew||(M&&G.pending===0&&anyLegal);
  $('#passBtn').disabled=!myTurn||!G.drew||M;
}

/* ---------- modals ---------- */
function modal(html){const m=$('#modal');m.innerHTML=`<div class="box">${html}</div>`;m.classList.add('on');m.onclick=null;return m}
function closeModal(){$('#modal').classList.remove('on')}
function pickColor(msg,only){return new Promise(r=>{modal(`<h2>${msg}</h2><div class="cols">${(only||COLORS).map(c=>`<button class="cb ${c}" data-c="${c}">${SH[c]} ${CN[c]}</button>`).join('')}</div>`).onclick=e=>{const b=e.target.closest('[data-c]');if(b){closeModal();r(b.dataset.c)}}})}
function pickEnd(){return new Promise(r=>{modal(`<h2>Move it to which end?</h2><div class="cols"><button data-v="1">◀ Left end</button><button data-v="0">Right end ▶</button></div>`).onclick=e=>{const b=e.target.closest('[data-v]');if(b){closeModal();r(b.dataset.v==='1')}}})}
function pickPlayer(msg){return new Promise(r=>{
  const os=others(G.players[0]).filter(q=>!(G.mode==='duo'&&q.team===0));if(os.length===1)return r(os[0]);
  modal(`<h2>${msg||'Choose a player'}</h2><div class="cols">${os.map(p=>`<button data-i="${G.players.indexOf(p)}">${p.av} ${p.name} (${p.hand.length})</button>`).join('')}</div>`).onclick=e=>{const b=e.target.closest('[data-i]');if(b){closeModal();r(G.players[+b.dataset.i])}}})}
function pickLaid(laid,col){return new Promise(r=>{modal(`<h2>Wild Challenge: ${CN[col]}</h2><p>Everyone claims their card is ${CN[col]}. Flip one to check?</p><div class="cols">${laid.map((l,i)=>`<button data-i="${i}">Flip ${l.q.name}'s card</button>`).join('')}<button data-i="-1">No challenge</button></div>`).onclick=e=>{const b=e.target.closest('[data-i]');if(b){closeModal();r(laid[+b.dataset.i]||null)}}})}
const FXTXT={skip:'Skip ALL others: you go again',rev:'Reverse, then skip the next player',draw2:'Every other player draws 1',wt2:'A player you choose draws 2',wall:'Every other player draws 2',wd4:'A player you choose draws 4'};
function pickSide(c){return new Promise(r=>{modal(`<h2>${desc(c)}</h2><p>Which side do you play?</p><div class="cols" style="flex-direction:column"><button data-s="r">Regular side${isWild(c)?': classic wild':''}</button><button data-s="f">⚡ Flex side (uses your Power): ${FXTXT[c.k]||'color '+CN[c.f]}</button></div>`).onclick=e=>{const b=e.target.closest('[data-s]');if(b){closeModal();r(b.dataset.s)}}})}
function askChallenge(p){return new Promise(r=>{modal(`<h2>${p.name} played a Wild Draw 4</h2><p>Draw 4 and lose your turn, or challenge? If they held a card matching the color, they draw 4 instead. If not, you draw 6.</p><div class="cols"><button data-v="0">Draw 4</button><button data-v="1">Challenge!</button></div>`).onclick=e=>{const b=e.target.closest('[data-v]');if(b){closeModal();r(b.dataset.v==='1')}}})}

function pickNumber(nums,title){return new Promise(r=>{modal(`<h2>${title||'Discard Number: pick a number'}</h2><div class="cols">${nums.map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>`).onclick=e=>{const b=e.target.closest('[data-n]');if(b){closeModal();r(+b.dataset.n)}}})}
function pickCards(msg,cards,min,max,pre=[]){return new Promise(r=>{
  let sel=pre.map(c=>c.id);
  const paint=()=>{
    const ok=sel.length>=min&&sel.length<=max;
    modal(`<h2>${msg}</h2><div class="pickrow">${cards.map(c=>cardHTML(c,!sel.includes(c.id))).join('')}</div><div class="cols"><button id="ok" ${ok?'':'disabled'}>Confirm (${sel.length})</button></div>`).onclick=e=>{
      const cd=e.target.closest('.card');
      if(cd){const id=+cd.dataset.id;if(sel.includes(id))sel=sel.filter(x=>x!==id);else{if(sel.length>=max&&max===1)sel=[];if(sel.length<max)sel.push(id)}paint();return}
      if(e.target.id==='ok'&&ok){closeModal();r(cards.filter(c=>sel.includes(c.id)))}}};
  paint()})}
function pickTwo(){return new Promise(r=>{let sel=[];const paint=()=>{modal(`<h2>Link two players 🔗</h2><p class="note">Whenever one of them draws, the other draws the same amount. A Point Taken ends the link.</p><div class="cols">${G.players.map((q,i)=>`<button data-i="${i}" style="${sel.includes(i)?'background:#7d5cff':''}">${nm(q)} (${q.hand.length})</button>`).join('')}</div><div class="cols"><button id="ok" ${sel.length===2?'':'disabled'}>Link them</button></div>`).onclick=e=>{const b=e.target.closest('[data-i]');if(b){const i=+b.dataset.i;sel=sel.includes(i)?sel.filter(x=>x!==i):sel.length<2?[...sel,i]:[sel[1],i];paint();return}if(e.target.id==='ok'&&sel.length===2){closeModal();r(sel.map(i=>G.players[i]))}}};paint()})}
const PLET=i=>'abc'[i];
const pileName=i=>G.mode==='eclipse'?(i?'☾ Moon':'☀ Sun'):`Pile ${i+1}`;
const ratio=pl=>pl.count/pl.limit;
const lampColor=pl=>ratio(pl)<.5?'#35d49a':ratio(pl)<.8?'#ffc43a':'#ff4f6d';
const lampDot=pl=>`<span style="color:${lampColor(pl)}">●</span>`;
const pileDesc=pl=>pl.wild?'any card (wild)':`${SH[pl.c]} ${CN[pl.c]}${pl.k==='num'?' '+pl.n:(pl.k&&pl.k!=='wild'?' '+KN[pl.k]:'')}`;
function pickPile(c){return new Promise(r=>{const ok=sidesFor(G.players[0],c);modal(`<h2>${desc(c)}</h2><p>Which pile do you play on?</p><div class="cols" style="flex-direction:column">${G.piles.map((pl,i)=>`<button data-s="${PLET(i)}" ${ok.includes(PLET(i))?'':'disabled'}>${pileName(i)}${G.mode==='triple'?' '+lampDot(pl):''}: ${pileDesc(pl)}</button>`).join('')}</div>`).onclick=e=>{const b=e.target.closest('[data-s]');if(b&&!b.disabled){closeModal();r(b.dataset.s)}}})}
function pickLitPile(){return new Promise(r=>{
  if(G.lit.length===1)return r(G.lit[0]);
  modal(`<h2>No play: press a pile</h2><p>You must press a lit pile to activate its counter. Pick one that looks safe!</p><div class="cols" style="flex-direction:column">${G.lit.map(i=>`<button data-i="${i}">${pileName(i)} ${lampDot(G.piles[i])}</button>`).join('')}</div>`).onclick=e=>{const b=e.target.closest('[data-i]');if(b){closeModal();r(+b.dataset.i)}}})}
function showHand(q){return new Promise(r=>{modal(`<h2>${q.name} shows their hand</h2><div class="pickrow">${q.hand.map(c=>cardHTML(c)).join('')}</div><div class="cols"><button id="ok">OK</button></div>`).onclick=e=>{if(e.target.id==='ok'){closeModal();r()}}})}
async function showCards(title,items,ms){modal(`<h2>${title}</h2><div class="pickrow">${items.map(([n,c])=>`<div style="text-align:center"><div style="font-size:13px;margin-bottom:4px">${n}</div>${cardHTML(c)}</div>`).join('')}</div>`);await sleep(ms);closeModal()}
function askDare(d,text){return new Promise(r=>{modal(`<h2>Dare #${d}</h2><p style="font-size:18px">${esc(text)}</p><p class="note">Draw 2 cards, or do the dare until your next turn. Your turn is used up either way.</p><div class="cols"><button data-v="dare">Do the dare</button><button data-v="draw">Draw 2</button></div>`).onclick=e=>{const b=e.target.closest('[data-v]');if(b){closeModal();r(b.dataset.v)}}})}
function askJudge(p){return new Promise(r=>{modal(`<h2>${p.human?'Dare check':p.name+"'s dare"}</h2><p style="font-size:18px">${esc(p.dare)}</p><p>${p.human?'Did you complete it?':'Did '+p.name+' pull it off? You\'re the judge.'}</p><div class="cols"><button data-v="1">${p.human?'Yes, I did it':'Nailed it'}</button><button data-v="0">${p.human?'No, I failed':'Failed (draws 2)'}</button></div>`).onclick=e=>{const b=e.target.closest('[data-v]');if(b){closeModal();r(b.dataset.v==='1')}}})}
async function resolveDare(q,d){
  const text=G.dares[d-1];
  if(q.human){
    if(await askDare(d,text)==='dare'){q.dare=text;log(`You take dare #${d}`)}else{draw(q,2);log('You draw 2 instead of the dare')}
  }else if(Math.random()<.5){q.dare=text;log(`${q.name} takes dare #${d}: ${text}`)}
  else{draw(q,2);log(`${q.name} draws 2 instead of the dare`)}}
async function judgeDare(p){
  const ok=await askJudge(p);p.dare=null;
  if(ok)log(`${p.human?'You':p.name} completed the dare!`);
  else{log(p.human?'You failed the dare and draw 2':`${p.name} failed the dare and draws 2`);draw(p,2)}
  render();await sleep(500)}
const RULES={
pyramid:`<p><b>Remember it: only free cards play.</b> Your hand is a pyramid of 10 cards (4 on the bottom, then 3, 2, 1). A card is <b>free</b> when no card sits on top of it. Be first to get rid of all your cards.</p><ul>
<li>You may play any free card that matches the top card by color, number or symbol. Freeing the bottom row opens the cards above.</li>

<li><b>Wild Excavate ⛏️:</b> move any pyramid card to your reserve.</li>
<li><b>Wild Landslide 🪨:</b> the next player draws 2 and is skipped.</li>
<li><b>Wild Elevator 🛗:</b> your peak swaps with the next player's peak.</li>

<li>Each line only pays out once. Drawn cards go to your reserve and don't sit on the card.</li>

showcase:`<p><b>Remember it: one card on display, anyone can raid it.</b> One card from each hand sits face-up on display (marked 🪟). On your turn you can play a card from your hand <i>or raid someone's display card</i> if it matches. Be first to get rid of all your cards.</p><ul>

roundabout:`<p><b>Remember it: hands rotate every lap.</b> Once everyone has taken a turn, all hands pass one seat along. You'll never keep the same cards for long. Be first to get rid of all your cards.</p><ul>

<li><b>Overload 💥:</b> when a pile fills up, the player who caused it draws 1 to 4 cards and the pile resets. You can't go out on an overloading card.</li>
<li><b>Can't play?</b> Draw one card and play it if you can. If you still can't (or choose not to), you must press a lit pile to bump its counter.</li>
<li><b>Discard Two of the Same Color:</b> play it with one more card of that color from your hand. It counts as one press.</li>
<li><b>Wild:</b> play it on any lit pile. The next card played there sets the color.</li>
<li><b>Wild Clear 🧹:</b> resets that pile's counter to green.</li>
<li><b>Wild Give Away 🎁:</b> if it overloads the pile, give the cards you'd draw to any players.</li>
<li>Reverse and Skip work as usual. Scoring: numbers at face value, Reverse and Skip 20, Discard Two 30, Wilds 50. Timer Mode isn't included. COSMIC! at one card, or draw 2.</li></ul>`,
eclipse:`<p>A brand-new twist: there are <b>two</b> discard piles, ☀ Sun and ☾ Moon. Be first to get rid of all your cards.</p><ul>
<li><b>On your turn</b> play one card onto either pile, matching that pile's top card by color, number or symbol. If you can't play, draw one card and play it if you can.</li>
<li><b>Eclipse 🌑:</b> when your play makes both piles show the <i>same color</i> (and they didn't before), the next player draws 2 and you shed any one card from your hand.</li>
<li><b>Orbit ⟳:</b> a colored card that swaps the Sun and Moon piles. Handy for setting up or breaking an Eclipse.</li>
<li><b>Wilds galore:</b> Eclipse has extra Wilds: plain Wild, Wild Draw Four, Wild Align and <b>Wild Orbit ✦⟳</b> (choose a color, then the piles swap).</li>
<li><b>Wild Align 🌗:</b> play it any time on either pile and pick a color. <i>Both</i> piles turn that color, which sets off an Eclipse if they weren't matching.</li>
<li><b>Stacking:</b> Draw Two (+2) and Wild Draw Four (+4) add to a shared draw stack. The next player can stack a draw card of equal or higher value (on either pile) or take the whole stack. Taking it ends your turn.</li>
<li><b>0-7 rule:</b> playing a 7 lets you swap hands with any player. Playing a 0 makes everyone pass their hand in the direction of play.</li>
<li><b>Skip and Reverse:</b> as usual. In a 2-player game Reverse works like Skip.</li>
<li><b>Wild:</b> play it on either pile any time and choose a color.</li>
<li><b>COSMIC!</b> Call it at one card or draw 2 if you're caught. First to empty their hand wins.</li></ul>`,
party:`<p>Built for big groups (the real game is 6 to 16 players, so the menu offers 6 to 16). Be first to get rid of all your cards.</p><ul>
<li><b>Match</b> the top card by color, number or symbol. Draw one card if you can't play and play it if you can. You may also draw instead of playing.</li>
<li><b>Speed Play ⚡:</b> if you hold a number card matching both the number and the color of the top card, you can play it out of turn. When it's available you get a short window to hit the button. Then play continues from you.</li>
<li><b>Draw Two, Reverse, Skip, Wild:</b> as in classic play.</li>
<li><b>Point Taken ☝️:</b> everyone points at one other player. Each player draws one card per person pointing at them, up to 5, in turn order. It also ends any link.</li>
<li><b>Wild Pile Up 📚:</b> flip cards from the draw pile into a mini-pile until you get a non-Wild. That card's color continues. The next player must play a card of that color (Wilds count) and pass the pile on. Whoever can't takes the whole mini-pile, and play continues after them.</li>
<li><b>Wild Drawn Together 🔗:</b> pick two players and a color. Whenever one of them draws, the other draws the same amount. Playing a new one replaces the old link, and Point Taken ends it.</li>
<li><b>Wild Draw Four:</b> choose a color. The next player draws 4 and loses their turn, or challenges. Challenge a bluff (the player held a card of the color, Wilds count) and they draw 4. Challenge wrongly and you draw 6.</li>
<li><b>COSMIC!</b> Call it at one card or draw 2 if you're caught. The first player to play their last card wins.</li></ul>`,
dare:`<p>Be first to get rid of your cards each round and score points for what's left in everyone else's hands. First to 500 wins.</p><ul>
<li><b>Pick a Dare List</b> on the menu: Family, Showoff, Daredevil, or House Rules where you write your own (one per line). Each list has 15 dares.</li>
<li><b>Match</b> the top card by color, number or symbol. Draw one card if you can't play, and play it if you can.</li>
<li><b>Dare card:</b> the next player must draw 2 cards, or do the dare matching the number on the card. It can go on a matching color or another Dare card.</li>
<li><b>Wild Dare:</b> same, and you also choose the color. You can play it any time.</li>
<li>Choosing the dare or drawing both use up that player's turn.</li>
<li><b>Doing a dare:</b> it lasts until your next turn. Then the group judges whether you pulled it off. Fail and you draw 2. When a bot takes a dare, you're the judge.</li>
<li><b>Reverse and Skip</b> work as usual. In a 2-player game Reverse acts like Skip.</li>
<li><b>COSMIC!</b> Call it at one card or draw 2 if you're caught.</li>
<li><b>Scoring:</b> numbers at face value, Reverse, Skip and Dare 20, Wild Dare 50. A final Dare still gets resolved and counted.</li></ul><p class="note">Please keep dares safe and only do what you're comfortable with.</p>`,
attack:`<p>There's no draw pile to pick from. Instead you hit the card launcher and hope. The launcher is simulated: each press fires 0 to 4 cards at you, and most of the time it's a miss. Be first to go out each round and score points from everyone else's hands. First to 500 wins.</p><ul>
<li><b>Match</b> the top card by color, number or symbol, or play a Wild.</li>
<li><b>Can't play, or don't want to?</b> Hit the launcher once. Any cards that shoot out join your hand, and your turn is over either way.</li>
<li><b>Hit 2:</b> the next player hits the launcher twice and their turn is over.</li>
<li><b>Reverse and Skip:</b> as usual. With 2 players Reverse acts like Skip.</li>
<li><b>Discard All:</b> drop every card of its color from your hand (30 points).</li>
<li><b>Trade Hands:</b> you must swap hands with a player you choose. You can't go out on one.</li>
<li><b>Wild:</b> call any color.</li>
<li><b>Wild All Hit:</b> call a color, then every other player hits the launcher once.</li>
<li><b>Wild Hit-Fire:</b> call a color. The next player keeps hitting until cards fire out, takes them, and loses their turn.</li>
<li><b>COSMIC!</b> Call it at one card. If you're caught, you hit the launcher twice.</li>
<li><b>Scoring:</b> numbers at face value, Hit 2, Reverse and Skip 20, Discard All and Trade Hands 30, every Wild 50.</li></ul>`,
allwild:`<p>Every card is wild, so there's no matching. Just play a card. Be first to get rid of all your cards.</p><ul>
<li><b>Wild:</b> does nothing, but at least it's one less card.</li>
<li><b>Wild Reverse:</b> reverses the direction of play.</li>
<li><b>Wild Skip:</b> the next player loses their turn.</li>
<li><b>Wild Skip Two:</b> the next two players lose their turns.</li>
<li><b>Wild Draw Two / Wild Draw Four:</b> the next player draws that many cards and loses their turn.</li>
<li><b>Wild Targeted Draw Two:</b> a player you choose draws 2 and keeps their turn.</li>
<li><b>Wild Forced Swap:</b> you must swap hands with a player you choose. Anyone left with one card must call COSMIC!.</li>
<li><b>Draw instead:</b> you can draw one card rather than play. Then you must play that card or pass.</li>
<li><b>COSMIC!</b> With one card left, call it before someone catches you, or draw 2. Play your last card to win the round.</li></ul>`,
classic:`<p>The original game. Be first to play all your cards each round, then score points for the cards left in everyone else's hands. First to 500 points wins.</p><ul>
<li><b>Match</b> the top card by color, number or word. Draw Two, Reverse and Skip can go on a matching color or the same action.</li>
<li><b>Draw Two:</b> next player draws 2 and loses their turn.</li>
<li><b>Reverse:</b> switches direction of play. With 2 players it works like Skip.</li>
<li><b>Skip:</b> the next player loses their turn.</li>
<li><b>Wild:</b> play it any time and call any color.</li>
<li><b>Wild Draw Four:</b> call a color, and the next player draws 4 and loses their turn. You're only supposed to play it when you hold no card of the current color. If you play it anyway and get challenged, you draw 4. If the challenge was wrong, the challenger draws 6.</li>
<li><b>Can't or won't play?</b> Draw one card. You may play only that card, otherwise your turn ends.</li>
<li><b>Two players:</b> Skip, Reverse, Draw Two and Wild Draw Four all give you another turn.</li>
<li><b>COSMIC!</b> Before your next-to-last card lands, you need to call it. If you're caught before the next player's turn, you draw 4.</li>
<li><b>Scoring:</b> number cards at face value, Draw Two, Reverse and Skip 20, Wild and Wild Draw Four 50. A final Draw Two or Wild Draw Four is still drawn and counted.</li></ul>`,
liars:`<p>Be first to empty your hand. Match the top card by color, number or symbol.</p><ul>
<li><b>Regular cards</b> are played face up and must match.</li>
<li><b>Liar cards 🎭</b> are always played face down. If one doesn't match, you're bluffing: you claim it's a match.</li>
<li><b>Challenge</b> a face-down card before the next turn. Truth: the challenger draws 1. Lie: the liar takes the card back and draws 1. Unchallenged cards stay, and their action happens either way.</li>
<li><b>Can't or won't play?</b> Draw one card. You may play it if you can, otherwise end your turn.</li>
<li><b>+2, Skip, Reverse, Wild Draw 4</b> are all Liar cards. Wild Draw 4 is honest only if you hold no card of the current color.</li>
<li><b>Wild Challenge</b>: pick a color. Everyone else lays one card face down claiming that color. The next player may flip one: if it's right they draw 2, if it's a lie the liar takes it back and draws 1.</li>
<li><b>7</b> swaps hands with a player. <b>0</b> passes every hand in the direction of play.</li>
<li>With one card left, hit <b>COSMIC!</b> before someone catches you. Forget it and you draw 2.</li></ul>`,
mercy:`<p>Be first to empty your hand, or be the last player standing. Match the top card by color, number or symbol.</p><ul>
<li><b>No match?</b> You must draw until you get a card you can play, then play it.</li>
<li><b>Stacking:</b> when someone plays a draw card (+2, +4, +6, +10), you can stack a draw card of equal or higher value on top. If you can't (or won't), you take the whole pile and lose your turn.</li>
<li><b>Mercy:</b> reach 25 cards and you're out.</li>
<li><b>7</b> swaps your hand with a player you choose. <b>0</b> passes every hand in the direction of play.</li>
<li><b>Colored actions:</b> Draw Two, Draw Four, Skip, Reverse (skips the other player in a 2-player game), <b>Discard All</b> (drop every card of its color from your hand) and <b>Skip Everyone</b> (take another turn).</li>
<li><b>Wild Reverse Draw 4</b> reverses play and the next player draws 4 (with 2 players it comes back to you, but you can stack it onward). <b>Wild Draw 6</b> and <b>Wild Draw 10</b> make the next player draw that many and lose their turn.</li>
<li><b>Wild Color Roulette:</b> the next player picks a color, then flips cards from the draw pile until one matches it. They keep every card and lose their turn.</li>
<li>With one card left, hit <b>COSMIC!</b> or draw 2 if you're caught.</li></ul>`,
spin:`<p>Be first to go out each round, then score points for the cards left in everyone else's hands. First player to 500 points wins.</p><ul>
<li><b>Match</b> the top card by color, number or symbol. Draw Two and Skip can go on matching colors or the same action. Wild can be played any time.</li>
<li><b>Can't or won't play?</b> Draw one card. You can only play the card you just drew.</li>
<li><b>Wild Draw Four:</b> next player draws 4 and loses their turn. You can only play it if you have no card matching the color of the top card.</li>
<li><b>Spin cards 🌀</b> are the numbers 1 to 5 with a swirl. When you play one, the next player must spin the wheel instead of taking their turn.</li>
<li><b>Almost:</b> the spinner keeps only 2 cards and discards the rest.</li>
<li><b>Discard Number / Discard Color:</b> the spinner picks a number or color in their hand and may discard those cards.</li>
<li><b>Draw Red / Draw Blue:</b> the spinner draws until they get that color (or a Wild) and keeps everything.</li>
<li><b>Trade Hands:</b> everyone passes their hand in the direction of play. Anyone who ends up with one card must call COSMIC!.</li>
<li><b>Show Hand:</b> the spinner shows their hand to everyone.</li>
<li><b>War:</b> everyone reveals their highest number card. The highest wins and discards it, and ties go again with the next highest. Play continues after the winner.</li>
<li><b>UNO Spin 📣:</b> everyone races to hit the button. The first one discards a card of their choice, and play continues after them.</li>
<li>When several cards are discarded, their owner picks which one lands on top.</li>
<li><b>Scoring:</b> number cards at face value, Draw Two, Reverse and Skip 20, Wild and Wild Draw Four 50. With one card left, hit <b>COSMIC!</b> or draw 2.</li></ul>`,
flex:`<p>Be first to empty your hand. Match the top card by color, number or symbol.</p><ul>
<li><b>Flex cards</b> have a regular side and a flex side with a second color (shown in the small tab at the bottom). Playing the flex side lets you match that second color, but play continues in the card's regular color.</li>
<li><b>Power cards:</b> everyone starts with Power ON (⚡). Use a flex side and your Power flips OFF (⭕). Play a number card with the ⟳ icon to flip it again. When everyone's Power is OFF, all reset to ON.</li>
<li><b>Flex Draw Two:</b> regular is Draw Two. Flex: every other player draws 1 and nobody is skipped.</li>
<li><b>Flex Reverse:</b> regular is Reverse. Flex: reverse and skip the next player.</li>
<li><b>Flex Skip:</b> regular is Skip. Flex: skip everyone, so you go again.</li>
<li><b>Wild All Flip:</b> every player flips their Power card. Call a color.</li>
<li><b>Flex Wild Target Draw 2:</b> regular is a classic wild. Flex: a player you choose draws 2.</li>
<li><b>Flex Wild All Draw:</b> regular is a classic wild. Flex: every other player draws 2.</li>
<li><b>Flex Wild Draw 4:</b> regular side is playable on anything. The next player draws 4 and loses their turn, or challenges. If you held a card matching the color, you draw 4. If not, they draw 6. Flex side: a player you choose draws 4.</li>
<li><b>Can't or won't play?</b> Draw one card. You may play it if you can.</li>
<li>With one card left, hit <b>COSMIC!</b> or draw 2 if you're caught.</li></ul>`};
function showRules(mode,back){modal(`<h2 style="margin-top:0">${MODES[mode].name}: how to play</h2>${RULES[mode]}<p>Colors also have shapes: ● Red, ▲ Gold, ◆ Green, ■ Blue.</p><div class="cols"><button id="closeRules">Got it</button></div>`).onclick=e=>{if(e.target.id==='closeRules'||e.target.id==='modal'){closeModal();if(back)back()}}}
const MODEMETA={classic:['✦','Classic'],liars:['🎭','Bluffing'],mercy:['💀','Brutal'],flex:['🔄','Two-sided'],spin:['🌀','Wheel of chaos'],allwild:['🌈','Anything goes'],attack:['💥','Launcher'],dare:['🎯','Draw 2 or dare'],party:['🎉','Big groups'],eclipse:['🌗','Twin piles'],overload:['⚡','Mass meter'],twin:['🤲','Two hands'],stacks:['🗂️','Play the tops'],roundabout:['🎡','Hands rotate'],pyramid:['🏔️','Free cards'],bingo:['🧩','Clear a line'],showcase:['🪟','On display'],collector:['🧺','Sets vanish'],lucky:['🍀','Lucky card'],carousel:['🎠','Moving window'],potato:['🥔','Pass one on'],open:['🔓','Cards face-up'],bookends:['📖','Ends only'],duo:['🤝','Team hand'],bounty:['💰','Most wanted'],chrono:['⏳','Time tricks'],gambit:['🎲','Risk it'],observatory:['🔭','Face-up draws'],vault:['🔒','Hidden cards'],triple:['🔺','Three piles']};
function showMenu(msg){
  const prev=document.querySelector('#modal .menu-body'),st=prev?prev.scrollTop:0;
  const demo=[{c:'R',k:'num',n:7},{c:'Y',k:'skip'},{c:null,k:'wd10'},{c:'B',k:'draw2'},{c:'G',k:'num',n:3}].map((c,i)=>cardHTML({...c,id:'d'+i,liar:false,flex:false,f:null,flip:false})).join('');
  const cur=MODES[selMode],keys=Object.keys(MODES);
  const ORIG=new Set(['eclipse','overload','twin','vault','observatory','bounty','chrono','gambit','open','bookends','duo','stacks','carousel','potato','roundabout','collector','lucky','pyramid','bingo','showcase']);
  const tile=k=>`<div class="mode ${k===selMode?'sel':''}" data-m="${k}" role="button" tabindex="0" aria-pressed="${k===selMode}"><span class="ic">${MODEMETA[k][0]}</span><b>${MODES[k].name}</b><span class="tg">${MODEMETA[k][1]}</span></div>`;
  const tiles1=keys.filter(k=>!ORIG.has(k)).map(tile).join(''),tiles2=keys.filter(k=>ORIG.has(k)).map(tile).join('');
  const dare=selMode==='dare'?`<div class="sect"><h2>Dare list</h2><div class="cols seg">${Object.entries(DARENAMES).map(([k,n])=>`<button class="${k===selDare?'on':''}" data-d="${k}">${n}</button>`).join('')}</div>${selDare==='house'?`<textarea id="hr" placeholder="Write your own dares, one per line. Dare card #1 uses line 1, #2 uses line 2, and so on up to 15.">${esc(houseText)}</textarea>`:''}</div>`:'';
  modal(`<div class="menu"><div class="menu-body">
  <div class="hero"><div class="demo">${demo}</div><h1>✦ Cosmic Match</h1><p class="sub">${keys.length} ways to play. Hover a card (or tap it once on mobile) to see what it does.</p>${msg?`<div class="msg">${msg}</div>`:''}</div>
  <div class="sect"><h2>Game mode</h2>
  <div class="modes">${tiles1}${tiles2}</div></div>
  ${dare}
  <div class="sect"><h2>Selected mode</h2>
  <div class="detail"><div><b>${MODEMETA[selMode][0]} ${cur.name}</b><p>${cur.d}</p></div><button data-r="${selMode}">How to play</button></div></div>
  <div class="sect"><h2>Opponents</h2><div class="cols seg">${OPPS().map(n=>`<button class="${n===selOpp?'on':''}" data-n="${n}">${n}</button>`).join('')}</div><p class="note">${selOpp+1} players including you</p></div>
  </div><div class="menu-foot"><button class="go" id="go">Start game</button></div></div>`).onclick=e=>{
    const r=e.target.closest('[data-r]');if(r){showRules(r.dataset.r,()=>showMenu(msg));return}
    const m=e.target.closest('[data-m]');if(m){selMode=m.dataset.m;if(selMode==='party'&&selOpp<5)selOpp=7;else if(selMode==='duo'&&![3,5].includes(selOpp))selOpp=3;else if(selMode!=='party'&&selOpp>5)selOpp=3;showMenu(msg);return}
    const dd=e.target.closest('[data-d]');if(dd){selDare=dd.dataset.d;showMenu(msg);return}
    const n=e.target.closest('[data-n]');if(n){selOpp=+n.dataset.n;showMenu(msg);return}
    if(e.target.id==='go'){closeModal();start(selOpp,selMode)}};
  $('#modal').oninput=e=>{if(e.target.id==='hr')houseText=e.target.value};
  const nb=document.querySelector('#modal .menu-body');if(nb)nb.scrollTop=st}

/* ---------- timed windows ---------- */
function race(label,ms,bots=[]){return new Promise(res=>{
  const bar=$('#actbar'),ts=[];let done=false;
  const fin=w=>{if(done)return;done=true;ts.forEach(clearTimeout);bar.classList.remove('on');res(w)};
  if(label){bar.innerHTML=`<button id="actbtn">${label}</button><i style="animation-duration:${ms}ms"></i>`;bar.classList.add('on');$('#actbtn').onclick=()=>fin('me')}
  ts.push(setTimeout(()=>fin(null),ms));
  bots.forEach(b=>ts.push(setTimeout(()=>fin(b.who),b.ms)));
})}
async function challengeWin(p){
  const bots=G.players.filter(x=>!x.human&&x!==p).filter(()=>Math.random()<(p.hand.length<=2?.4:.2)).map(b=>({who:b,ms:500+Math.random()*2000}));
  setStatus(p.human?'Waiting to see if anyone calls your bluff…':`Is ${p.name} lying? Challenge!`);
  const r=await race(p.human?null:`Challenge ${p.name}!`,3200,bots);
  return r==='me'?G.players[0]:r;
}
const PEN=()=>G.mode==='classic'?4:2;
const SCORED=()=>['spin','classic','attack','dare','triple'].includes(G.mode);
const PENT=()=>G.mode==='attack'?'hit the launcher twice':`draw ${PEN()}`;
async function penalty(p){if(G.mode==='attack')await hit(p,2);else draw(p,PEN())}
async function cosmic(p){
  if(p.human){
    setStatus('One card left: call COSMIC!');
    const bot=G.players.find(x=>!x.human&&!x.out);
    const r=await race('COSMIC! ✦',2600,bot?[{who:bot,ms:2200}]:[]);
    if(r==='me')log('You called COSMIC!');else{log(`${r?r.name:'Someone'} caught you! You ${PENT()}`);await penalty(p)}
  }else{
    if(Math.random()<.8){log(`${p.name}: "COSMIC!"`);await sleep(600);return}
    setStatus(`${p.name} forgot to call!`);
    const r=await race(G.players[0].out?null:`Catch ${p.name}!`,2400);
    if(r==='me'){log(`You caught ${p.name}! They ${PENT()}`);await penalty(p)}else log(`${p.name}: "COSMIC!" just in time`);
  }
}

/* ---------- shared turn plumbing ---------- */
function checkWin(){
  if(G.over)return true;
  const al=G.players.filter(p=>!p.out),w=G.roundWinner||al.find(p=>!p.hand.length&&!(p.vault&&p.vault.length))||(al.length===1?al[0]:null);
  if(!w)return false;
  G.over=true;G.humanTurn=false;render();
  if(SCORED()){roundOver(w);return true}
  {const mine=G.mode==='duo'?w.team===0:w.human;showMenu(mine?(G.mode==='duo'?'🏆 Your team wins! Nicely played.':'🏆 You win! Nicely played.'):(G.mode==='duo'?'The other team wins this round.':`${w.av} ${w.name} wins this round.`))}return true}
const cardPts=c=>c.k==='num'?c.n:['swild','wild4','allhit','hitfire','wdare','wclear','wgive'].includes(c.k)?50:(c.k==='discall'||c.k==='trade'||c.k==='disc2')?30:20;
function roundOver(w){
  const wi=G.players.indexOf(w);
  const pts=G.players.reduce((s,p)=>s+(p===w?0:p.hand.reduce((a,c)=>a+cardPts(c),0)),0);
  G.scores[wi]+=pts;
  const table=G.players.map((p,i)=>`${p.human?'You':p.name}: ${G.scores[i]}`).join(' · ');
  if(G.scores[wi]>=500){G.final=true;showMenu(`${w.human?'🏆 You reach':w.av+' '+w.name+' reaches'} 500 points!<br><small>${table}</small>`);return}
  modal(`<h2>${w.human?'You win':w.name+' wins'} the round: +${pts}</h2><p>${table}</p><p>First to 500 wins.</p><div class="cols"><button id="nr">Next round</button></div>`).onclick=e=>{if(e.target.id==='nr'){closeModal();G.round++;G.log=[];$('#log').innerHTML='';deal();run()}}}
async function speedPlay(p){
  const t=G.top;if(t.k!=='num')return null;
  const nxt=nextAlive(),match=h=>h.k==='num'&&h.c===t.c&&h.n===t.n;
  const elig=G.players.filter(q=>q!==p&&q!==nxt&&!q.out&&q.hand.some(match));
  if(!elig.length)return null;
  const hu=elig.find(q=>q.human),bots=elig.filter(q=>!q.human&&Math.random()<.3).map(b=>({who:b,ms:500+Math.random()*1500}));
  if(!hu&&!bots.length)return null;
  if(hu)setStatus(`⚡ Speed Play! You hold a matching ${desc(t)}`);
  const r=hu?await race(`⚡ Speed Play: ${desc(t)}`,2200,bots):await race(null,1200,bots);
  const q=r==='me'?hu:r;if(!q)return null;
  return{q,card:q.hand.find(match)}}
async function finishTurn(p,skip,noCos){
  if(G.mode==='gambit'){skip+=(G.carry||0);G.carry=0}
  render();if(checkWin())return;
  if(total(p)===1&&!noCos)await cosmic(p);
  if(checkWin())return;
  if(G.mode==='gambit'){const r=await gamble(p,skip);if(r)return}
  if(G.mode==='party'){const sp=await speedPlay(p);if(sp){log(`⚡ ${nm(sp.q)} speed-play${sp.q.human?'':'s'} ${desc(sp.card)}!`);G.cur=G.players.indexOf(sp.q);await playStd(sp.q,sp.card,{side:'r'});return}}
  advance(1+skip)}

/* ---------- Spin wheel ---------- */
const WHEEL=[{k:'almost',t:'Almost',i:'☝️'},{k:'dnum',t:'Discard Number',i:'#️⃣'},{k:'dcol',t:'Discard Color',i:'🎨'},{k:'dred',t:'Draw Red',i:'🟥'},{k:'dblue',t:'Draw Blue',i:'🟦'},{k:'trade',t:'Trade Hands',i:'🔄'},{k:'show',t:'Show Hand',i:'👁️'},{k:'war',t:'War',i:'⚔️'},{k:'unospin',t:'UNO Spin',i:'📣'}];
const WCOL=['#7d5cff','#e04cc2','#ff4f6d','#ffc43a','#35d49a','#4a9dff'];
async function showWheel(q,idx){
  const seg=360/WHEEL.length,bg=WHEEL.map((w,i)=>`${WCOL[i%6]} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
  modal(`<div class="wheelwrap"><div class="pointer">▼</div><div class="wheel" id="wheel" style="background:conic-gradient(${bg})">${WHEEL.map((w,i)=>{const a=i*seg+seg/2;return `<span class="wl" style="transform:rotate(${a}deg) translateY(-92px)"><i style="transform:translate(-50%,-50%) rotate(${-a}deg)">${w.i}</i></span>`}).join('')}</div><h2 id="wres">${q.human?'You spin':q.name+' spins'} the wheel…</h2></div>`);
  await sleep(80);
  $('#wheel').style.transform=`rotate(${1440-(idx*seg+seg/2)}deg)`;
  await sleep(2400);
  $('#wres').textContent=`${WHEEL[idx].i} ${WHEEL[idx].t}!`;
  await sleep(1300);closeModal()}
async function discardMany(q,cards){
  if(!cards.length)return;
  let top=cards[cards.length-1];
  if(cards.length>1){
    if(q.human)top=(await pickCards('Pick the card that ends up on top',cards,1,1,[cards[0]]))[0];
    else{const mc=mostColor(q);top=cards.find(c=>c.c===mc)||cards.find(c=>!isWild(c))||top}}
  G.disc.push(...cards.filter(c=>c!==top),top);G.topCard=top;
  const col=isWild(top)?(q.human?await pickColor('Choose a color'):mostColor(q)):top.c;
  G.top={c:col,k:isWild(top)?'wild':top.k,n:top.n};
  log(`${q.human?'You discard':q.name+' discards'} ${cards.length} card${cards.length===1?'':'s'}. Top: ${desc(G.top)}`);render()}
async function warRound(q){
  const used=new Map();let cont=G.players.filter(p=>p.hand.some(c=>c.k==='num'));
  if(!cont.length){log('Nobody has a number card');return q}
  let winner=null;
  for(let r=0;r<15&&!winner;r++){
    const prev=cont;
    const rev=cont.map(p=>({p,c:p.hand.filter(c=>c.k==='num'&&!(used.get(p)||[]).includes(c)).sort((a,b)=>b.n-a.n)[0]})).filter(x=>x.c);
    if(!rev.length){winner=pick(prev);break}
    rev.forEach(x=>used.set(x.p,[...(used.get(x.p)||[]),x.c]));
    await showCards(r?'War continues!':'War!',rev.map(x=>[x.p.human?'You':x.p.name,x.c]),1700);
    const mx=Math.max(...rev.map(x=>x.c.n));cont=rev.filter(x=>x.c.n===mx).map(x=>x.p);
    if(cont.length===1)winner=cont[0]}
  const cards=used.get(winner)||[];
  winner.hand=winner.hand.filter(c=>!cards.includes(c));
  log(`${winner.human?'You win':winner.name+' wins'} the war!`);
  await discardMany(winner,cards);return winner}

      q.hand=q.hand.filter(c=>!dis.includes(c));await discardMany(q,dis);break}
    case 'dred':case 'dblue':{
      const col=w.k==='dred'?'R':'B';let cnt=0;

      log(`${q.human?'You draw':q.name+' draws'} ${cnt} card${cnt===1?'':'s'}`);break}
