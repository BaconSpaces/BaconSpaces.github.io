    if(G.mode==='gambit'){G.chain=0;G.carry=0}
    if(G.mode==='triple'){const r=Math.random(),sz=r<.45?3:r<.85?2:1;G.lit=shuffle([0,1,2]).slice(0,sz).sort();render()}
    if(G.mode==='vault'&&!p.hand.length&&p.vault.length){await openVault(p);continue}
    if(G.mode==='dare'&&p.dare)await judgeDare(p);
    if(p.human)await humanTurn(p);else if(G.mode==='liars')await botTurn(p);else await botTurnStd(p);
    if(G.mode==='potato'&&!G.over)await passPotato(p);
    if(G.mode==='roundabout'&&!G.over){G.turns++;if(G.turns%aliveCount()===0)await rotateLap()}
  }}
function deal(){
  G.deck=shuffle(buildDeck(G.mode));G.disc=[];G.dir=1;G.cur=0;G.pending=0;G.lastVal=0;G.aside=[];G.roundWinner=null;G.over=false;G.humanTurn=false;G.drew=null;G.laying=false;
  G.mass=0;G.dbl=false;G.lit=[0,1,2];
  G.row=[];G.hist=[];G.lastFx=null;G.chain=0;G.carry=0;G.turns=0;G.rot=1;newBounty();
  G.players.forEach(p=>{p.bingos=new Set();p.daub=false;p.jam=false;p.lock=false;p.show=null;p.anchor=false;p.lucky=[];p.luck2=false;p.noLucky=false;p.ptr=0;p.blockNext=false;p.dump=false;p.shield=false;p.autoNo=false;p.hand=[];p.power=true;p.out=false;p.dare=null;p.act='L';p.vault=[]});
  G.frozen=null;
  G.players.forEach((p,i)=>{p.team=i%2});
  if(G.mode==='duo'){const pools=[[],[]];G.players.forEach((p,i)=>{p.hand=pools[i%2]})}
  const per=G.mode==='twin'||G.mode==='stacks'?8:G.mode==='duo'?5:G.mode==='pyramid'?10:G.mode==='bingo'?9:7;
  for(let r=0;r<per;r++)G.players.forEach(p=>{const c=G.deck.pop();if(G.mode==='twin')c.side=r<4?'L':'R';if(G.mode==='stacks')c.stk=r%3;if(G.mode==='pyramid')c.pos=r;if(G.mode==='bingo')c.gp=r;p.hand.push(c)});
  if(G.mode==='vault')for(let r=0;r<3;r++)G.players.forEach(p=>p.vault.push(G.deck.pop()));
  if(G.mode==='showcase')G.players.forEach(fixShow);
  if(G.mode==='observatory')refillRow();
  if(G.mode==='triple'){
    const take=()=>{const idx=G.deck.map((c,i)=>c.k==='num'?i:-1).filter(i=>i>=0).pop();return G.deck.splice(idx,1)[0]};
    G.piles=[0,1,2].map(()=>{const a=take();return{c:a.c,k:'num',n:a.n,wild:false,card:a,count:0,limit:5+Math.floor(Math.random()*8)}});
    G.top=G.piles[0];G.topCard=G.piles[0].card;G.topFace=true;return}
  if(G.mode==='eclipse'){
    const take=()=>{const idx=G.deck.map((c,i)=>c.k==='num'?i:-1).filter(i=>i>=0).pop();return G.deck.splice(idx,1)[0]};
    const a=take(),b=take(),mk=c=>({c:c.c,k:'num',n:c.n,card:c});
    G.piles=[mk(a),mk(b)];G.top=G.piles[0];G.topCard=a;G.topFace=true;return}
  if(G.mode==='allwild'){const first=G.deck.pop();G.disc.push(first);G.top={c:null,k:'wild'};G.topCard=first;G.topFace=true;return}
  const idx=G.deck.map((c,i)=>c.k==='num'&&!c.liar&&!c.spin?i:-1).filter(i=>i>=0).pop(),first=G.deck.splice(idx,1)[0];
  G.disc.push(first);G.top={c:first.c,k:'num',n:first.n};G.topCard=first;G.topFace=true}
function start(n,mode){
  G={mode,players:[{name:'You',human:true,hand:[],power:true},...Array.from({length:n},(_,i)=>({name:NAMES[i],av:AV[i],hand:[],power:true}))],log:[],scores:Array(n+1).fill(0),round:1,dares:buildDares(),dareList:selDare};
  deal();$('#log').innerHTML='';$('#modeTag').textContent=MODES[mode].name;waiter=null;run()}

document.addEventListener('click',e=>{
  const cd=e.target.closest('#hand .card, #starrow .card, #opps .showc .card');
  if(cd&&G){
    const isStar=!!cd.closest('#starrow');
    const isOpp=!!cd.closest('#opps');
    const c=isStar?G.row.find(x=>x.id==cd.dataset.id):isOpp?(()=>{const q=G.players.find(x=>x!==G.players[0]&&x.show==cd.dataset.id);return q&&!q.lock?q.hand.find(h=>h.id==cd.dataset.id):null})():G.players[0].hand.find(x=>x.id==cd.dataset.id);
    if(isOpp&&!c){setStatus('🔒 That display card is padlocked');return}
    if(c){
      const touch=e.pointerType==='touch'||Date.now()-lastTouch<700;
      if(touch&&cd.dataset.tip&&String(armed)!==String(c.id)){clearArmed();armed=c.id;cd.classList.add('armed');showTip(cd,isStar?'Tap again to take it':'Tap again to play');return}
      clearArmed();hideTip();
      if(isStar)act({t:'draw',star:c.id});else act({t:'play',card:c})}
    return}
  if(e.target.closest('#drawBtn,#drawPile'))act({t:'draw'});
  if(e.target.closest('#passBtn'))act({t:'pass'});
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&(e.target.classList.contains('card')||e.target.classList.contains('mode'))){e.preventDefault();e.target.click()}});
$('#rulesBtn').onclick=()=>{if(!$('#modal').classList.contains('on'))showRules(G?G.mode:selMode,()=>{})};
$('#newBtn').onclick=()=>location.reload();
let lastTouch=0,tipTimer=null,lpTimer=null,tipSuppress=false,armed=null,infoMode=false;
const touchUI=()=>!!(window.matchMedia&&window.matchMedia('(hover: none)').matches)||innerWidth<600;
function clearArmed(){armed=null;if(document.querySelectorAll)document.querySelectorAll('.card.armed').forEach(x=>x.classList.remove('armed'))}
function showTip(el,extra){
  const t=el.getAttribute('data-tip');if(!t)return;
  const tip=$('#tip');tip.innerHTML=t+(extra?`<div class="tiphint">${extra}</div>`:'');tip.style.display='block';
  clearTimeout(tipTimer);
  if(touchUI()){tip.classList.add('dock');tip.style.left='';tip.style.top='';tipTimer=setTimeout(()=>{hideTip();clearArmed()},7000);return}
  tip.classList.remove('dock');
  const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  const x=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2));
  let y=r.top-h-10;if(y<8)y=r.bottom+10;
  tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){const t=$('#tip');if(t)t.style.display='none'}
const tipCard=e=>e.target&&e.target.closest?e.target.closest('.card[data-tip]'):null;
document.addEventListener('mouseover',e=>{if(Date.now()-lastTouch<800)return;const c=tipCard(e);if(c)showTip(c)});
document.addEventListener('mouseout',e=>{if(Date.now()-lastTouch<800)return;if(tipCard(e))hideTip()});
document.addEventListener('focusin',e=>{const c=tipCard(e);if(c&&Date.now()-lastTouch>800)showTip(c)});
document.addEventListener('focusout',()=>{if(Date.now()-lastTouch>800)hideTip()});
document.addEventListener('touchstart',e=>{
  lastTouch=Date.now();const c=tipCard(e);
  hideTip();if(!c)clearArmed();
  clearTimeout(lpTimer);
  if(c)lpTimer=setTimeout(()=>{showTip(c);tipSuppress=true;setTimeout(()=>{tipSuppress=false},3000)},450)},{passive:true});
document.addEventListener('touchend',()=>clearTimeout(lpTimer));
document.addEventListener('touchmove',()=>{clearTimeout(lpTimer);hideTip()},{passive:true});
document.addEventListener('click',e=>{
  if(tipSuppress){tipSuppress=false;e.stopImmediatePropagation();e.preventDefault();return}
  if(infoMode){const c=tipCard(e);if(c){e.stopImmediatePropagation();e.preventDefault();showTip(c);if(!touchUI()){clearTimeout(tipTimer);tipTimer=setTimeout(hideTip,7000)}}}
},true);
window.addEventListener('scroll',()=>{if(!touchUI())hideTip()},true);
$('#infoBtn').onclick=()=>{
  infoMode=!infoMode;const b=$('#infoBtn');
  b.classList.toggle('on',infoMode);b.setAttribute('aria-pressed',String(infoMode));
  b.textContent=infoMode?'ℹ Info: on':'ℹ Info';
  document.body.classList.toggle('infomode',infoMode);hideTip();clearArmed()};
showMenu();
</script>
